## template: jinja
#cloud-config

# ---
# lxd transcript: Automated scalable cloud-init install of LXD
# version: 2.0.0
#
# Synthesized by: Pablo Gonzalez De Greiff @ Canonical
# ---

# ==========================================
# DEFAULT JINJA CONFIGURATIONS
# ==========================================

# --- Architecture Toggle ---
{% set custom_nested_lxd = True %}
{% set custom_update_n_upgrade = True %}            # PROMPT:Auto Update & Upgrade

# --- Auth & System ---
{% set custom_repro_name = "lxd" %}
{% set custom_vm_name = "node-0" %}
{% set custom_vm_image = "ubuntu:24.04" %}          # PROMPT:Primary VM Image
{% set custom_ssh_key = "" %}
{% set custom_ssh_import_id = "" %}
{% set custom_sys_user = "ubuntu" %}                # PROMPT:System User
{% set custom_password = "ubuntu" %}                # PROMPT:System Password
{% set custom_pro_token = "" %}                     # PROMPT:Pro Token
{% set custom_hostname = "" %}                      # PROMPT:Hostname
{% set custom_tld = "" %}                           # PROMPT:Top Level Domain
{% set custom_timezone = "America/New_York" %}      # PROMPT:Timezone

# --- Channels ---
{% set custom_lxd_channel = "5.21/stable" %}        # PROMPT:LXD Channel

# --- LXD Settings ---
{% set custom_lxd_project = "default" %}
{% set custom_lxd_pool = "default" %}               # PROMPT:LXD Storage Pool
{% set custom_lxd_bridge = "lbr0" %}                # PROMPT:LXD Bridge Name [BRIDGE:dhcp=true,cidr=lxd_cidr]
{% set custom_lxd_cidr = "10.10.0.0/22" %}

# --- Hardware Allocation ---
# Total: ( CPU = 19 | RAM = 48GiB | DISK = 180GiB )

# Primary VM
{% set custom_primary_cpu = "4" %}                  # PROMPT:Primary VM CPU cores
{% set custom_primary_ram = "8GiB" %}               # PROMPT:Primary VM RAM
{% set custom_primary_disk = "30GiB" %}             # PROMPT:Primary VM Root Disk

# Machines Defaults per node
{% set custom_node_ha = 5 %}                        # PROMPT:Number of Machines
{% set custom_node_cpu = "3" %}                     # PROMPT:Machine CPU cores
{% set custom_node_ram = "8GiB" %}                  # PROMPT:Machine RAM
{% set custom_node_disk = "30GiB" %}                # PROMPT:Machine Root Disk

# ==========================================
# DATASOURCE PARSER (LXD vs Cloud)
# ==========================================

{% if cloud_name == "lxd" %}
  {% set meta = {} %}
  {% for key, value in ds.config.items() %}
    {% if key.startswith("user_") %}
      {% set _ = meta.__setitem__(key[5:], value) %}
    {% endif %}
  {% endfor %}
{% else %}
  {% set meta = ds.meta_data.get("meta") if ds.meta_data.get("meta") else {} %}
{% endif %}

# ==========================================
# VARIABLE BINDINGS
# ==========================================

{% set vm_image = meta.get("vm_image") or custom_vm_image %}
{% set ssh_key = meta.get("ssh_key") or custom_ssh_key %}
{% set ssh_import_id = meta.get("ssh_import_id") or custom_ssh_import_id %}
{% set sys_user = meta.get("sys_user") or custom_sys_user %}
{% set password = meta.get("password") or custom_password %}
{% set pro_token = meta.get("pro_token") or custom_pro_token %}
{% set hostname_base = meta.get("hostname") or custom_hostname %}
{% set tld = meta.get("tld") or custom_tld %}
{% set timezone = meta.get("timezone") or custom_timezone %}

{% set lxd_channel = meta.get("lxd_channel") or custom_lxd_channel %}

{% set lxd_project = meta.get("lxd_project") or custom_lxd_project %}
{% set lxd_pool = meta.get("lxd_pool") or custom_lxd_pool %}
{% set lxd_cert_b64 = meta.get("lxd_cert_b64") %}
{% set lxd_key_b64 = meta.get("lxd_key_b64") %}
{% set lxd_bridge = meta.get("lxd_bridge") or custom_lxd_bridge %}
{% set lxd_cidr = meta.get("lxd_cidr") or custom_lxd_cidr %}

{% set node_ha = meta.get("node_ha") | default(custom_node_ha, true) | int %}
{% set node_cpu = meta.get("node_cpu") or custom_node_cpu %}
{% set node_ram = meta.get("node_ram") or custom_node_ram %}
{% set node_disk = meta.get("node_disk") or custom_node_disk %}

{% if meta.get("nested_lxd") is not none %}
  {% set nested_lxd = (meta.get("nested_lxd") | string | lower == "true") %}
{% else %}
  {% set nested_lxd = (custom_nested_lxd | string | lower == "true") %}
{% endif %}

{% if meta.get("update_n_upgrade") is not none %}
  {% set update_n_upgrade = (meta.get("update_n_upgrade") | string | lower == "true") %}
{% else %}
  {% set update_n_upgrade = (custom_update_n_upgrade | string | lower == "true") %}
{% endif %}

# ==========================================
# CIDR GATEWAY AUTO-CALCULATOR
# ==========================================

{% set _lxd_cidr_parts = lxd_cidr.split('/') %}
{% set _lxd_ip_octets = _lxd_cidr_parts[0].split('.') %}
{% set lxd_gateway = _lxd_ip_octets[0] ~ '.' ~ _lxd_ip_octets[1] ~ '.' ~ _lxd_ip_octets[2] ~ '.1' %}
{% set lxd_prefix = _lxd_cidr_parts[1] %}

# ==========================================
# DYNAMIC HA NODE GENERATOR
# ==========================================

{% set max_ha = [node_ha] | max %}

{% set hostnames_list = [] %}
{% set cpus_list = [] %}
{% set rams_list = [] %}
{% set disks_list = [] %}

# 1. Generate Nodes
{% for i in range(1, node_ha + 1) %}
  {% set _ = hostnames_list.append("node-" ~ i) %}
  {% set _ = cpus_list.append(node_cpu) %}
  {% set _ = rams_list.append(node_ram) %}
  {% set _ = disks_list.append(node_disk) %}
{% endfor %}

# Compile final strings
{% set nodes_hostnames = hostnames_list | join(" ") %}
{% set nodes_cpus = cpus_list | join(" ") %}
{% set nodes_rams = rams_list | join(" ") %}
{% set nodes_disks = disks_list | join(" ") %}

# ==========================================
# DYNAMIC STORAGE CALCULATOR
# ==========================================

# Dynamic Nested Storage Calculation
{% set ns = namespace(total_storage=0) %}
{% for disk in nodes_disks.split(' ') %}
  {% set disk_val = disk | replace('GiB', '') | replace('GB', '') | int %}
  {% set ns.total_storage = ns.total_storage + disk_val %}
{% endfor %}

# Add a 10GB buffer
{% set final_total = ns.total_storage + 10 %}
{% set nested_storage = final_total | string ~ 'GiB' %}

# ==========================================
# STANDARD CLOUD-INIT EXECUTION
# ==========================================

# Create Hostname / FQDN
{% set base_name = local_hostname if hostname_base == "" else hostname_base %}
{% if tld %}
fqdn: {{ base_name }}.{{ tld }}
prefer_fqdn_over_hostname: true
{% else %}
hostname: {{ base_name }}
{% endif %}

# Create user and config auth
users:
  - name: {{ sys_user }}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: adm, sys, lxd, sudo
    shell: /bin/bash
{% if not ssh_key and not ssh_import_id %}
    plain_text_passwd: "{{ password }}"
    lock_passwd: false
{% endif %}
{% if ssh_key %}
    ssh_authorized_keys:
      - {{ ssh_key }}
{% endif %}
{% if ssh_import_id %}
    ssh_import_id:
      - {{ ssh_import_id }}
{% endif %}

# Enable SSH Password Auth ONLY if no keys are provided
{% if not ssh_key and not ssh_import_id %}
ssh_pwauth: true
{% else %}
ssh_pwauth: false
{% endif %}

# Config Ubuntu Pro
{% if pro_token %}
ubuntu_pro:
  token: {{ pro_token }}
{% endif %}

timezone: {{ timezone }}

packages:
  - git
  - neovim
  - jq

snap:
  commands:
  - snap install lxd --channel={{ lxd_channel }}

package_update: {{ 'true' if update_n_upgrade else 'false' }}
package_upgrade: {{ 'true' if update_n_upgrade else 'false' }}
package_reboot_if_required: {{ 'true' if update_n_upgrade else 'false' }}

{% if nested_lxd %}
# If Nested: Seed the LXD database natively via cloud-init
lxd:
  preseed: |
    config:
      core.https_address: '[::]:8444'
    networks:
    - config:
        ipv4.address: {{ lxd_gateway }}/{{ lxd_prefix }}
        ipv4.dhcp: "true"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Bridge for LXD"
      name: {{ lxd_bridge }}
      type: bridge
      project: default
    storage_pools:
    - config:
        size: {{ nested_storage }}
      description: "Nested ZFS Storage"
      name: default
      driver: zfs 
    profiles:
    - config:
        limits.cpu: "2"
        limits.memory: 6GiB
      description: "Default LXD profile"
      devices:
        eth0:
          name: eth0
          network: {{ lxd_bridge }}
          type: nic
        root:
          path: /
          pool: default
          type: disk
      name: default
    projects: []
    cluster: null
{% endif %}

write_files:
# Auto login script helper function (LXD)
- path: /etc/profile.d/lxd-login.sh
  permissions: '0644'
  content: |
    if [ "$USER" = "{{ sys_user }}" ]; then
        if command -v lxc >/dev/null 2>&1; then
            : # Prevent bash syntax error if Jinja strips the lines below
            {% if not nested_lxd %}
            lxc remote switch host-lxd >/dev/null 2>&1 || true
            {% endif %}
            {% if lxd_project != "default" %}
            lxc project switch {{ lxd_project }} >/dev/null 2>&1 || true
            {% endif %}
        fi
        
        if [ -f "/etc/repro-env" ]; then
            source /etc/repro-env
        fi
    fi

- path: /etc/profile.d/default-editor.sh
  permissions: '0644'
  content: |
    export EDITOR=nvim

- path: /etc/sudoers.d/keep-editor
  permissions: '0440'
  content: |
    Defaults env_keep += "EDITOR"

{% if not nested_lxd and lxd_cert_b64 and lxd_key_b64 %}
# Non-nested specific files (Host's LXD Certificates)
- path: /root/snap/lxd/common/config/client.crt
  owner: root:root
  permissions: '0644'
  encoding: b64
  content: {{ lxd_cert_b64 }}

- path: /root/snap/lxd/common/config/client.key
  owner: root:root
  permissions: '0600'
  encoding: b64
  content: {{ lxd_key_b64 }}
{% endif %}

# ==========================================
# START OF AUTOMATION SCRIPTS (00 to 04)
# ==========================================

- path: /usr/local/bin/00-generate-env
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    # Define colors first
    BRED='\033[1;31m'
    BYELLOW='\033[1;33m'
    BGREEN='\033[1;32m'
    NC='\033[0m'
    
    echo -e "\n\n${BYELLOW}-------- Generating Runtime Environment... --------${NC}\n"
    
    # 1. Calculate Runtime Variables
    IP_ADDRESS=$(hostname -I | awk '{print $1}')
    INTERFACE=$(ip -j route show default | jq -r '.[].dev')
    
    # LXD Setup Logic
    {% if nested_lxd %}
    LXD_ADDR="${IP_ADDRESS}:8444"
    LXD_CERT="/root/lxd-local.crt"
    LXD_KEY="/root/lxd-local.key"
    {% else %}
    LXD_ADDR="{{ lxd_gateway }}:8443"
    LXD_CERT="/root/snap/lxd/common/config/client.crt"
    LXD_KEY="/root/snap/lxd/common/config/client.key"
    {% endif %}
    
    # 2. Write Base Variables to the Persistent State File
    cat <<EOF > /etc/repro-env
    # -- Colours --
    export BRED='${BRED}'
    export BYELLOW='${BYELLOW}'
    export BGREEN='${BGREEN}'
    export NC='${NC}'
    # ----
    export IP_ADDRESS="$IP_ADDRESS"
    export INTERFACE="$INTERFACE"
    export RUN_AS="sudo -u {{ sys_user }}"
    export RUN_AS_LOGIN="sudo -i -u {{ sys_user }}"
    export LXD_ADDR="$LXD_ADDR"
    export LXD_CERT="$LXD_CERT"
    export LXD_KEY="$LXD_KEY"
    EOF
    
    # 3. Secure the state file (Only root and sys_user can read it)
    chown {{ sys_user }}:{{ sys_user }} /etc/repro-env
    chmod 600 /etc/repro-env

- path: /usr/local/bin/01-verify-deps
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Verify critical dependencies
    echo -e "\n\n${BYELLOW}-------- Verifying dependencies... --------${NC}\n"
    
    for cmd in lxc jq; do
      if ! command -v $cmd >/dev/null 2>&1; then
        echo "CRITICAL ERROR: Required command '$cmd' not found."
        echo "Snap/apt package installation likely failed due to a network error."
        exit 1
      fi
    done
    echo "All dependencies verified successfully!"

- path: /usr/local/bin/02-lxd-setup
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    {% if nested_lxd %}
    
    # Generate local LXD trust certificate
    echo -e "\n\n${BYELLOW}-------- Generating trust certificate for local LXD... --------${NC}\n"
    
    openssl req -x509 -newkey rsa:2048 -keyout $LXD_KEY -out $LXD_CERT -nodes -days 3650 -subj "/CN=lxd-local"
    lxc config trust add $LXD_CERT --name lxd-local
    
    # Provide certs to user context
    $RUN_AS mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    {% else %}
    
    # Setup external LXD client certificates and remote connection
    echo -e "\n\n${BYELLOW}-------- Configuring remote LXD connection... --------${NC}\n"
    
    lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    lxc remote switch host-lxd
    
    # Provide certs to user context
    $RUN_AS mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    $RUN_AS lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    
    {% endif %}
    
    {% if lxd_project != "default" %}
    
    # Switch to LXD project
    echo -e "\n\n${BYELLOW}-------- Switching to LXD '{{ lxd_project }}' project... --------${NC}\n"
    
    lxc project switch {{ lxd_project }}
    
    {% endif %}

- path: /usr/local/bin/03-vm-creation
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create VMs directly via LXD
    echo -e "\n\n${BYELLOW}-------- Creating VMs in LXD... --------${NC}\n"
    
    i=1
    for HOST in {{ nodes_hostnames }}; do
      CPU=$(echo "{{ nodes_cpus }}" | cut -d' ' -f$i)
      RAM=$(echo "{{ nodes_rams }}" | cut -d' ' -f$i)
      DISK=$(echo "{{ nodes_disks }}" | cut -d' ' -f$i)
      
      lxc init "$HOST" --vm -c limits.cpu="$CPU" -c limits.memory="$RAM" -d root,size="$DISK"
      
      i=$((i + 1))
    done

- path: /usr/local/bin/04-vm-start
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Start VMs
    echo -e "\n\n${BYELLOW}-------- Starting VMs... --------${NC}\n"
    for HOST in {{ nodes_hostnames }}; do
      lxc start $HOST
    done
    
    echo -e "\n\n${BYELLOW}-------- Finished deploying LXD, have fun!... --------${NC}\n"

# ==========================================
# END OF AUTOMATION SCRIPTS (00 to 04)
# ==========================================

runcmd:
- 00-generate-env
- 01-verify-deps || exit 1
- 02-lxd-setup
- 03-vm-creation
- 04-vm-start
