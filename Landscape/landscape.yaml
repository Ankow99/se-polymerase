## template: jinja
#cloud-config

# ---
# landscape transcript: Automated scalable cloud-init install of Landscape HA using Juju + MAAS
# version: 3.0.0
#
# Synthesized by: Pablo Gonzalez De Greiff @ Canonical
# ---

# ==========================================
# DEFAULT JINJA CONFIGURATIONS
# ==========================================

# --- Architecture Toggle ---
{% set custom_nested_lxd = True %}
{% set custom_maas_snap = True %}
{% set custom_update_n_upgrade = True %}            # PROMPT:Auto Update & Upgrade

# --- Auth & System ---
{% set custom_repro_name = "landscape" %}
{% set custom_vm_name = "maas-1" %}
{% set custom_vm_image = "ubuntu:24.04" %}          # PROMPT:Primary VM Image
{% set custom_ssh_key = "" %}
{% set custom_ssh_import_id = "" %}
{% set custom_sys_user = "ubuntu" %}                # PROMPT:System User
{% set custom_password = "ubuntu" %}                # PROMPT:System Password
{% set custom_pro_token = "" %}                     # PROMPT:Pro Token
{% set custom_hostname = "" %}                      # PROMPT:Hostname
{% set custom_tld = "landscape" %}                  # PROMPT:Top Level Domain
{% set custom_timezone = "America/New_York" %}      # PROMPT:Timezone
{% set custom_timeout = "45m" %}                    # PROMPT:Juju Wait Timeout

# --- Channels ---
{% set custom_lxd_channel = "5.21/stable" %}                  # PROMPT:LXD Channel
{% set custom_maas_channel = "3.7/stable" %}                  # PROMPT:MAAS Channel
{% set custom_juju_channel = "3.6/stable" %}                  # PROMPT:Juju Channel
{% set custom_juju_base = "ubuntu@22.04" %}                   # PROMPT:Juju Base
{% set custom_haproxy_channel = "latest/stable" %}            # PROMPT:HAProxy Channel
{% set custom_haproxy_base = "ubuntu@24.04" %}                # PROMPT:HAProxy Base
{% set custom_postgresql_channel = "14/stable" %}             # PROMPT:PostreSQL Channel
{% set custom_postgresql_base = "ubuntu@22.04" %}             # PROMPT:PostreSQL Base
{% set custom_rabbitmq_channel = "3.9/stable" %}              # PROMPT:RabbitMQ Channel
{% set custom_rabbitmq_base = "ubuntu@22.04" %}               # PROMPT:RabbitMQ Base
