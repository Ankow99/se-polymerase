{% set ssh_import_id = meta.get("ssh_import_id") or custom_ssh_import_id %}
{% set sys_user = meta.get("sys_user") or custom_sys_user %}
{% set password = meta.get("password") or custom_password %}
{% set pro_token = meta.get("pro_token") or custom_pro_token %}
{% set hostname_base = meta.get("hostname") or custom_hostname %}
{% set tld = meta.get("tld") or custom_tld %}
{% set timezone = meta.get("timezone") or custom_timezone %}
{% set timeout = meta.get("timeout") or custom_timeout %}

{% set lxd_channel = meta.get("lxd_channel") or custom_lxd_channel %}
{% set maas_channel = meta.get("maas_channel") or custom_maas_channel %}
{% set juju_channel = meta.get("juju_channel") or custom_juju_channel %}
{% set juju_base = meta.get("juju_base") or custom_juju_base %}
{% set haproxy_channel = meta.get("haproxy_channel") or custom_haproxy_channel %}
{% set haproxy_base = meta.get("haproxy_base") or custom_haproxy_base %}
{% set postgresql_channel = meta.get("postgresql_channel") or custom_postgresql_channel %}
{% set postgresql_base = meta.get("postgresql_base") or custom_postgresql_base %}
{% set rabbitmq_channel = meta.get("rabbitmq_channel") or custom_rabbitmq_channel %}
{% set rabbitmq_base = meta.get("rabbitmq_base") or custom_rabbitmq_base %}
{% set landscape_server_channel = meta.get("landscape_server_channel") or custom_landscape_server_channel %}
{% set landscape_server_base = meta.get("landscape_server_base") or custom_landscape_server_base %}
{% set landscape_client_channel = meta.get("landscape_client_channel") or custom_landscape_client_channel %}

{% set lxd_project = meta.get("lxd_project") or custom_lxd_project %}
{% set lxd_pool = meta.get("lxd_pool") or custom_lxd_pool %}
{% set lxd_cert_b64 = meta.get("lxd_cert_b64") %}
{% set lxd_key_b64 = meta.get("lxd_key_b64") %}

{% set maas_db_name = meta.get("maas_db_name") or custom_maas_db_name %}
{% set maas_user = meta.get("maas_user") or custom_maas_user %}
{% set maas_password = meta.get("maas_password") or custom_maas_password %}
{% set maas_email = meta.get("maas_email") or custom_maas_email %}
{% set maas_images = meta.get("maas_images") or custom_maas_images %}
{% set maas_dns = meta.get("maas_dns") or custom_maas_dns %}
{% set maas_bridge = meta.get("maas_bridge") or custom_maas_bridge %}
{% set maas_cidr = meta.get("maas_cidr") or custom_maas_cidr %}
{% set maas_ip_count = meta.get("maas_ip_count") | default(custom_maas_ip_count, true) | int %}

{% set juju_ha = meta.get("juju_ha") | default(custom_juju_ha, true) | int %}
{% set juju_cpu = meta.get("juju_cpu") or custom_juju_cpu %}
{% set juju_ram = meta.get("juju_ram") or custom_juju_ram %}
{% set juju_disk = meta.get("juju_disk") or custom_juju_disk %}

{% set node_ha = meta.get("node_ha") | default(custom_node_ha, true) | int %}
{% set node_cpu = meta.get("node_cpu") or custom_node_cpu %}
{% set node_ram = meta.get("node_ram") or custom_node_ram %}
{% set node_disk = meta.get("node_disk") or custom_node_disk %}

{% set client_ha = meta.get("client_ha") | default(custom_client_ha, true) | int %}
{% set client_cpu = meta.get("client_cpu") or custom_client_cpu %}
{% set client_ram = meta.get("client_ram") or custom_client_ram %}
{% set client_disk = meta.get("client_disk") or custom_client_disk %}
{% set client_base = meta.get("client_base") or custom_client_base %}

{% if meta.get("nested_lxd") is not none %}
  {% set nested_lxd = (meta.get("nested_lxd") | string | lower == "true") %}
{% else %}
  {% set nested_lxd = (custom_nested_lxd | string | lower == "true") %}
{% endif %}

{% if meta.get("maas_snap") is not none %}
  {% set maas_snap = (meta.get("maas_snap") | string | lower == "true") %}
{% else %}
  {% set maas_snap = (custom_maas_snap | string | lower == "true") %}
{% endif %}

{% if meta.get("update_n_upgrade") is not none %}
  {% set update_n_upgrade = (meta.get("update_n_upgrade") | string | lower == "true") %}
{% else %}
  {% set update_n_upgrade = (custom_update_n_upgrade | string | lower == "true") %}
{% endif %}

# ==========================================
# CIDR GATEWAY AUTO-CALCULATOR
# ==========================================

{% set _maas_cidr_parts = maas_cidr.split('/') %}
{% set _maas_ip_octets = _maas_cidr_parts[0].split('.') %}
{% set maas_gateway = _maas_ip_octets[0] ~ '.' ~ _maas_ip_octets[1] ~ '.' ~ _maas_ip_octets[2] ~ '.1' %}
{% set maas_prefix = _maas_cidr_parts[1] %}

# ==========================================
# DYNAMIC HA NODE GENERATOR
# ==========================================

{% set max_ha = [juju_ha, node_ha, client_ha] | max %}

{% set hostnames_list = [] %}
{% set cpus_list = [] %}
{% set rams_list = [] %}
{% set disks_list = [] %}

# 1. Generate Juju Controllers
{% for i in range(1, juju_ha + 1) %}
  {% set _ = hostnames_list.append("juju-controller-" ~ i) %}
  {% set _ = cpus_list.append(juju_cpu) %}
  {% set _ = rams_list.append(juju_ram) %}
  {% set _ = disks_list.append(juju_disk) %}
{% endfor %}

# 2. Generate Nodes
{% for i in range(1, node_ha + 1) %}
  {% set _ = hostnames_list.append("node-" ~ i) %}
  {% set _ = cpus_list.append(node_cpu) %}
  {% set _ = rams_list.append(node_ram) %}
  {% set _ = disks_list.append(node_disk) %}
{% endfor %}

# 3. Generate Client Nodes
{% for i in range(1, client_ha + 1) %}
  {% set _ = hostnames_list.append("client-" ~ i) %}
  {% set _ = cpus_list.append(client_cpu) %}
  {% set _ = rams_list.append(client_ram) %}
  {% set _ = disks_list.append(client_disk) %}
{% endfor %}

# Compile final strings
{% set nodes_hostnames = hostnames_list | join(" ") %}
{% set nodes_cpus = cpus_list | join(" ") %}
{% set nodes_rams = rams_list | join(" ") %}
{% set nodes_disks = disks_list | join(" ") %}

# ==========================================
# DYNAMIC STORAGE CALCULATOR
# ==========================================

# Dynamic Nested Storage Calculation
{% set ns = namespace(total_storage=0) %}
{% for disk in nodes_disks.split(' ') %}
  {% set disk_val = disk | replace('GiB', '') | replace('GB', '') | int %}
  {% set ns.total_storage = ns.total_storage + disk_val %}
{% endfor %}

# Add a 10GB buffer
{% set final_total = ns.total_storage + 10 %}
{% set nested_storage = final_total | string ~ 'GiB' %}

# ==========================================
# STANDARD CLOUD-INIT EXECUTION
# ==========================================

# Create Hostname / FQDN
{% set base_name = local_hostname if hostname_base == "" else hostname_base %}
{% if tld %}
fqdn: {{ base_name }}.{{ tld }}
prefer_fqdn_over_hostname: true
{% else %}
hostname: {{ base_name }}
{% endif %}

# Create user and config auth
users:
  - name: {{ sys_user }}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: adm, sys, lxd, sudo
    shell: /bin/bash
{% if not ssh_key and not ssh_import_id %}
    plain_text_passwd: "{{ password }}"
    lock_passwd: false
{% endif %}
{% if ssh_key %}
    ssh_authorized_keys:
      - {{ ssh_key }}
{% endif %}
{% if ssh_import_id %}
    ssh_import_id:
      - {{ ssh_import_id }}
{% endif %}

# Enable SSH Password Auth ONLY if no keys are provided
{% if not ssh_key and not ssh_import_id %}
ssh_pwauth: true
{% else %}
ssh_pwauth: false
{% endif %}

# Config Ubuntu Pro
{% if pro_token %}
ubuntu_pro:
  token: {{ pro_token }}
{% endif %}

timezone: {{ timezone }}

packages:
  - git
  - neovim
  - jq

{% if not maas_snap %}
apt:
  sources:
    maas:
      source: 'ppa:maas/{{ maas_channel.split('/')[0] }}'
{% endif %}

snap:
  commands:
  - snap install lxd --channel={{ lxd_channel }}
{% if maas_snap %}
  - snap install maas --channel={{ maas_channel }}
{% endif %}
  - snap install juju --channel={{ juju_channel }}

package_update: {{ 'true' if update_n_upgrade else 'false' }}
package_upgrade: {{ 'true' if update_n_upgrade else 'false' }}
package_reboot_if_required: {{ 'true' if update_n_upgrade else 'false' }}

{% if nested_lxd %}
# If Nested: Seed the LXD database natively via cloud-init
lxd:
  preseed: |
    config:
      core.https_address: '[::]:8444'
    networks:
    - config:
        ipv4.address: {{ maas_gateway }}/{{ maas_prefix }}
        ipv4.dhcp: "false"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Non-DHCP NAT bridge for MAAS"
      name: {{ maas_bridge }}
      type: bridge
      project: default
    storage_pools:
    - config:
        size: {{ nested_storage }}
      description: "Nested ZFS Storage"
      name: default
      driver: zfs 
    profiles:
    - config:
        limits.cpu: "2"
        limits.memory: 6GiB
      description: "Default LXD profile"
      devices:
        eth0:
          name: eth0
          network: {{ maas_bridge }}
          type: nic
        root:
          path: /
          pool: default
          type: disk
      name: default
    projects: []
    cluster: null
{% endif %}

write_files:
# Auto login script helper function (MAAS - LXD)
- path: /etc/profile.d/maas-login.sh
  permissions: '0644'
  content: |
    if [ "$USER" = "{{ sys_user }}" ]; then
        ADMIN_USER="{{ maas_user }}"
        if command -v maas >/dev/null 2>&1 && sudo maas apikey --username {{ maas_user }} >/dev/null 2>&1; then
            maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $(sudo maas apikey --username {{ maas_user }}) >/dev/null 2>&1
        fi
        
        if command -v lxc >/dev/null 2>&1; then
            : # Prevent bash syntax error if Jinja strips the lines below
            {% if not nested_lxd %}
            lxc remote switch host-lxd >/dev/null 2>&1 || true
            {% endif %}
            {% if lxd_project != "default" %}
            lxc project switch {{ lxd_project }} >/dev/null 2>&1 || true
            {% endif %}
        fi
        
        if [ -f "/etc/repro-env" ]; then
            source /etc/repro-env
        fi
    fi

# MAAS Pretty table JSON parser - maast()
- path: /usr/local/bin/maast
  permissions: '0755'
  content: |
    #!/bin/bash
    out=$(maas "$@")
    ret=$?

    if [ $ret -ne 0 ] || [ -z "$out" ] || ! echo "$out" | jq -e . >/dev/null 2>&1; then
        echo "$out"
        exit $ret
    fi

    target="$2"

    # Helper function to align and draw OpenStack-style tables
    prettify() {
        python3 -c '
    import sys
    # 1. Read input and strip empty lines
    raw_lines = [line.strip("\n").split("\t") for line in sys.stdin if line.strip("\n")]
    
    # 2. Handle completely empty results gracefully
    if not raw_lines:
        print("\n[ No records found. ]\n")
        sys.exit(0)
    
    # 3. Remove the legacy dash separator from jq if it exists
    if len(raw_lines) > 1 and all(cell.replace("-", "").strip() == "" for cell in raw_lines[1]):
        raw_lines.pop(1)
        
    # 4. Catch empty strings and convert to "-" for a solid grid
    lines = [["-" if cell == "" or cell == "null" else cell for cell in row] for row in raw_lines]
        
    # 5. Calculate optimal column widths
    col_widths = [max(len(str(item)) for item in col) for col in zip(*lines)]
    
    def print_sep():
        print("+" + "+".join("-" * (w + 2) for w in col_widths) + "+")
        
    print("")
    print_sep()
    # 6. Print headers CENTERED
    print("| " + " | ".join(str(item).center(w) for item, w in zip(lines[0], col_widths)) + " |")
    print_sep()
    
    # 7. Print data LEFT-ALIGNED
    for row in lines[1:]:
        row_ext = row + [""] * (len(col_widths) - len(row))
        print("| " + " | ".join(str(item).ljust(w) for item, w in zip(row_ext, col_widths)) + " |")
        
    print_sep()
    '
    }

    case "$target" in
        machines|machine|nodes|node)
            echo "$out" | jq -r '(["HOSTNAME", "STATUS", "POWER", "PWR TYPE", "IP ADDRESS", "SYSTEM ID"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.hostname, .status_name, .power_state, (.power_type // "-"), (.ip_addresses[0] // "-"), .system_id]) | @tsv' | prettify
            ;;
        block-devices|block-device)
            echo "$out" | jq -r '(["ID", "NAME", "TYPE", "SIZE", "MODEL", "TAGS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .type, .size, (.model // "-"), (.tags | join(",") // "-")]) | @tsv' | prettify
            ;;
        partitions|partition)
            echo "$out" | jq -r '(["ID", "PATH", "SIZE", "FSTYPE", "UUID"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .path, .size, (.fstype // "-"), (.uuid // "-")]) | @tsv' | prettify
            ;;
        interfaces|interface)
            echo "$out" | jq -r '(["ID", "NAME", "TYPE", "MAC ADDRESS", "VLAN", "TAGS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .type, (.mac_address // "-"), (.vlan.vid // "-"), (.tags | join(",") // "-")]) | @tsv' | prettify
            ;;
        tags|tag)
            echo "$out" | jq -r '(["NAME", "COMMENT", "NODES"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, (.comment // "-"), (.node_count // "-")]) | @tsv' | prettify
            ;;
        boot-source-selections|boot-source-selection)
            echo "$out" | jq -r '(["OS", "RELEASE", "ARCHES", "SUBARCHES", "LABELS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.os, .release, (.arches | join(",")), (.subarches | join(",")), (.labels | join(","))]) | @tsv' | prettify
            ;;
        boot-resources|boot-resource)
            echo "$out" | jq -r '(["NAME", "ARCHITECTURE", "TYPE", "SIZE"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .architecture, .type, (.size // "-")]) | @tsv' | prettify
            ;;
        subnets|subnet)
            echo "$out" | jq -r '(["NAME", "CIDR", "GATEWAY", "VLAN", "FABRIC"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .cidr, (.gateway_ip // "-"), .vlan.vid, .vlan.fabric]) | @tsv' | prettify
            ;;
        fabrics|fabric)
            echo "$out" | jq -r '(["ID", "NAME", "CLASS", "DESCRIPTION"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .class_type, (.description // "-")]) | @tsv' | prettify
            ;;
        vlans|vlan)
            echo "$out" | jq -r '(["NAME", "VID", "FABRIC", "DHCP", "SPACE"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .vid, .fabric, .dhcp_on, (.space // "-")]) | @tsv' | prettify
            ;;
        spaces|space)
            echo "$out" | jq -r '(["ID", "NAME", "SUBNETS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, (.subnets | length)]) | @tsv' | prettify
            ;;
        ipranges|iprange)
            echo "$out" | jq -r '(["TYPE", "START IP", "END IP", "COMMENT"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.type, .start_ip, .end_ip, (.comment // "-")]) | @tsv' | prettify
            ;;
        domains|domain)
            echo "$out" | jq -r '(["NAME", "AUTHORITATIVE", "DEFAULT", "TTL"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .authoritative, .is_default, (.ttl // "-")]) | @tsv' | prettify
            ;;
        rack-controllers|rack-controller)
            echo "$out" | jq -r '(["HOSTNAME", "STATUS", "ZONE", "VERSION"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.hostname, .status_name, .zone.name, .version]) | @tsv' | prettify
            ;;
        *)
            echo "$out" | python3 -c '
    import sys, json
    try:
        data = json.load(sys.stdin)
        if isinstance(data, dict): data = [data]
        if not data or not isinstance(data, list):
            print(json.dumps(data, indent=2))
            sys.exit(0)
            
        ignored_suffixes = ("_uri", "_status_name", "_test_status", "_count")
        
        keys = []
        for k, v in data[0].items():
            if not isinstance(v, (str, int, bool, float)): continue
            if any(k.endswith(s) for s in ignored_suffixes): continue
            if k == "id": continue
            keys.append(k)
            
        keys = keys[:6]
        if not keys:
            keys = [k for k, v in data[0].items() if isinstance(v, (str, int, bool, float))][:4]
            
        if not keys:
            print(json.dumps(data, indent=2))
            sys.exit(0)
            
        print("\t".join(k.upper().replace("_", " ") for k in keys))
        print("\t".join("-" * len(k) for k in keys))
        for item in data:
            print("\t".join(str(item.get(k, "-")) for k in keys))
    except Exception:
        sys.exit(1)
    ' | prettify || echo "$out" | jq -C .
            ;;
    esac

- path: /etc/profile.d/default-editor.sh
  permissions: '0644'
  content: |
    export EDITOR=nvim

- path: /etc/sudoers.d/keep-editor
  permissions: '0440'
  content: |
    Defaults env_keep += "EDITOR"

{% if not nested_lxd and lxd_cert_b64 and lxd_key_b64 %}
# Non-nested specific files (Host's LXD Certificates)
- path: /root/snap/lxd/common/config/client.crt
  owner: root:root
  permissions: '0644'
  encoding: b64
  content: {{ lxd_cert_b64 }}

- path: /root/snap/lxd/common/config/client.key
  owner: root:root
  permissions: '0600'
  encoding: b64
  content: {{ lxd_key_b64 }}
{% endif %}

# ==========================================
# START OF AUTOMATION SCRIPTS (00 to 20)
# ==========================================

- path: /usr/local/bin/00-generate-env
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    # Define colors first
    BRED='\033[1;31m'
    BYELLOW='\033[1;33m'
    BGREEN='\033[1;32m'
    NC='\033[0m'
    
    echo -e "\n\n${BYELLOW}-------- Generating Runtime Environment... --------${NC}\n"
    
    # 1. Calculate Runtime Variables
    IP_ADDRESS=$(hostname -I | awk '{print $1}')
    INTERFACE=$(ip -j route show default | jq -r '.[].dev')
    
    # LXD Setup Logic
    {% if nested_lxd %}
    LXD_ADDR="${IP_ADDRESS}:8444"
    LXD_CERT="/root/lxd-local.crt"
    LXD_KEY="/root/lxd-local.key"
    {% else %}
    LXD_ADDR="{{ maas_gateway }}:8443"
    LXD_CERT="/root/snap/lxd/common/config/client.crt"
    LXD_KEY="/root/snap/lxd/common/config/client.key"
    {% endif %}
    
    # 2. Write Base Variables to the Persistent State File
    cat <<EOF > /etc/repro-env
    # -- Colours --
    export BRED='${BRED}'
    export BYELLOW='${BYELLOW}'
    export BGREEN='${BGREEN}'
    export NC='${NC}'
    # ----
    export IP_ADDRESS="$IP_ADDRESS"
    export INTERFACE="$INTERFACE"
    export RUN_AS="sudo -u {{ sys_user }}"
    export RUN_AS_LOGIN="sudo -i -u {{ sys_user }}"
    export LXD_ADDR="$LXD_ADDR"
    export LXD_CERT="$LXD_CERT"
    export LXD_KEY="$LXD_KEY"
    EOF
    
    # 3. Secure the state file (Only root and sys_user can read it)
    chown {{ sys_user }}:{{ sys_user }} /etc/repro-env
    chmod 600 /etc/repro-env
    
    # 4. Handle Python IP Math (Append output to state file)
    echo -e "\n\n${BYELLOW}-------- Calculating Payload IP Allocations --------${NC}\n"
    
    python3 -c "
    import ipaddress, sys
    try:
        net = ipaddress.IPv4Network('{{ maas_cidr }}', strict=False)
        hosts = list(net.hosts())
        
        dhcp_count = int('{{ maas_ip_count }}')
        
        # Ensure the subnet is large enough to hold the requested IPs + Gateway + Static
        total_needed = dhcp_count + 5
        if len(hosts) < total_needed:
            sys.stderr.write(f'CRITICAL: Subnet {net} is too small to fit the requested IP ranges!\n')
            sys.exit(1)
        
        maas_gw = hosts[0]
        
        # Top-Down Allocation Logic
        maas_e = hosts[-1]
        maas_s = hosts[-dhcp_count]
        
        print(f'export MAAS_GATEWAY={maas_gw}')
        print(f'export MAAS_RESERVED_IP_START={maas_s}')
        print(f'export MAAS_RESERVED_IP_END={maas_e}')
    except Exception as e:
        sys.stderr.write(f'IP Math Error: {e}\n')
        sys.exit(1)
    " >> /etc/repro-env || exit 1
    
    source /etc/repro-env
    
    echo "MAAS Network CIDR      - {{ maas_cidr }}"
    echo "MAAS Gateway IP        - $MAAS_GATEWAY"
    echo "MAAS Reserved IP Count - {{ maas_ip_count }}"
    echo "MAAS Reserved IP Start - $MAAS_RESERVED_IP_START"
    echo "MAAS Reserved IP End   - $MAAS_RESERVED_IP_END"

- path: /usr/local/bin/01-verify-deps
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    {% if not maas_snap %}
    
    # Install MAAS (not using apt module or else bind conflicts with LXD)
    echo -e "\n\n${BYELLOW}-------- Installing deb MAAS... --------${NC}\n"
    
    apt-get update
    apt-get install -y maas
    
    {% endif %}
    
    # Verify critical dependencies
    echo -e "\n\n${BYELLOW}-------- Verifying dependencies... --------${NC}\n"
    
    for cmd in lxc jq maas juju; do
      if ! command -v $cmd >/dev/null 2>&1; then
        echo "CRITICAL ERROR: Required command '$cmd' not found."
        echo "Snap/apt package installation likely failed due to a network error."
        exit 1
      fi
    done
    echo "All dependencies verified successfully!"

- path: /usr/local/bin/02-maas-init
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    {% if maas_snap %}
    
    # Install PostgreSQL
    echo -e "\n\n${BYELLOW}-------- Install PostgreSQL... --------${NC}\n"
    
    systemctl disable --now systemd-timesyncd
    apt-get update
    apt-get install -y postgresql
    
    # Configure PostgreSQL
    echo -e "\n\n${BYELLOW}-------- Configure PostgreSQL... --------${NC}\n"
    
    sudo -i -u postgres psql -c "CREATE USER \"{{ maas_user }}\" WITH ENCRYPTED PASSWORD '{{ maas_password }}'"
    sudo -i -u postgres createdb -O "{{ maas_user }}" "{{ maas_db_name }}"
    sed -i "1i host    {{ maas_db_name }}    {{ maas_user }}    0.0.0.0/0     md5" /etc/postgresql/*/main/pg_hba.conf
    sed -i "s/^#listen_addresses.*/listen_addresses = '*'/g" /etc/postgresql/*/main/postgresql.conf
    systemctl restart postgresql
    
    # Initialise snap MAAS
    echo -e "\n\n${BYELLOW}-------- Initializing snap MAAS... --------${NC}\n"
    
    maas init region+rack --database-uri "postgres://{{ maas_user }}:{{ maas_password }}@$HOSTNAME/{{ maas_db_name }}" --maas-url http://${IP_ADDRESS}:5240/MAAS
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
    {% else %}
    
    # Initialise deb MAAS
    echo -e "\n\n${BYELLOW}-------- Initializing deb MAAS... --------${NC}\n"
    
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
    {% endif %}
    
    # Wait for MAAS services to be ready
    echo -e "\n\n${BYELLOW}-------- Waiting for MAAS API to be ready... --------${NC}\n"
    
    sleep 30
    until maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $(maas apikey --username {{ maas_user }}) > /dev/null 2>&1; do
      echo "MAAS is not ready yet (502). Retrying in 30 seconds..."
      sleep 30
    done
    
    # Grab API key and login as admin
    echo -e "\n\n${BYELLOW}-------- Logging in as '{{ maas_user }}' user... --------${NC}\n"
    
    export APIKEY=$(maas apikey --username {{ maas_user }})
    
    # Export the APIKEY back to the environment state for later scripts
    if ! grep -q "APIKEY" /etc/repro-env; then
        echo "export APIKEY=\"$APIKEY\"" >> /etc/repro-env
    fi
    
    maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $APIKEY
    maas {{ maas_user }} maas set-config name=maas_name value={{ lxd_project }}
    maas {{ maas_user }} maas set-config name=completed_intro value=true
    
    # Apply global kernel boot parameters
    maas {{ maas_user }} maas set-config name=kernel_opts value="console=tty1 console=ttyS0,115200 loglevel=4 fsck.mode=auto fsck.repair=yes systemd.show_status=false mitigations=auto nosplash"
    
    # Automatically create and add ssh keys to MAAS
    echo -e "\n\n${BYELLOW}-------- Generating SSH keys and adding them to MAAS... --------${NC}\n"
    
    ssh-keygen -q -t rsa -N "" -f "/home/{{ sys_user }}/.ssh/id_rsa"
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/.ssh/id_rsa /home/{{ sys_user }}/.ssh/id_rsa.pub
    chmod 600 /home/{{ sys_user }}/.ssh/id_rsa
    chmod 644 /home/{{ sys_user }}/.ssh/id_rsa.pub
    maas {{ maas_user }} sshkeys create key="$(cat /home/{{ sys_user }}/.ssh/id_rsa.pub)"

- path: /usr/local/bin/03-maas-networking
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Wait for MAAS to finish background network discovery
    
    echo -e "\n\n${BYELLOW}-------- Waiting for MAAS to discover subnet {{ maas_cidr }}... --------${NC}\n"
    
    while true; do
      missing_subnet=false
      
      # Check if the subnet exists in the MAAS database
      if maas {{ maas_user }} subnets read | jq -e ".[] | select(.cidr == \"{{ maas_cidr }}\")" > /dev/null 2>&1; then
        echo -e "  [${BGREEN}OK${NC}] Subnet '{{ maas_cidr }}' has been discovered!"
      else
        echo "  [..] Subnet '{{ maas_cidr }}' is currently syncing/discovering..."
        missing_subnet=true
      fi
      
      # Check for missing subnets
      if [ "$missing_subnet" = "false" ]; then
        echo "Target subnet '{{ maas_cidr }}' is fully populated!"
        break
      fi
      
      echo "Subnet '{{ maas_cidr }}' not yet discovered by rack controller. Retrying in 10 seconds..."
      sleep 10
    done
    
    # Configure MAAS networking (set gateways, vlans, DHCP on etc)
    echo -e "\n\n${BYELLOW}-------- Configuring MAAS networking... --------${NC}\n"
    
    export FABRIC_ID=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.fabric_id")
    export VLAN_TAG=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.vid")
    export PRIMARY_RACK=$(maas {{ maas_user }} rack-controllers read | jq -r ".[] | .system_id" | head -n 1)
    
    maast {{ maas_user }} subnet update {{ maas_cidr }} gateway_ip=$MAAS_GATEWAY
    maast {{ maas_user }} ipranges create type=dynamic start_ip=$MAAS_RESERVED_IP_START end_ip=$MAAS_RESERVED_IP_END
    maast {{ maas_user }} vlan update $FABRIC_ID $VLAN_TAG dhcp_on=true primary_rack=$PRIMARY_RACK
    maast {{ maas_user }} maas set-config name=upstream_dns value={{ maas_dns }}
    
    # Set the MAAS domain name
    
    echo -e "\n\n${BYELLOW}-------- Configuring MAAS domain '{{ tld if tld else 'maas' }}'... --------${NC}\n"
    
    # Check if MAAS auto-created the domain during initialization
    EXISTING_DOMAIN_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.name=="'{{ tld if tld else 'maas' }}'") | .id')
    
    if [ -n "$EXISTING_DOMAIN_ID" ] && [ "$EXISTING_DOMAIN_ID" != "null" ]; then
      echo "Domain '{{ tld if tld else 'maas' }}' already exists! Setting as default and authoritative..."
      export MAAS_DOMAIN_NAME_ID=$EXISTING_DOMAIN_ID
      maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID authoritative=true
      maast {{ maas_user }} domain set-default $MAAS_DOMAIN_NAME_ID
    else
      echo "Domain not found. Renaming default domain to '{{ tld if tld else 'maas' }}'..."
      export MAAS_DOMAIN_NAME_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.is_default==true) | .id')
      maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID name={{ tld if tld else 'maas' }} authoritative=true
    fi
    
    # Update the rack controller to use the correct domain
    maast {{ maas_user }} rack-controller update $PRIMARY_RACK domain={{ tld if tld else 'maas' }}
    
    # Add MAAS DNS to host
    
    cat <<EOF > /etc/netplan/99-maas-dns.yaml
    network:
      version: 2
      ethernets:
        $INTERFACE:
          transmit-checksum-offload: false
          nameservers:
            addresses: [$IP_ADDRESS]
            search: [{{ tld if tld else 'maas' }}, maas]
    EOF
    
    chmod 600 /etc/netplan/99-maas-dns.yaml
    netplan apply
    
    # Persist dynamic networking variables
    cat <<EOF >> /etc/repro-env
    export FABRIC_ID="$FABRIC_ID"
    export VLAN_TAG="$VLAN_TAG"
    export PRIMARY_RACK="$PRIMARY_RACK"
    export MAAS_DOMAIN_NAME_ID="$MAAS_DOMAIN_NAME_ID"
    EOF

- path: /usr/local/bin/04-maas-images
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Configure boot images
    echo -e "\n\n${BYELLOW}-------- Configuring MAAS boot images... --------${NC}\n"
    
    export BOOT_SOURCE_ID=$(maas {{ maas_user }} boot-sources read | jq -r '.[0].id')
    
    for RELEASE in {{ maas_images }}; do
      maast {{ maas_user }} boot-source-selections create $BOOT_SOURCE_ID os="ubuntu" release="$RELEASE" arches="amd64" labels='*' subarches='*'
    done
    maas {{ maas_user }} boot-resources import
    
    # Wait for MAAS boot images to be ready
    echo -e "\n\n${BYELLOW}-------- Waiting for all MAAS boot images to sync... --------${NC}\n"
    
    while true; do
      missing_images=false
      
      importing_status=$(maas {{ maas_user }} boot-resources is-importing)
      requested_releases=$(maas {{ maas_user }} boot-source-selections read $BOOT_SOURCE_ID | jq -r '.[].release')
      downloaded_releases=$(maas {{ maas_user }} boot-resources read | jq -r '.[].name' | sort | uniq)
      
      # Check if the image has been downloaded
      for release in $requested_releases; do
        if echo "$downloaded_releases" | grep -q "$release"; then
           # Image exists. Now check if import is finished
           if [ "$importing_status" = "false" ]; then
               echo -e "  [${BGREEN}OK${NC}] Image '$release' has downloaded!"
           else
               echo "  [..] Image '$release' is currently syncing..."
               missing_images=true
           fi
        else
           echo "  [??] Image '$release' was not found in boot resources..."
           missing_images=true
        fi
      done
      
      # Check for missing images
      if [ "$missing_images" = "false" ]; then
        clean_list=$(echo "$requested_releases" | tr '\n' ' ')
        echo "All selected boot images ( $clean_list) are fully synced!"
        maast {{ maas_user }} boot-resources read
        break
      fi
      
      echo "Some images are missing. Waiting 30s..."
      sleep 30
    done

- path: /usr/local/bin/05-lxd-setup
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    {% if nested_lxd %}
    
    # Generate local LXD trust certificate
    echo -e "\n\n${BYELLOW}-------- Generating trust certificate for local LXD... --------${NC}\n"
    
    openssl req -x509 -newkey rsa:2048 -keyout $LXD_KEY -out $LXD_CERT -nodes -days 3650 -subj "/CN=lxd-local"
    lxc config trust add $LXD_CERT --name lxd-local
    
    # Provide certs to user context
    $RUN_AS mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    {% else %}
    
    # Setup external LXD client certificates and remote connection
    echo -e "\n\n${BYELLOW}-------- Configuring remote LXD connection... --------${NC}\n"
    
    lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    lxc remote switch host-lxd
    
    # Provide certs to user context
    $RUN_AS mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    $RUN_AS lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    
    {% endif %}
    
    {% if lxd_project != "default" %}
    
    # Switch to LXD MAAS project
    echo -e "\n\n${BYELLOW}-------- Switching to LXD '{{ lxd_project }}' project... --------${NC}\n"
    
    lxc project switch {{ lxd_project }}
    
    {% endif %}

- path: /usr/local/bin/06-vm-creation
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create VMs directly via LXD
    echo -e "\n\n${BYELLOW}-------- Creating empty VMs in LXD... --------${NC}\n"
    
    i=1
    for HOST in {{ nodes_hostnames }}; do
      CPU=$(echo "{{ nodes_cpus }}" | cut -d' ' -f$i)
      RAM=$(echo "{{ nodes_rams }}" | cut -d' ' -f$i)
      DISK=$(echo "{{ nodes_disks }}" | cut -d' ' -f$i)
      
      lxc init "$HOST" --vm --empty -c limits.cpu="$CPU" -c limits.memory="$RAM" -d root,size="$DISK"
      
      i=$((i + 1))
    done

- path: /usr/local/bin/07-maas-enlist
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Start VMs to trigger PXE Boot & Enlistment
    echo -e "\n\n${BYELLOW}-------- Starting VMs for MAAS enlistment... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
      lxc start $HOST
    done
    
    # Wait for VMs to enlist in MAAS via MAC
    echo -e "\n\n${BYELLOW}-------- Waiting for all VMs to enlist in MAAS... --------${NC}\n"
    
    while true; do
      all_enlisted=true
      
      for HOST in {{ nodes_hostnames }}; do
        # Fetch the dynamic MAC to identify the machine in MAAS
        MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
        SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
        status=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].status_name')
        
        if [ "$SYSTEM_ID" != "null" ] && [ "$status" = "New" ]; then
          echo -e "  [${BGREEN}OK${NC}] '$HOST' was enlisted with ID '$SYSTEM_ID'!"
        else
          if [ "$status" = "null" ]; then
             status="Waiting for PXE"
          fi
          echo "  [..] '$HOST' ($MAC) is currently '$status'..."
          all_enlisted=false
        fi
      done
      
      # If the flag is still true, everyone is enlisted -> break the loop
      if [ "$all_enlisted" = true ]; then
        echo -e "All VMs have successfully enlisted!\n"
        lxc list
        sleep 10
        break
      fi
      
      echo "Waiting 30s before next check..."
      sleep 30
    done

- path: /usr/local/bin/08-maas-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create Availability Zones in MAAS
    echo -e "\n\n${BYELLOW}-------- Creating Availability Zones... --------${NC}\n"
    for i in $(seq 1 {{ max_ha }}); do
      ZONE="AZ$i"
      if ! maas {{ maas_user }} zones read | jq -e ".[] | select(.name==\"$ZONE\")" > /dev/null; then
        echo "Creating zone: $ZONE"
        maast {{ maas_user }} zones create name="$ZONE" description="Auto-generated AZ for HA Node $i"
      else
        echo "Zone $ZONE already exists."
      fi
    done
    
    echo "Assigning Primary MAAS Controller to AZ1..."
    maast {{ maas_user }} rack-controller update "$PRIMARY_RACK" zone="AZ1"
    
    # Find machines by MAC and set hostnames, domain, and explicit LXD power controls
    echo -e "\n\n${BYELLOW}-------- Configuring hostnames and power controls... --------${NC}\n"
    
    LXD_CERT_CONTENT=$(cat $LXD_CERT)
    LXD_KEY_CONTENT=$(cat $LXD_KEY)
    
    for HOST in {{ nodes_hostnames }}; do
      MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
      SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
      
      NODE_NUM=$(echo "$HOST" | awk -F'-' '{print $NF}')
      TARGET_ZONE="AZ${NODE_NUM}"
      
      # Force the MAAS hostname, domain, and explicit LXD power controls
      maast {{ maas_user }} machine update $SYSTEM_ID \
        hostname=$HOST \
        domain=$MAAS_DOMAIN_NAME_ID \
        zone=$TARGET_ZONE \
        power_type="lxd" \
        power_parameters_power_address="https://$LXD_ADDR" \
        power_parameters_certificate="$LXD_CERT_CONTENT" \
        power_parameters_key="$LXD_KEY_CONTENT" \
        power_parameters_instance_name="$HOST" \
        power_parameters_project="{{ lxd_project }}"
    done

- path: /usr/local/bin/09-maas-commission
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Commission machines
    echo -e "\n\n${BYELLOW}-------- Commissioning machines... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
      SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
      maast {{ maas_user }} machine commission $SYSTEM_ID
    done
    
    # Wait for VMs to be ready
    echo -e "\n\n${BYELLOW}-------- Waiting for VMs to enter 'Ready' state... --------${NC}\n"
    
    while true; do
      all_ready=true
      
      for HOST in {{ nodes_hostnames }}; do
        # Query MAAS for the status
        status=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].status_name')
        
        if [ "$status" = "Ready" ]; then
          echo -e "  [${BGREEN}OK${NC}] '$HOST' is '$status'!"
        else
          echo "  [..] '$HOST' is currently '$status'..."
          all_ready=false
        fi
      done
      
      # If the flag is still true, everyone is ready -> break the loop
      if [ "$all_ready" = true ]; then
        echo -e "All VMs are Ready!\n"
        maast {{ maas_user }} machines read
        netplan apply # Update MAAS DNS record
        sleep 10
        break
      fi
      
      echo "Waiting 60s before checking again..."
      sleep 60
    done

- path: /usr/local/bin/10-maas-tagging
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create tags and add them to commissioned machines
    echo -e "\n\n${BYELLOW}-------- Creating and adding tags... --------${NC}\n"
    maast {{ maas_user }} tags create name=juju-controller
    maast {{ maas_user }} tags create name=landscape
    maast {{ maas_user }} tags create name=client
    
    for HOST in {{ nodes_hostnames }}; do
      SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
      
      # Tag main disks as SSDs
      echo -e "\n\n${BYELLOW}-------- Tagging main disks as SSDs for '$HOST'... --------${NC}\n"
      
      MAIN_BLOCK_ID=$(maas {{ maas_user }} block-devices read $SYSTEM_ID | jq -r '.[] | select(.serial | tostring | contains("lxd_osd") | not) | .id' | head -n 1)
      if [ -n "$MAIN_BLOCK_ID" ] && [ "$MAIN_BLOCK_ID" != "null" ]; then
        maast {{ maas_user }} block-device add-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=ssd
        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=rotary
        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=1rpm
        maast {{ maas_user }} block-device set-boot-disk $SYSTEM_ID $MAIN_BLOCK_ID
        maast {{ maas_user }} machine set-storage-layout $SYSTEM_ID storage_layout=flat
      fi
      
      echo -e "\n\n${BYELLOW}-------- Tagging '$HOST'... --------${NC}\n"
      
      case "$HOST" in
        juju-controller-*)
          maast {{ maas_user }} tag update-nodes juju-controller add=$SYSTEM_ID
          ;;
        
        node-*)
          maast {{ maas_user }} tag update-nodes landscape add=$SYSTEM_ID
          ;;
        
        client-*)
          maast {{ maas_user }} tag update-nodes client add=$SYSTEM_ID
          ;;
      esac
    done

- path: /usr/local/bin/11-juju-add-cloud
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create MAAS Juju Cloud configuration files
    echo -e "\n\n${BYELLOW}-------- Creating MAAS Juju Cloud Configs... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/maas-cloud.yaml
    clouds:
      maas:
        type: maas
        auth-types: [oauth1]
        endpoint: http://${IP_ADDRESS}:5240/MAAS
    EOF
    
    cat <<EOF > /home/{{ sys_user }}/maas-creds.yaml
    credentials:
      maas:
        anyuser:
          auth-type: oauth1
          maas-oauth: $APIKEY
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/maas-*.yaml
    
    # Add MAAS as a Juju Cloud
    echo -e "\n\n${BYELLOW}-------- Adding MAAS as a Juju Cloud... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-cloud --client -f /home/{{ sys_user }}/maas-cloud.yaml maas
    
    # Add MAAS as a Juju Cloud
    echo -e "\n\n${BYELLOW}-------- Adding MAAS Credentials to Juju... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-credential --client -f /home/{{ sys_user }}/maas-creds.yaml maas
    
    # Remove config files
    rm /home/{{ sys_user }}/maas-*.yaml

- path: /usr/local/bin/12-juju-bootstrap
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Bootstrap Juju controller
    echo -e "\n\n${BYELLOW}-------- Bootstrapping Juju Controller... --------${NC}\n"
    
    $RUN_AS_LOGIN juju bootstrap --bootstrap-base={{ juju_base }} --constraints tags=juju-controller maas juju-controller
    
    # Enable Juju HA if JUJU_HA > 1
    if [ {{ juju_ha }} -gt 1 ]; then
      echo -e "\n\n${BYELLOW}-------- Enabling Juju HA ({{ juju_ha }} nodes)... --------${NC}\n"
      
      $RUN_AS_LOGIN juju enable-ha -n {{ juju_ha }} --constraints tags=juju-controller
      
      echo -e "\n\n${BYELLOW}-------- Waiting for Juju HA controllers to provision... --------${NC}\n"
      for i in $(seq 1 $(({{ juju_ha }} - 1))); do
        $RUN_AS_LOGIN juju wait-for machine $i -m controller --timeout=20m --query="life==\"alive\" && status==\"started\""
      done
    fi

- path: /usr/local/bin/13-juju-deploy
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create Juju Model
    echo -e "\n\n${BYELLOW}-------- Creating Juju Landscape Model... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-model --config default-base={{ juju_base }} {{ custom_juju_models.split()[0] }}
    
    echo -e "\n\n${BYELLOW}-------- Deploying Juju Machines... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-machine -n {{ node_ha }} --constraints tags=landscape
    $RUN_AS_LOGIN juju add-machine -n {{ client_ha }} --constraints tags=client
    
    # Wait for machines to be started so LXD is ready
    echo -e "\n\n${BYELLOW}-------- Waiting for Machines to start... --------${NC}\n"
    
    TOTAL_MACHINES=$(({{ node_ha }} + {{ client_ha }} - 1))
    for i in $(seq 0 $TOTAL_MACHINES); do
      $RUN_AS_LOGIN juju wait-for machine $i --timeout=20m --query="life==\"alive\" && status==\"started\""
    done

- path: /usr/local/bin/14-juju-deploy-haproxy
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n\n${BYELLOW}-------- Deploying HAProxy... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/haproxy.yaml
    haproxy:
      default_timeouts: queue 60000, connect 5000, client 120000, server 120000
      global_default_bind_options: no-tlsv10
      services: ""
      ssl_cert: SELFSIGNED
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/haproxy.yaml
    
    LXD_PLACEMENT=$(for i in $(seq 0 $(({{ node_ha }} - 1))); do echo -n "lxd:$i,"; done | sed 's/,$//')
    $RUN_AS_LOGIN juju deploy -n {{ node_ha }} --channel {{ haproxy_channel }} --base={{ haproxy_base }} --to $LXD_PLACEMENT --config /home/{{ sys_user }}/haproxy.yaml haproxy
    
    rm /home/{{ sys_user }}/haproxy.yaml
    
    # Expose HAProxy
    $RUN_AS_LOGIN juju expose haproxy
    
    # Wait for HAProxy to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for HAProxy... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application haproxy --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == {{ node_ha }}"

- path: /usr/local/bin/15-juju-deploy-postgresql
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n\n${BYELLOW}-------- Deploying PostgreSQL... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/postgresql.yaml
    postgresql:
      plugin_plpython3u_enable: true
      plugin_ltree_enable: true
      plugin_intarray_enable: true
      plugin_debversion_enable: true
      plugin_pg_trgm_enable: true
      experimental_max_connections: 500
      memory_max_prepared_transactions: 500
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/postgresql.yaml
    
    BAREMETAL_PLACEMENT=$(seq -s, 0 $(({{ node_ha }} - 1)))
    $RUN_AS_LOGIN juju deploy -n {{ node_ha }} --channel {{ postgresql_channel }} --base={{ postgresql_base }} --to $BAREMETAL_PLACEMENT --config /home/{{ sys_user }}/postgresql.yaml postgresql
    
    rm /home/{{ sys_user }}/postgresql.yaml
    
    # Wait for PostgreSQL to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for PostgreSQL... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application postgresql --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == {{ node_ha }}"

