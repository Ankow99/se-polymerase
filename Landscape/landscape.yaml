- path: /usr/local/bin/17-juju-deploy-landscape-server
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n\n${BYELLOW}-------- Deploying Landscape Server... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/landscape-server.yaml
    landscape-server:
      admin_name: "{{ maas_user }}"
      admin_password: "{{ maas_password }}"
      admin_email: "{{ maas_email }}"
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/landscape-server.yaml
    
    LXD_PLACEMENT=$(for i in $(seq 0 $(({{ node_ha }} - 1))); do echo -n "lxd:$i,"; done | sed 's/,$//')
    $RUN_AS_LOGIN juju deploy -n {{ node_ha }} --channel {{ landscape_server_channel }} --base={{ landscape_server_base }} --to $LXD_PLACEMENT --config /home/{{ sys_user }}/landscape-server.yaml landscape-server
    
    rm /home/{{ sys_user }}/landscape-server.yaml
    
    # Integrate Landscape Server
    $RUN_AS_LOGIN juju integrate landscape-server rabbitmq-server
    $RUN_AS_LOGIN juju integrate landscape-server haproxy
    $RUN_AS_LOGIN juju integrate landscape-server:db postgresql:db-admin
    
    # Wait for Landscape Server to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for Landscape Server... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application landscape-server --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == {{ node_ha }}"

- path: /usr/local/bin/18-juju-deploy-ubuntu-machine
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n\n${BYELLOW}-------- Deploying Ubuntu Machine... --------${NC}\n"
    
    CLIENT_PLACEMENT=$(seq -s, {{ node_ha }} $(({{ node_ha }} + {{ client_ha }} - 1)))
    $RUN_AS_LOGIN juju deploy -n {{ client_ha }} --base {{ client_base }} --to $CLIENT_PLACEMENT ubuntu
    
    # Wait for Ubuntu to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for Ubuntu Machine... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application ubuntu --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == {{ client_ha }}"

- path: /usr/local/bin/19-juju-deploy-landscape-client
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n\n${BYELLOW}-------- Deploying Landscape Client... --------${NC}\n"
    
    # Obtain HAProxy IP
    HAPROXY_IP=$($RUN_AS_LOGIN juju exec --unit haproxy/leader -- unit-get public-address)
    
    cat <<EOF > /home/{{ sys_user }}/landscape-client.yaml
    landscape-client:
      computer-title: "client"
      account-name: "standalone"
      ping-url: "http://${HAPROXY_IP}/ping"
      url: "https://${HAPROXY_IP}/message-system"
      script-users: 'nobody,landscape,root'
      tags: ''
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/landscape-client.yaml
    
    $RUN_AS_LOGIN juju deploy --channel {{ landscape_client_channel }} --config /home/{{ sys_user }}/landscape-client.yaml landscape-client
    
    rm /home/{{ sys_user }}/landscape-client.yaml
    
    # Relate Client with Ubuntu Machine
    echo -e "\n\n${BYELLOW}-------- Attaching Landscape Client to Ubuntu Machine... --------${NC}\n"
    
    $RUN_AS_LOGIN juju relate landscape-client ubuntu
    
    # Wait for Landscape Server to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for Landscape Client... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application landscape-client --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == {{ client_ha }}"

- path: /usr/local/bin/20-attach-landscape-client
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    {% if pro_token %}
    
    # Attach Ubuntu Pro Token
    echo -e "\n\n${BYELLOW}-------- Attaching Ubuntu Pro Token... --------${NC}\n"
    
    for i in $(seq 0 $(({{ client_ha }} - 1))); do
      $RUN_AS_LOGIN juju ssh ubuntu/$i "sudo pro attach {{ pro_token }}"
    done
    
    {% endif %}
    
    # Register Landscape client
    echo -e "\n\n${BYELLOW}-------- Registering Landscape Client to Server... --------${NC}\n"
    
    for i in $(seq 0 $(({{ client_ha }} - 1))); do
      $RUN_AS_LOGIN juju run landscape-client/$i register
    done
    
    # Wait for Landscape to be deployed
    echo -e "\n\n${BYELLOW}-------- Waiting for Landscape Client... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application landscape-client --timeout={{ timeout }} --query="life==\"alive\" && len(units) == {{ client_ha }}"
    
    echo -e "\n\n${BYELLOW}-------- Finished deploying HA Landscape, have fun!... --------${NC}\n"

