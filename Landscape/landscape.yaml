{% set custom_maas_email = "admin@email.com" %}     # PROMPT:MAAS Admin Email
{% set custom_maas_images = "noble jammy" %}        # PROMPT:MAAS Deploy Images (space separated)
{% set custom_maas_dns = "8.8.8.8" %}               # PROMPT:MAAS DNS Forwarder
{% set custom_maas_bridge = "mbr0" %}               # PROMPT:MAAS Bridge Name [BRIDGE:dhcp=false,cidr=maas_cidr]
{% set custom_maas_cidr = "10.10.0.0/22" %}
{% set custom_maas_ip_count = 30 %}                 # PROMPT:MAAS Reserved IP Pool Size

# --- Hardware Allocation ---
# Total: ( CPU = 22 | RAM = 60GiB | DISK = 310GiB )

# MAAS Controller
{% set custom_maas_cpu = "4" %}                     # PROMPT:MAAS Server CPU cores
{% set custom_maas_ram = "8GiB" %}                  # PROMPT:MAAS Server RAM
{% set custom_maas_disk = "30GiB" %}                # PROMPT:MAAS Server Root Disk

# Juju Controllers per node
{% set custom_juju_ha = 1 %}                        # PROMPT:Number of Juju Controllers
{% set custom_juju_cpu = "2" %}                     # PROMPT:Juju Controller CPU cores
{% set custom_juju_ram = "6GiB" %}                  # PROMPT:Juju Controller RAM
{% set custom_juju_disk = "20GiB" %}                # PROMPT:Juju Controller Root Disk

# Machines Defaults per node
{% set custom_node_ha = "3" %}                      # PROMPT:Number of Machines
{% set custom_node_cpu = "3" %}                     # PROMPT:Machine CPU cores
{% set custom_node_ram = "8GiB" %}                  # PROMPT:Machine RAM
{% set custom_node_disk = "40GiB" %}                # PROMPT:Machine Root Disk

# Client Node Defaults per node
{% set custom_client_ha = "1" %}                    # PROMPT:Number of Client Nodes
{% set custom_client_cpu = "2" %}                   # PROMPT:Client Node CPU cores
{% set custom_client_ram = "4GiB" %}                # PROMPT:Client Node RAM
{% set custom_client_disk = "10GiB" %}              # PROMPT:Client Node Root Disk
{% set custom_client_base = "ubuntu@22.04" %}       # PROMPT:Client Node Base

# Juju watch trigger message and models (space separated, order matters)
{% set custom_juju_trigger = "-------- Bootstrapping Juju Controller... --------" %}
{% set custom_juju_models = "landscape-dense-maas" %}

