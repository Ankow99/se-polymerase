## template: jinja
#cloud-config

# ---
# devstack transcript: Automated cloud-init install of DevStack OpenStack
# version: 3.0.0
#
# Synthesized by: Pablo Gonzalez De Greiff @ Canonical
# ---

# ==========================================
# DEFAULT JINJA CONFIGURATIONS
# ==========================================

# --- Architecture Toggle ---
{% set custom_update_n_upgrade = True %}            # PROMPT:Auto Update & Upgrade

# --- Auth & System ---
{% set custom_repro_name = "devstack" %}
{% set custom_vm_name = "devstack" %}
{% set custom_vm_image = "ubuntu:24.04" %}          # PROMPT:Primary VM Image
{% set custom_ssh_key = "" %}
{% set custom_ssh_import_id = "" %}
{% set custom_sys_user = "ubuntu" %}                # PROMPT:System User
{% set custom_password = "ubuntu" %}                # PROMPT:System Password
{% set custom_pro_token = "" %}                     # PROMPT:Pro Token
{% set custom_hostname = "" %}                      # PROMPT:Hostname
{% set custom_tld = "" %}                           # PROMPT:Top Level Domain
{% set custom_timezone = "America/New_York" %}      # PROMPT:Timezone

# --- LXD Settings ---
{% set custom_lxd_project = "default" %}
{% set custom_lxd_pool = "default" %}               # PROMPT:LXD Storage Pool
{% set custom_lxd_bridge = "lbr0" %}                # PROMPT:LXD Bridge Name [BRIDGE:dhcp=true,cidr=lxd_cidr]
{% set custom_lxd_cidr = "10.10.0.0/22" %}

# --- DevStack Settings ---
{% set custom_devstack_release = "stable/2025.2" %} # PROMPT:DevStack Release Branch
{% set custom_devstack_password = "admin" %}        # PROMPT:DevStack Password
{% set custom_enable_swift = True %}                # PROMPT:Enable Swift
{% set custom_enable_skyline = True %}              # PROMPT:Enable Skyline Plugin
{% set custom_enable_masakari = True %}             # PROMPT:Enable Masakari Plugin
{% set custom_enable_heat = True %}                 # PROMPT:Enable Heat Plugin
{% set custom_enable_designate = True %}            # PROMPT:Enable Designate Plugin
{% set custom_enable_octavia = True %}              # PROMPT:Enable Octavia Plugin
{% set custom_enable_barbican = True %}             # PROMPT:Enable Barbican Plugin

# --- Hardware Allocation ---
# Total: ( CPU = 20 | RAM = 40GiB | DISK = 150GiB )

# Primary VM
{% set custom_primary_cpu = "20" %}                 # PROMPT:Primary VM CPU cores
{% set custom_primary_ram = "40GiB" %}              # PROMPT:Primary VM RAM
{% set custom_primary_disk = "150GiB" %}            # PROMPT:Primary VM Root Disk

# ==========================================
# DATASOURCE PARSER (LXD vs Cloud)
# ==========================================

{% if cloud_name == "lxd" %}
  {% set meta = {} %}
  {% for key, value in ds.config.items() %}
    {% if key.startswith("user_") %}
      {% set _ = meta.__setitem__(key[5:], value) %}
    {% endif %}
  {% endfor %}
{% else %}
  {% set meta = ds.meta_data.get("meta") if ds.meta_data.get("meta") else {} %}
{% endif %}

# ==========================================
# VARIABLE BINDINGS
# ==========================================

{% set vm_image = meta.get("vm_image") or custom_vm_image %}
{% set ssh_key = meta.get("ssh_key") or custom_ssh_key %}
{% set ssh_import_id = meta.get("ssh_import_id") or custom_ssh_import_id %}
{% set sys_user = meta.get("sys_user") or custom_sys_user %}
{% set password = meta.get("password") or custom_password %}
{% set pro_token = meta.get("pro_token") or custom_pro_token %}
{% set hostname_base = meta.get("hostname") or custom_hostname %}
{% set tld = meta.get("tld") or custom_tld %}
{% set timezone = meta.get("timezone") or custom_timezone %}

{% set lxd_project = meta.get("lxd_project") or custom_lxd_project %}
{% set lxd_pool = meta.get("lxd_pool") or custom_lxd_pool %}
{% set lxd_bridge = meta.get("lxd_bridge") or custom_lxd_bridge %}
{% set lxd_cidr = meta.get("lxd_cidr") or custom_lxd_cidr %}

{% set devstack_release = meta.get("devstack_release") or custom_devstack_release %}
{% set devstack_password = meta.get("devstack_password") or custom_devstack_password %}

{% if meta.get("update_n_upgrade") is not none %}
  {% set update_n_upgrade = (meta.get("update_n_upgrade") | string | lower == "true") %}
{% else %}
  {% set update_n_upgrade = (custom_update_n_upgrade | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_swift") is not none %}
  {% set enable_swift = (meta.get("enable_swift") | string | lower == "true") %}
{% else %}
  {% set enable_swift = (custom_enable_swift | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_skyline") is not none %}
  {% set enable_skyline = (meta.get("enable_skyline") | string | lower == "true") %}
{% else %}
  {% set enable_skyline = (custom_enable_skyline | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_masakari") is not none %}
  {% set enable_masakari = (meta.get("enable_masakari") | string | lower == "true") %}
{% else %}
  {% set enable_masakari = (custom_enable_masakari | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_heat") is not none %}
  {% set enable_heat = (meta.get("enable_heat") | string | lower == "true") %}
{% else %}
  {% set enable_heat = (custom_enable_heat | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_designate") is not none %}
  {% set enable_designate = (meta.get("enable_designate") | string | lower == "true") %}
{% else %}
  {% set enable_designate = (custom_enable_designate | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_octavia") is not none %}
  {% set enable_octavia = (meta.get("enable_octavia") | string | lower == "true") %}
{% else %}
  {% set enable_octavia = (custom_enable_octavia | string | lower == "true") %}
{% endif %}

{% if meta.get("enable_barbican") is not none %}
  {% set enable_barbican = (meta.get("enable_barbican") | string | lower == "true") %}
{% else %}
  {% set enable_barbican = (custom_enable_barbican | string | lower == "true") %}
{% endif %}

# ==========================================
# STANDARD CLOUD-INIT EXECUTION
# ==========================================

# Create Hostname / FQDN
{% set base_name = local_hostname if hostname_base == "" else hostname_base %}
{% if tld %}
fqdn: {{ base_name }}.{{ tld }}
prefer_fqdn_over_hostname: true
{% else %}
hostname: {{ base_name }}
{% endif %}

# Create user and config auth
users:
  - name: stack
    lock_passwd: False
    sudo: ["ALL=(ALL) NOPASSWD:ALL\nDefaults:stack !requiretty"]
    groups: kvm
    shell: /bin/bash
    homedir: /opt/stack
  - name: {{ sys_user }}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: adm, sys, lxd, sudo, kvm
    shell: /bin/bash
{% if not ssh_key and not ssh_import_id %}
    plain_text_passwd: "{{ password }}"
    lock_passwd: false
{% endif %}
{% if ssh_key %}
    ssh_authorized_keys:
      - {{ ssh_key }}
{% endif %}
{% if ssh_import_id %}
    ssh_import_id:
      - {{ ssh_import_id }}
{% endif %}

# Enable SSH Password Auth ONLY if no keys are provided
{% if not ssh_key and not ssh_import_id %}
ssh_pwauth: true
{% else %}
ssh_pwauth: false
{% endif %}

# Config Ubuntu Pro
{% if pro_token %}
ubuntu_pro:
  token: {{ pro_token }}
{% endif %}

timezone: {{ timezone }}

packages:
  - git
  - neovim
  - jq

package_update: {{ 'true' if update_n_upgrade else 'false' }}
package_upgrade: {{ 'true' if update_n_upgrade else 'false' }}
package_reboot_if_required: {{ 'true' if update_n_upgrade else 'false' }}

write_files:
# Auto login script helper function (DevStack)
- path: /etc/profile.d/devstack-login.sh
  permissions: '0644'
  content: |
    if [ "$USER" = "{{ sys_user }}" ] || [ "$USER" = "stack" ]; then
        if [ -f "/opt/stack/devstack/openrc" ]; then
            source /opt/stack/devstack/openrc admin admin
        fi
        
        if [ -f "/etc/repro-env" ]; then
            source /etc/repro-env
        fi
    fi

- path: /etc/profile.d/default-editor.sh
  permissions: '0644'
  content: |
    export EDITOR=nvim

- path: /etc/sudoers.d/keep-editor
  permissions: '0440'
  content: |
    Defaults env_keep += "EDITOR"

- path: /etc/udev/rules.d/99-kvm.rules
  permissions: '0644'
  content: |
    KERNEL=="kvm", GROUP="kvm", MODE="0666"

# ==========================================
# START OF AUTOMATION SCRIPTS (00 to 03)
# ==========================================

- path: /usr/local/bin/00-generate-env
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    # Define colors first
    BRED='\033[1;31m'
    BYELLOW='\033[1;33m'
    BGREEN='\033[1;32m'
    NC='\033[0m'
    
    echo -e "\n\n${BYELLOW}-------- Generating Runtime Environment... --------${NC}\n"
    
    # 1. Calculate Runtime Variables
    IP_ADDRESS=$(hostname -I | awk '{print $1}')
    INTERFACE=$(ip -j route show default | jq -r '.[].dev')
    
    # 2. Write Base Variables to the Persistent State File
    cat <<EOF > /etc/repro-env
    # -- Colours --
    export BRED='${BRED}'
    export BYELLOW='${BYELLOW}'
    export BGREEN='${BGREEN}'
    export NC='${NC}'
    # ----
    export IP_ADDRESS="$IP_ADDRESS"
    export INTERFACE="$INTERFACE"
    export RUN_AS="sudo -u {{ sys_user }}"
    export RUN_AS_LOGIN="sudo -i -u {{ sys_user }}"
    EOF
    
    # 3. Secure the state file (Only root and sys_user can read it)
    chown {{ sys_user }}:{{ sys_user }} /etc/repro-env
    chmod 600 /etc/repro-env

- path: /usr/local/bin/01-verify-deps
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Verify critical dependencies
    echo -e "\n\n${BYELLOW}-------- Verifying dependencies... --------${NC}\n"
    
    for cmd in jq; do
      if ! command -v $cmd >/dev/null 2>&1; then
        echo "CRITICAL ERROR: Required command '$cmd' not found."
        echo "Snap/apt package installation likely failed due to a network error."
        exit 1
      fi
    done
    echo "All dependencies verified successfully!"

- path: /usr/local/bin/02-devstack-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Clone devstack repo
    echo -e "\n\n${BYELLOW}-------- Cloning DevStack Repository... --------${NC}\n"
    
    chmod +x /opt/stack
    
    su stack -c 'git clone -b {{ devstack_release }} https://opendev.org/openstack/devstack /opt/stack/devstack'
    
    cat <<EOF > /opt/stack/devstack/local.conf
    [[local|localrc]]
    # Basic Credentials
    ADMIN_PASSWORD={{ devstack_password }}
    DATABASE_PASSWORD={{ devstack_password }}
    RABBIT_PASSWORD={{ devstack_password }}
    SERVICE_PASSWORD={{ devstack_password }}
    # Base Git Repository
    GIT_BASE=https://opendev.org
    # Logging Configuration
    DEST=/opt/stack
    LOGFILE=\$DEST/logs/stack.sh.log
    VERBOSE=True
    LOG_COLOR=False
    # Force the libvirt driver to use KVM hardware acceleration
    LIBVIRT_TYPE=kvm
    # Expose the full physical CPU features to the guest VMs
    LIBVIRT_CPU_MODE=host-passthrough
    # Tempest
    INSTALL_TEMPEST=True
    enable_service tempest
    # Network (Neutron & OVN)
    enable_plugin neutron \$GIT_BASE/openstack/neutron {{ devstack_release }}
    enable_service rabbit
    enable_service q-qos
    # Placement
    enable_service placement-api placement-client
    {% if enable_swift %}
    # Swift
    enable_service s-proxy s-object s-container s-account
    SWIFT_HASH=66a3d6b56c1f479c8b4e70ab5c2000f5
    {% endif %}
    {% if enable_skyline %}
    # Skyline Dashboard
    enable_plugin skyline-apiserver \$GIT_BASE/openstack/skyline-apiserver {{ devstack_release }}
    enable_plugin skyline-console \$GIT_BASE/openstack/skyline-console {{ devstack_release }}
    {% endif %}
    {% if enable_masakari %}
    # Masakari
    enable_plugin masakari \$GIT_BASE/openstack/masakari {{ devstack_release }}
    enable_plugin masakaridashboard \$GIT_BASE/openstack/masakari-dashboard {{ devstack_release }}
    {% endif %}
    {% if enable_heat %}
    # Heat
    enable_plugin heat \$GIT_BASE/openstack/heat {{ devstack_release }}
    enable_service h-eng h-api h-api-cfn h-api-cw
    {% endif %}
    {% if enable_designate %}
    # Designate
    enable_plugin designate \$GIT_BASE/openstack/designate {{ devstack_release }}
    enable_service designate,designate-central,designate-api,designate-worker,designate-producer,designate-mdns
    {% endif %}
    {% if enable_octavia %}
    # Octavia
    enable_plugin octavia \$GIT_BASE/openstack/octavia {{ devstack_release }}
    enable_plugin octavia-dashboard \$GIT_BASE/openstack/octavia-dashboard {{ devstack_release }}
    enable_plugin ovn-octavia-provider \$GIT_BASE/openstack/ovn-octavia-provider {{ devstack_release }}
    enable_plugin octavia-tempest-plugin \$GIT_BASE/openstack/octavia-tempest-plugin master
    enable_service octavia o-api o-cw o-hm o-hk o-da
    {% endif %}
    {% if enable_barbican %}
    # Barbican
    enable_plugin barbican \$GIT_BASE/openstack/barbican {{ devstack_release }}
    enable_service barbican
    {% endif %}
    EOF
    
    chown stack:stack /opt/stack/devstack/local.conf

- path: /usr/local/bin/03-devstack-install
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Install devstack
    echo -e "\n\n${BYELLOW}-------- Installing DevStack... --------${NC}\n"
    
    su -l stack -c '~/devstack/stack.sh'
    
    cp /opt/stack/devstack/openrc /home/{{ sys_user }}/openrc
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/openrc
    
    echo -e "\n\n${BYELLOW}-------- Finished deploying DevStack, have fun!... --------${NC}\n"

# ==========================================
# END OF AUTOMATION SCRIPTS (00 to 03)
# ==========================================

runcmd:
- 00-generate-env
- 01-verify-deps || exit 1
- 02-devstack-configure
- 03-devstack-install

