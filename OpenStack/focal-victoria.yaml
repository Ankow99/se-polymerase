# ==========================================
# START OF AUTOMATION SCRIPTS (00 to 28)
# ==========================================

- path: /usr/local/bin/00-generate-env
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    # Define colors first
    BRED='\033[1;31m'
    BYELLOW='\033[1;33m'
    BGREEN='\033[1;32m'
    NC='\033[0m'
    
    echo -e "\n${BYELLOW}-------- Generating Runtime Environment... --------${NC}\n"
    
    # 1. Calculate Runtime Variables
    IP_ADDRESS=$(hostname -I | awk '{print $1}')
    INTERFACE=$(ip -j route show default | jq -r '.[].dev')
    
    # LXD Setup Logic
{% if nested_lxd %}
    LXD_ADDR="${IP_ADDRESS}:8444"
    LXD_CERT="/root/lxd-local.crt"
    LXD_KEY="/root/lxd-local.key"
{% else %}
    LXD_ADDR="{{ maas_gateway }}:8443"
    LXD_CERT="/root/snap/lxd/common/config/client.crt"
    LXD_KEY="/root/snap/lxd/common/config/client.key"
{% endif %}
    
    # 2. Write Base Variables to the Persistent State File
    cat <<EOF > /etc/repro-env
    # -- Colours --
    export BRED='${BRED}'
    export BYELLOW='${BYELLOW}'
    export BGREEN='${BGREEN}'
    export NC='${NC}'
    # ----
    export IP_ADDRESS="$IP_ADDRESS"
    export INTERFACE="$INTERFACE"
    export RUN_AS="sudo -u {{ sys_user }}"
    export RUN_AS_LOGIN="sudo -i -u {{ sys_user }}"
    export LXD_ADDR="$LXD_ADDR"
    export LXD_CERT="$LXD_CERT"
    export LXD_KEY="$LXD_KEY"
    EOF
    
    # 3. Secure the state file (Only root and sys_user can read it)
    chown {{ sys_user }}:{{ sys_user }} /etc/repro-env
    chmod 600 /etc/repro-env
    
    # 4. Handle Python IP Math (Append output to state file)
    echo -e "\n${BYELLOW}-------- Calculating Payload IP Allocations --------${NC}\n"
    
    python3 -c "
    import ipaddress, sys
    try:
        net = ipaddress.IPv4Network('{{ maas_cidr }}', strict=False)
        hosts = list(net.hosts())
        
        dhcp_count = int('{{ maas_ip_count }}')
        
        # Ensure the subnet is large enough (dhcp + int + pub + instance_rec + 5 static)
        total_needed = dhcp_count + 5
        if len(hosts) < total_needed:
            sys.stderr.write(f'CRITICAL: Subnet {net} is too small to fit the requested IP ranges!\n')
            sys.exit(1)
        
        maas_gw = hosts[0]
        
        # Top-Down Allocation Logic
        maas_e = hosts[-1]
        maas_s = hosts[-dhcp_count]
        
        # 2. OpenStack Subnet IP Calculation
        os_net = ipaddress.IPv4Network('{{ os_neutron_cidr }}', strict=False)
        os_hosts = list(os_net.hosts())
        
        os_count = int('{{ os_ip_count }}')
        
        # Ensure the subnet is large enough to hold the requested IPs + Gateway + Static
        os_total_needed = os_count + 5
        if len(os_hosts) < os_total_needed:
            sys.stderr.write(f'CRITICAL: Subnet {os_net} is too small to fit the requested IP ranges!\n')
            sys.exit(1)
        
        os_gw = os_hosts[0]
        
        # Top-Down Allocation Logic
        os_e = os_hosts[-1]
        os_s = os_hosts[-os_count]
        
        print(f'export MAAS_GATEWAY={maas_gw}')
        print(f'export MAAS_RESERVED_IP_START={maas_s}')
        print(f'export MAAS_RESERVED_IP_END={maas_e}')
        print(f'export OS_NEUTRON_GATEWAY={os_gw}')
        print(f'export OS_RESERVED_IP_START={os_s}')
        print(f'export OS_RESERVED_IP_END={os_e}')
        
    except Exception as e:
        sys.stderr.write(f'IP Math Error: {e}\n')
        sys.exit(1)
    " >> /etc/repro-env || exit 1
    
    source /etc/repro-env
    
    echo "MAAS Network CIDR         - {{ maas_cidr }}"
    echo "MAAS Gateway IP           - $MAAS_GATEWAY"
    echo "MAAS Reserved IP Count    - {{ maas_ip_count }}"
    echo "MAAS Reserved IP Start    - $MAAS_RESERVED_IP_START"
    echo "MAAS Reserved IP End      - $MAAS_RESERVED_IP_END"
    echo ""
    echo "Neutron Network CIDR      - {{ os_neutron_cidr }}"
    echo "Neutron Gateway IP        - $OS_NEUTRON_GATEWAY"
    echo "Neutron Reserved IP Count - {{ os_ip_count }}"
    echo "Neutron Reserved IP Start - $OS_RESERVED_IP_START"
    echo "Neutron Reserved IP End   - $OS_RESERVED_IP_END"

- path: /usr/local/bin/01-verify-deps
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if not maas_snap %}
    
    # Install MAAS (not using apt module or else bind conflicts with LXD)
    echo -e "\n${BYELLOW}-------- Installing deb MAAS... --------${NC}\n"
    
    apt-get update
    apt-get install -y maas
    
{% endif %}
    
    # Verify critical dependencies
    echo -e "\n${BYELLOW}-------- Verifying dependencies... --------${NC}\n"
    
    for cmd in lxc jq maas juju openstack; do
        if ! command -v $cmd >/dev/null 2>&1; then
            echo "CRITICAL ERROR: Required command '$cmd' not found."
            echo "Snap/apt package installation likely failed due to a network error."
            exit 1
        fi
    done
    echo "All dependencies verified successfully!"

- path: /usr/local/bin/02-maas-init
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if maas_snap %}
    
    # Install PostgreSQL
    echo -e "\n${BYELLOW}-------- Install PostgreSQL... --------${NC}\n"
    
    systemctl disable --now systemd-timesyncd
    apt-get update
    apt-get install -y postgresql
    
    # Configure PostgreSQL
    echo -e "\n${BYELLOW}-------- Configure PostgreSQL... --------${NC}\n"
    
    sudo -i -u postgres psql -c "CREATE USER \"{{ maas_user }}\" WITH ENCRYPTED PASSWORD '{{ maas_password }}'"
    sudo -i -u postgres createdb -O "{{ maas_user }}" "{{ maas_db_name }}"
    sed -i "1i host    {{ maas_db_name }}    {{ maas_user }}    0.0.0.0/0     md5" /etc/postgresql/*/main/pg_hba.conf
    sed -i "s/^#listen_addresses.*/listen_addresses = '*'/g" /etc/postgresql/*/main/postgresql.conf
    systemctl restart postgresql
    
    # Initialise snap MAAS
    echo -e "\n${BYELLOW}-------- Initializing snap MAAS... --------${NC}\n"
    
    maas init region+rack --database-uri "postgres://{{ maas_user }}:{{ maas_password }}@$HOSTNAME/{{ maas_db_name }}" --maas-url http://${IP_ADDRESS}:5240/MAAS
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
{% else %}
    
    # Initialise deb MAAS
    echo -e "\n${BYELLOW}-------- Initializing deb MAAS... --------${NC}\n"
    
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
{% endif %}
    
    # Wait for MAAS services to be ready
    echo -e "\n${BYELLOW}-------- Waiting for MAAS API to be ready... --------${NC}\n"
    
    sleep 30
    ATTEMPTS=0
    MAX_ATTEMPTS=10 # Timeout - 5 min
    until maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $(maas apikey --username {{ maas_user }}) > /dev/null 2>&1; do
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for MAAS API to become ready. Aborting.${NC}\n"
            exit 1
        fi
        echo "MAAS is not ready yet (502). Retrying in 30 seconds (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 30
        ATTEMPTS=$((ATTEMPTS+1))
    done
    
    # Grab API key and login as admin
    echo -e "\n${BYELLOW}-------- Logging in as '{{ maas_user }}' user... --------${NC}\n"
    
    export APIKEY=$(maas apikey --username {{ maas_user }})
    
    # Export the APIKEY back to the environment state for later scripts
    if ! grep -q "APIKEY" /etc/repro-env; then
        echo "export APIKEY=\"$APIKEY\"" >> /etc/repro-env
    fi
    
    maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $APIKEY
    maas {{ maas_user }} maas set-config name=maas_name value={{ lxd_project }}
    maas {{ maas_user }} maas set-config name=completed_intro value=true
    
    # Apply global kernel boot parameters
    maas {{ maas_user }} maas set-config name=kernel_opts value="console=tty1 console=ttyS0,115200 loglevel=4 fsck.mode=auto fsck.repair=yes systemd.show_status=false mitigations=auto nosplash"
    
    # Automatically create and add ssh keys to MAAS
    echo -e "\n${BYELLOW}-------- Generating SSH keys and adding them to MAAS... --------${NC}\n"
    
    if [ ! -f "/home/{{ sys_user }}/.ssh/id_rsa" ]; then
        ssh-keygen -q -t rsa -N "" -f "/home/{{ sys_user }}/.ssh/id_rsa"
        chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/.ssh/id_rsa /home/{{ sys_user }}/.ssh/id_rsa.pub
        chmod 600 /home/{{ sys_user }}/.ssh/id_rsa
        chmod 644 /home/{{ sys_user }}/.ssh/id_rsa.pub
        maas {{ maas_user }} sshkeys create key="$(cat /home/{{ sys_user }}/.ssh/id_rsa.pub)"
    else
        echo "SSH keys already exist. Skipping generation to prevent lockout..."
    fi
    
{% if ssh_key %}
    maas {{ maas_user }} sshkeys create key="{{ ssh_key }}"
{% endif %}

- path: /usr/local/bin/03-maas-networking
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Wait for MAAS to finish background network discovery
    echo -e "\n${BYELLOW}-------- Waiting for MAAS to discover subnet '{{ maas_cidr }}'... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=12 # Timeout - 2 min
    while true; do
        missing_subnet=false
        
        # Check if the subnet exists in the MAAS database
        if maas {{ maas_user }} subnets read | jq -e ".[] | select(.cidr == \"{{ maas_cidr }}\")" > /dev/null 2>&1; then
            echo -e "  [${BGREEN}OK${NC}] Subnet '{{ maas_cidr }}' has been discovered!"
        else
            echo "  [..] Subnet '{{ maas_cidr }}' is currently syncing/discovering..."
            missing_subnet=true
        fi
        
        # Check for missing subnets
        if [ "$missing_subnet" = "false" ]; then
            echo "Target subnet '{{ maas_cidr }}' is fully populated!"
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for MAAS to discover subnet. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Subnet '{{ maas_cidr }}' not yet discovered by rack controller. Retrying in 10 seconds (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 10
    done
    
    # Configure MAAS networking (set gateways, vlans, DHCP on etc)
    echo -e "\n${BYELLOW}-------- Configuring MAAS networking... --------${NC}\n"
    
    export FABRIC_ID=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.fabric_id")
    export VLAN_TAG=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.vid")
    export PRIMARY_RACK=$(maas {{ maas_user }} rack-controllers read | jq -r ".[] | .system_id" | head -n 1)
    
    maast {{ maas_user }} subnet update {{ maas_cidr }} gateway_ip=$MAAS_GATEWAY
    maast {{ maas_user }} ipranges create type=dynamic start_ip=$MAAS_RESERVED_IP_START end_ip=$MAAS_RESERVED_IP_END
    maast {{ maas_user }} vlan update $FABRIC_ID $VLAN_TAG dhcp_on=true primary_rack=$PRIMARY_RACK
    maast {{ maas_user }} maas set-config name=upstream_dns value={{ maas_dns }}
    
    # Map network spaces to cloud networks
    echo -e "\n${BYELLOW}-------- Mapping network spaces to cloud networks... --------${NC}\n"
    
    maast {{ maas_user }} spaces create name={{ maas_space }}
    maast {{ maas_user }} vlan update $FABRIC_ID $VLAN_TAG space={{ maas_space }}
    
    # Set the MAAS domain name
    echo -e "\n${BYELLOW}-------- Configuring MAAS domain '{{ tld if tld else 'maas' }}'... --------${NC}\n"
    
    # Check if MAAS auto-created the domain during initialization
    EXISTING_DOMAIN_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.name=="'{{ tld if tld else 'maas' }}'") | .id')
    
    if [ -n "$EXISTING_DOMAIN_ID" ] && [ "$EXISTING_DOMAIN_ID" != "null" ]; then
        echo "Domain '{{ tld if tld else 'maas' }}' already exists! Setting as default and authoritative..."
        export MAAS_DOMAIN_NAME_ID=$EXISTING_DOMAIN_ID
        maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID authoritative=true
        maast {{ maas_user }} domain set-default $MAAS_DOMAIN_NAME_ID
    else
        echo "Domain not found. Renaming default domain to '{{ tld if tld else 'maas' }}'..."
        export MAAS_DOMAIN_NAME_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.is_default==true) | .id')
        maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID name={{ tld if tld else 'maas' }} authoritative=true
    fi
    
    # Update the rack controller to use the correct domain
    maast {{ maas_user }} rack-controller update $PRIMARY_RACK domain={{ tld if tld else 'maas' }}
    
    # Add MAAS DNS to host
    cat <<EOF > /etc/netplan/99-maas-dns.yaml
    network:
      version: 2
      ethernets:
        $INTERFACE:
          transmit-checksum-offload: false
          nameservers:
            addresses: [$IP_ADDRESS]
            search: [{{ tld if tld else 'maas' }}, maas]
    EOF
    
    chmod 600 /etc/netplan/99-maas-dns.yaml
    netplan apply
    
    # Persist dynamic networking variables
    cat <<EOF >> /etc/repro-env
    export PRIMARY_RACK="$PRIMARY_RACK"
    export MAAS_DOMAIN_NAME_ID="$MAAS_DOMAIN_NAME_ID"
    EOF

- path: /usr/local/bin/04-maas-images
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Configure boot images
    echo -e "\n${BYELLOW}-------- Configuring MAAS boot images... --------${NC}\n"
    
    export BOOT_SOURCE_ID=$(maas {{ maas_user }} boot-sources read | jq -r '.[0].id')
    
    for RELEASE in {{ maas_images }}; do
        maast {{ maas_user }} boot-source-selections create $BOOT_SOURCE_ID os="ubuntu" release="$RELEASE" arches="amd64" labels='*' subarches='*'
    done
    maas {{ maas_user }} boot-resources import
    
    # Wait for MAAS boot images to be ready
    echo -e "\n\n${BYELLOW}-------- Waiting for all MAAS boot images to sync... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=60 # Timeout - 30 min
    while true; do
        missing_images=false
        
        importing_status=$(maas {{ maas_user }} boot-resources is-importing)
        requested_releases=$(maas {{ maas_user }} boot-source-selections read $BOOT_SOURCE_ID | jq -r '.[].release')
        downloaded_releases=$(maas {{ maas_user }} boot-resources read | jq -r '.[].name' | sort | uniq)
        
        # Check if the image has been downloaded
        for release in $requested_releases; do
            if echo "$downloaded_releases" | grep -q "$release"; then
                # Image exists. Now check if import is finished
                if [ "$importing_status" = "false" ]; then
                    echo -e "  [${BGREEN}OK${NC}] Image '$release' has downloaded!"
                else
                    echo "  [..] Image '$release' is currently syncing..."
                    missing_images=true
                fi
            else
                echo "  [??] Image '$release' was not found in boot resources..."
                missing_images=true
            fi
        done
        
        # Check for missing images
        if [ "$missing_images" = "false" ]; then
            clean_list=$(echo "$requested_releases" | tr '\n' ' ')
            echo "All selected boot images ( $clean_list) are fully synced!"
            maast {{ maas_user }} boot-resources read
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for MAAS boot images to sync. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Some images are missing. Waiting 30s (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 30
    done

- path: /usr/local/bin/05-lxd-setup
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if nested_lxd %}
    
    # Generate local LXD trust certificate
    echo -e "\n${BYELLOW}-------- Generating trust certificate for local LXD... --------${NC}\n"
    
    if [ ! -f "$LXD_CERT" ]; then
        openssl req -x509 -newkey rsa:2048 -keyout $LXD_KEY -out $LXD_CERT -nodes -days 3650 -subj "/CN=lxd-local"
        lxc config trust add $LXD_CERT --name lxd-local
        
        # Provide certs to user context
        $RUN_AS_LOGIN mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
        cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
        cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
        chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    else
        echo "LXD trust certificate already exists. Skipping generation to preserve MAAS power controls..."
    fi
    
{% else %}
    
    # Setup external LXD client certificates and remote connection
    echo -e "\n${BYELLOW}-------- Configuring remote LXD connection... --------${NC}\n"
    
    lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    lxc remote switch host-lxd
    
    # Provide certs to user context
    $RUN_AS_LOGIN mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    $RUN_AS_LOGIN lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    
{% endif %}
    
{% if lxd_project != "default" %}
    
    # Switch to LXD MAAS project
    echo -e "\n${BYELLOW}-------- Switching to LXD '{{ lxd_project }}' project... --------${NC}\n"
    
    lxc project switch {{ lxd_project }}
    
{% endif %}

- path: /usr/local/bin/06-vm-creation
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create VMs directly via LXD
    echo -e "\n${BYELLOW}-------- Creating empty VMs in LXD... --------${NC}\n"
    
    i=1
    for HOST in {{ nodes_hostnames }}; do
        CPU=$(echo "{{ nodes_cpus }}" | cut -d' ' -f$i)
        RAM=$(echo "{{ nodes_rams }}" | cut -d' ' -f$i)
        DISK=$(echo "{{ nodes_disks }}" | cut -d' ' -f$i)
        
        lxc init "$HOST" --vm --empty -p default -c limits.cpu="$CPU" -c limits.memory="$RAM" -d root,size="$DISK"
        
        i=$((i + 1))
    done
    
    # Attach specific extra devices to the OpenStack compute/storage
    for HOST in {{ nodes_hostnames }}; do
        case "$HOST" in
            node-*)
                # Loop to create and attach multiple OSD disks
                for i in $(seq 1 {{ node_osd_count }}); do
                    lxc storage volume create {{ lxd_pool }} ${HOST}-osd${i}-disk size={{ node_osd_disk }} --type=block
                    lxc config device add $HOST osd${i} disk pool={{ lxd_pool }} source=${HOST}-osd${i}-disk
                done
                
                # Attach Neutron networking
                lxc config device add $HOST eth1 nic nictype=bridged parent="{{ os_neutron_bridge }}"
                ;;
        esac
    done

- path: /usr/local/bin/07-maas-enlist
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Start VMs to trigger PXE Boot & Enlistment
    echo -e "\n${BYELLOW}-------- Starting VMs for MAAS enlistment... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
        lxc start $HOST
    done
    
    # Wait for VMs to enlist in MAAS via MAC
    echo -e "\n${BYELLOW}-------- Waiting for all VMs to enlist in MAAS... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=40 # Timeout - 20 min
    while true; do
        all_enlisted=true
        
        for HOST in {{ nodes_hostnames }}; do
            # Fetch the dynamic MAC to identify the machine in MAAS
            MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
            if [ -z "$MAC" ]; then
                echo "  [..] Waiting for LXD to assign MAC address to '$HOST'..."
                all_enlisted=false
                continue
            fi
            SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
            status=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].status_name')
            
            if [ "$SYSTEM_ID" != "null" ] && [ "$status" = "New" ]; then
                echo -e "  [${BGREEN}OK${NC}] '$HOST' was enlisted with ID '$SYSTEM_ID'!"
            elif [[ "$status" == *"Failed"* ]]; then
                # Automatically retry testing on failure
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' is currently '$status'... Retrying!"
                maast {{ maas_user }} machine test $SYSTEM_ID
                all_enlisted=false
            else
                if [ "$status" = "null" ]; then
                    status="Waiting for PXE"
                fi
                echo "  [..] '$HOST' ($MAC) is currently '$status'..."
                all_enlisted=false
            fi
        done
        
        # If the flag is still true, everyone is enlisted -> break the loop
        if [ "$all_enlisted" = true ]; then
            echo -e "All VMs have successfully enlisted!\n"
            lxc list
            sleep 10
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for VMs to enlist. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Waiting 30s before next check (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 30
    done

- path: /usr/local/bin/08-maas-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create Availability Zones in MAAS
    echo -e "\n${BYELLOW}-------- Creating Availability Zones... --------${NC}\n"
    for i in $(seq 1 {{ max_ha }}); do
        ZONE="AZ$i"
        if ! maas {{ maas_user }} zones read | jq -e ".[] | select(.name==\"$ZONE\")" > /dev/null; then
            echo "Creating zone: $ZONE"
            maast {{ maas_user }} zones create name="$ZONE" description="Auto-generated AZ for HA Node $i"
        else
            echo "Zone $ZONE already exists."
        fi
    done
    
    echo "Assigning Primary MAAS Controller to AZ1..."
    maast {{ maas_user }} rack-controller update "$PRIMARY_RACK" zone="AZ1"
    
    # Find machines by MAC and set hostnames, domain, and explicit LXD power controls
    echo -e "\n${BYELLOW}-------- Configuring hostnames and power controls... --------${NC}\n"
    
    LXD_CERT_CONTENT=$(cat $LXD_CERT)
    LXD_KEY_CONTENT=$(cat $LXD_KEY)
    
    for HOST in {{ nodes_hostnames }}; do
        MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
        SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
        
        NODE_NUM=$(echo "$HOST" | awk -F'-' '{print $NF}')
        TARGET_ZONE="AZ${NODE_NUM}"
        
        # Force the MAAS hostname, domain, and explicit LXD power controls
        maast {{ maas_user }} machine update $SYSTEM_ID \
          hostname=$HOST \
          domain=$MAAS_DOMAIN_NAME_ID \
          zone=$TARGET_ZONE \
          power_type="lxd" \
          power_parameters_power_address="https://$LXD_ADDR" \
          power_parameters_certificate="$LXD_CERT_CONTENT" \
          power_parameters_key="$LXD_KEY_CONTENT" \
          power_parameters_instance_name="$HOST" \
          power_parameters_project="{{ lxd_project }}"
    done

- path: /usr/local/bin/09-maas-commission
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Commission machines
    echo -e "\n${BYELLOW}-------- Commissioning machines... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
        SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
        maast {{ maas_user }} machine commission $SYSTEM_ID
    done
    
    # Wait for VMs to be ready
    echo -e "\n${BYELLOW}-------- Waiting for VMs to enter 'Ready' state... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=30 # Timeout - 30 min
    HALF_ATTEMPTS=$((MAX_ATTEMPTS / 2))
    while true; do
        all_ready=true
        
        for HOST in {{ nodes_hostnames }}; do
            # Query MAAS for the status
            status=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].status_name')
            
            if [ "$status" = "Ready" ]; then
                echo -e "  [${BGREEN}OK${NC}] '$HOST' is '$status'!"
            elif [[ "$status" == *"Failed"* ]]; then
                # Automatically retry commissioning on failure
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' is currently '$status'... Retrying!"
                SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
                maast {{ maas_user }} machine commission $SYSTEM_ID
                all_ready=false
            elif [[ "$status" == *"Commissioning"* ]] && [ $ATTEMPTS -eq $HALF_ATTEMPTS ]; then
                # If stuck for 15 minutes, abort the current operation and try again
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' has been '$status' for too long. Aborting and retrying!"
                SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
                maast {{ maas_user }} machine abort $SYSTEM_ID
                sleep 5
                maast {{ maas_user }} machine commission $SYSTEM_ID
                all_ready=false
            else
                echo "  [..] '$HOST' is currently '$status'..."
                all_ready=false
            fi
        done
        
        # If the flag is still true, everyone is ready -> break the loop
        if [ "$all_ready" = true ]; then
            echo "All VMs are Ready!"
            maast {{ maas_user }} machines read
            netplan apply # Update MAAS DNS record
            sleep 10
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for VMs to reach 'Ready' state. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Waiting 60s before checking again (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 60
    done

- path: /usr/local/bin/10-maas-tagging
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create tags and add them to commissioned machines
    echo -e "\n${BYELLOW}-------- Creating and adding tags... --------${NC}\n"
    
    maast {{ maas_user }} tags create name=control
    maast {{ maas_user }} tags create name=compute
    maast {{ maas_user }} tags create name=storage
    maast {{ maas_user }} tags create name=network
    maast {{ maas_user }} tags create name=juju-controller
    
    for HOST in {{ nodes_hostnames }}; do
        SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
        
        # Tag main disks as SSDs
        echo -e "\n${BYELLOW}-------- Tagging main disks as SSDs for '$HOST'... --------${NC}\n"
        
        MAIN_BLOCK_ID=$(maas {{ maas_user }} block-devices read $SYSTEM_ID | jq -r '.[] | select(.serial | tostring | contains("lxd_osd") | not) | .id' | head -n 1)
        if [ -n "$MAIN_BLOCK_ID" ] && [ "$MAIN_BLOCK_ID" != "null" ]; then
            maast {{ maas_user }} block-device add-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=ssd
            maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=rotary
            maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=1rpm
            maast {{ maas_user }} block-device set-boot-disk $SYSTEM_ID $MAIN_BLOCK_ID
            maast {{ maas_user }} machine set-storage-layout $SYSTEM_ID storage_layout=flat
        fi
        
        echo -e "\n${BYELLOW}-------- Tagging '$HOST'... --------${NC}\n"
        
        case "$HOST" in
            juju-controller-*)
                maast {{ maas_user }} tag update-nodes juju-controller add=$SYSTEM_ID
                ;;
            
            node-*)
                maast {{ maas_user }} tag update-nodes control add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes compute add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes storage add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes network add=$SYSTEM_ID
                
                # Tag the ceph osd devices
                echo -e "\n${BYELLOW}-------- Tagging ceph storage for '$HOST'... --------${NC}\n"
                
                for i in $(seq 1 {{ node_osd_count }}); do
                    OSD_BLOCK_ID=$(maas {{ maas_user }} block-devices read $SYSTEM_ID | jq -r '.[] | select(.serial == "lxd_osd'${i}'") | .id')
                    
                    if [ -n "$OSD_BLOCK_ID" ] && [ "$OSD_BLOCK_ID" != "null" ]; then
                        maast {{ maas_user }} block-device add-tag $SYSTEM_ID $OSD_BLOCK_ID tag=ceph
                        maast {{ maas_user }} block-device add-tag $SYSTEM_ID $OSD_BLOCK_ID tag=ssd
                        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $OSD_BLOCK_ID tag=rotary
                        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $OSD_BLOCK_ID tag=1rpm
                    fi
                done
                
                # Tag the additional neutron interface
                echo -e "\n${BYELLOW}-------- Tagging neutron interface for '$HOST'... --------${NC}\n"
                
                NODE_NEUTRON_MAC=$(lxc config get $HOST volatile.eth1.hwaddr)
                NODE_NEUTRON_INTERFACE_ID=$(maas {{ maas_user }} interfaces read $SYSTEM_ID | jq -r '.[] | select(.mac_address=="'$NODE_NEUTRON_MAC'") | .id')
                
                if [ -n "$NODE_NEUTRON_INTERFACE_ID" ] && [ "$NODE_NEUTRON_INTERFACE_ID" != "null" ]; then
                    maast {{ maas_user }} interface update $SYSTEM_ID $NODE_NEUTRON_INTERFACE_ID tags=neutron:physnet1
                fi
                ;;
        esac
    done

- path: /usr/local/bin/11-juju-add-cloud
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create MAAS Juju Cloud configuration files
    echo -e "\n${BYELLOW}-------- Creating MAAS Juju Cloud Configs... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/maas-cloud.yaml
    clouds:
      maas:
        type: maas
        auth-types: [oauth1]
        endpoint: http://${IP_ADDRESS}:5240/MAAS
    EOF
    
    cat <<EOF > /home/{{ sys_user }}/maas-creds.yaml
    credentials:
      maas:
        anyuser:
          auth-type: oauth1
          maas-oauth: $APIKEY
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/maas-*.yaml
    
    # Add MAAS as a Juju Cloud
    echo -e "\n${BYELLOW}-------- Adding MAAS as a Juju Cloud... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-cloud --client -f /home/{{ sys_user }}/maas-cloud.yaml maas
    
    # Add MAAS as a Juju Cloud
    echo -e "\n${BYELLOW}-------- Adding MAAS Credentials to Juju... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-credential --client -f /home/{{ sys_user }}/maas-creds.yaml maas
    
    # Remove config files
    rm /home/{{ sys_user }}/maas-*.yaml

- path: /usr/local/bin/12-juju-bootstrap
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Bootstrap Juju controller
    echo -e "\n${BYELLOW}-------- Bootstrapping Juju Controller... --------${NC}\n"
    
    $RUN_AS_LOGIN juju bootstrap --bootstrap-base={{ juju_base }} --constraints tags=juju-controller maas juju-controller
    
    # Enable Juju HA if JUJU_HA > 1
    if [ {{ juju_ha }} -gt 1 ]; then
        echo -e "\n${BYELLOW}-------- Enabling Juju HA ({{ juju_ha }} nodes)... --------${NC}\n"
        
        $RUN_AS_LOGIN juju enable-ha -n {{ juju_ha }} --constraints tags=juju-controller
        
        echo -e "\n${BYELLOW}-------- Waiting for Juju HA controllers to provision... --------${NC}\n"
        for i in $(seq 1 $(({{ juju_ha }} - 1))); do
            $RUN_AS_LOGIN juju wait-for machine $i -m controller --timeout=20m --query="life==\"alive\" && status==\"started\""
        done
    fi

- path: /usr/local/bin/13-juju-deploy
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create Juju Model
    echo -e "\n${BYELLOW}-------- Creating '{{ custom_juju_models.split()[0] }}' Model... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-model --config default-base={{ juju_base }} {{ custom_juju_models.split()[0] }}
    
    echo -e "\n${BYELLOW}-------- Deploying Juju Machines... --------${NC}\n"
    
    $RUN_AS_LOGIN juju add-machine -n {{ node_ha }} --constraints tags=compute
    
    # Wait for machines to be started so LXD is ready
    echo -e "\n${BYELLOW}-------- Waiting for Machines to start... --------${NC}\n"
    
    TOTAL_MACHINES=$(({{ node_ha }} - 1))
    for i in $(seq 0 $TOTAL_MACHINES); do
        $RUN_AS_LOGIN juju wait-for machine $i --timeout=20m --query="life==\"alive\" && status==\"started\""
    done

- path: /usr/local/bin/14-juju-deploy-ceph-osd
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n${BYELLOW}-------- Deploying Ceph OSD... --------${NC}\n"
    
    # Dynamically generate the block device path string (sdb, sdc, sdd...) based on OSD count
    DEVICES=""
    LETTERS="b c d e f g h i j k l m"
    for i in $(seq 1 {{ node_osd_count }}); do
        LETTER=$(echo "$LETTERS" | cut -d' ' -f$i)
        DEVICES="$DEVICES /dev/sd$LETTER"
    done
    
    cat <<EOF > /home/{{ sys_user }}/ceph-osd.yaml
    ceph-osd:
      osd-devices:$DEVICES
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/ceph-osd.yaml
    
    BAREMETAL_PLACEMENT=$(seq -s, 0 $(({{ node_ha }} - 1)))
    $RUN_AS_LOGIN juju deploy -n {{ node_ha }} --to $BAREMETAL_PLACEMENT --channel {{ ceph_channel }} --config /home/{{ sys_user }}/ceph-osd.yaml ceph-osd
    
    rm /home/{{ sys_user }}/ceph-osd.yaml
    
    # Wait for Ceph OSD to be deployed
    echo -e "\n${BYELLOW}-------- Waiting for Ceph OSD to be deployed... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application ceph-osd --timeout={{ timeout }} --query="life==\"alive\" && status==\"blocked\" && len(units) == {{ node_ha }}"

- path: /usr/local/bin/15-juju-deploy-nova-compute
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n${BYELLOW}-------- Deploying Nova Compute... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/nova-compute.yaml
    nova-compute:
      config-flags: default_ephemeral_format=ext4
      enable-live-migration: true
      enable-resize: true
      migration-auth-type: ssh
      virt-type: qemu
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/nova-compute.yaml
    
{% if node_ha >= 4 %}
    NOVA_UNITS=$(({{ node_ha }} - 1))
    NOVA_PLACEMENT=$(seq -s, 1 $(({{ node_ha }} - 1)))
{% else %}
    NOVA_UNITS={{ node_ha }}
    NOVA_PLACEMENT=$(seq -s, 0 $(({{ node_ha }} - 1)))
{% endif %}
    
    $RUN_AS_LOGIN juju deploy -n $NOVA_UNITS --to $NOVA_PLACEMENT --channel {{ openstack_channel }} --config /home/{{ sys_user }}/nova-compute.yaml nova-compute
    
    rm /home/{{ sys_user }}/nova-compute.yaml
    
    # Wait for Nova Compute to be deployed
    echo -e "\n${BYELLOW}-------- Waiting for Nova Compute to be deployed... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application nova-compute --timeout={{ timeout }} --query="life==\"alive\" && status==\"blocked\" && len(units) == $NOVA_UNITS"

- path: /usr/local/bin/16-juju-deploy-mysql
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n${BYELLOW}-------- Deploying MySQL InnoDB Cluster... --------${NC}\n"
    
    $RUN_AS_LOGIN juju deploy -n 3 --to lxd:0,lxd:1,lxd:2 --channel {{ mysql_channel }} mysql-innodb-cluster
    
    # Wait for MySQL InnoDB Cluster to be ready
    echo -e "\n${BYELLOW}-------- Waiting for MySQL InnoDB Cluster to be ready... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application mysql-innodb-cluster --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == 3"

- path: /usr/local/bin/17-juju-deploy-vault
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n${BYELLOW}-------- Deploying Vault... --------${NC}\n"
    
    $RUN_AS_LOGIN juju deploy --to lxd:{{ 3 if node_ha >= 4 else 0 }} --channel {{ vault_channel }} vault
    
    # Join Vault to the cloud database
    echo -e "\n${BYELLOW}-------- Joining Vault to the Cloud Database... --------${NC}\n"
    
    $RUN_AS_LOGIN juju deploy --channel {{ mysql_channel }} mysql-router vault-mysql-router
    $RUN_AS_LOGIN juju integrate vault-mysql-router:db-router mysql-innodb-cluster:db-router
    $RUN_AS_LOGIN juju integrate vault-mysql-router:shared-db vault:shared-db
    
    # Wait for Vault to be deployed
    echo -e "\n${BYELLOW}-------- Waiting for Vault to be deployed... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application vault --timeout={{ timeout }} --query="life==\"alive\" && status==\"blocked\""
    $RUN_AS_LOGIN juju wait-for application vault-mysql-router --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\""
    
    # Perform Vault initialization
    echo -e "\n${BYELLOW}-------- Initializing Vault... --------${NC}\n"
    
    sleep 60
    $RUN_AS_LOGIN juju exec --unit vault/leader "VAULT_ADDR='http://127.0.0.1:8200' vault operator init -key-shares=1 -key-threshold=1 -format=json" > /home/{{ sys_user }}/vault-init.json
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/vault-init.json
    chmod 600 /home/{{ sys_user }}/vault-init.json
    
    UNSEAL_KEY=$(jq -r '.unseal_keys_b64[0]' /home/{{ sys_user }}/vault-init.json)
    ROOT_TOKEN=$(jq -r '.root_token' /home/{{ sys_user }}/vault-init.json)
    
    echo -e "\n Unseal Key - $UNSEAL_KEY \n"
    echo -e "\n Root Token - $ROOT_TOKEN \n"
    
    # Unsealing Vault
    echo -e "\n${BYELLOW}-------- Unsealing Vault... --------${NC}\n"
    
    $RUN_AS_LOGIN juju exec --application vault "VAULT_ADDR='http://127.0.0.1:8200' vault operator unseal $UNSEAL_KEY"
    
    # Authorize Vault
    echo -e "\n${BYELLOW}-------- Authorizing Vault... --------${NC}\n"
    
    $RUN_AS_LOGIN juju run vault/leader authorize-charm token="$ROOT_TOKEN"
    
    # Have Vault generate a self-signed root CA certificate
    echo -e "\n${BYELLOW}-------- Generating Self-signed root CA certificate... --------${NC}\n"
    
    $RUN_AS_LOGIN juju run vault/leader generate-root-ca
    $RUN_AS_LOGIN juju integrate mysql-innodb-cluster:certificates vault:certificates
    
    # Wait for Vault to be ready
    echo -e "\n${BYELLOW}-------- Waiting for Vault to be ready... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application vault --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\""

- path: /usr/local/bin/18-juju-deploy-neutron
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    echo -e "\n${BYELLOW}-------- Deploying Neutron... --------${NC}\n"
    
    cat <<EOF > /home/{{ sys_user }}/neutron.yaml
    ovn-chassis:
      bridge-interface-mappings: br-ex:enp6s0
      ovn-bridge-mappings: physnet1:br-ex
    neutron-api:
      neutron-security-groups: true
      flat-network-providers: physnet1
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/neutron.yaml
    
    $RUN_AS_LOGIN juju deploy -n 3 --to lxd:0,lxd:1,lxd:2 --channel {{ ovn_channel }} ovn-central
    $RUN_AS_LOGIN juju deploy --to lxd:1 --channel {{ openstack_channel }} --config /home/{{ sys_user }}/neutron.yaml neutron-api
    
    # Deploy the subordinate charm applications
    $RUN_AS_LOGIN juju deploy --channel {{ openstack_channel }} neutron-api-plugin-ovn
    $RUN_AS_LOGIN juju deploy --channel {{ ovn_channel }} --config /home/{{ sys_user }}/neutron.yaml ovn-chassis
    
    rm /home/{{ sys_user }}/neutron.yaml
    
    # Wait for OVN Central to be deployed
    echo -e "\n${BYELLOW}-------- Waiting for OVN Central to be deployed... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for application ovn-central --timeout={{ timeout }} --query="life==\"alive\" && status==\"blocked\" && len(units) == 3"
    
    # Integrate Neutron API with OVN
    echo -e "\n${BYELLOW}-------- Integrate Neutron API with OVN... --------${NC}\n"
    
    $RUN_AS_LOGIN juju integrate neutron-api-plugin-ovn:neutron-plugin neutron-api:neutron-plugin-api-subordinate
    $RUN_AS_LOGIN juju integrate neutron-api-plugin-ovn:ovsdb-cms ovn-central:ovsdb-cms
    $RUN_AS_LOGIN juju integrate ovn-chassis:ovsdb ovn-central:ovsdb
    
    # Integrate OVN with Nova Compute
    echo -e "\n${BYELLOW}-------- Integrate OVN with Nova Compute... --------${NC}\n"
    
    $RUN_AS_LOGIN juju integrate ovn-chassis:nova-compute nova-compute:neutron-plugin
    
    # Integrate Certificates
    echo -e "\n${BYELLOW}-------- Integrate Certificates... --------${NC}\n"
    
    $RUN_AS_LOGIN juju integrate neutron-api:certificates vault:certificates
    $RUN_AS_LOGIN juju integrate neutron-api-plugin-ovn:certificates vault:certificates
    $RUN_AS_LOGIN juju integrate ovn-central:certificates vault:certificates
    $RUN_AS_LOGIN juju integrate ovn-chassis:certificates vault:certificates
    
    # Join Neutron API to the cloud database
    echo -e "\n${BYELLOW}-------- Joining Neutron API to the Cloud Database... --------${NC}\n"
    
    $RUN_AS_LOGIN juju deploy --channel {{ mysql_channel }} mysql-router neutron-api-mysql-router
    $RUN_AS_LOGIN juju integrate neutron-api-mysql-router:db-router mysql-innodb-cluster:db-router
    $RUN_AS_LOGIN juju integrate neutron-api-mysql-router:shared-db neutron-api:shared-db
    
    # Wait for OVN Central & Chassis to be ready
    echo -e "\n${BYELLOW}-------- Waiting for OVN Central & Chassis to be ready... --------${NC}\n"
    
    NOVA_UNITS={{ (node_ha - 1) if node_ha >= 4 else node_ha }}
    $RUN_AS_LOGIN juju wait-for application ovn-central --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == 3"
    $RUN_AS_LOGIN juju wait-for application ovn-chassis --timeout={{ timeout }} --query="life==\"alive\" && status==\"active\" && len(units) == $NOVA_UNITS"
