- path: /usr/local/bin/28-openstack-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Wait for OpenStack model to finish deploying
    echo -e "\n${BYELLOW}-------- Wait for OpenStack to finish deploying... --------${NC}\n"
    
    $RUN_AS_LOGIN juju wait-for model {{ custom_juju_models.split()[0] }} --timeout={{ timeout }} --query="life==\"alive\" && status==\"available\" && forEach(applications, app => app.status == \"active\")"
    
    # Generate openrc
    echo -e "\n${BYELLOW}-------- Set openrc... --------${NC}\n"
    
    cat <<'EOF' > /home/{{ sys_user }}/openrc
    # Navigate Juju 2.9/3.x
    JUJU_VERSION=$(juju version | cut -c 1)
    
    if [ $JUJU_VERSION -eq 2 ]; then
        RUN="run"
    else
        RUN="exec"
    fi
    
    # Place the cloud's CA certificate in a file readable by the openstackclients snap
    _snap_user_dir=/home/{{ sys_user }}/snap/openstackclients/common
    if [ ! -d $_snap_user_dir ]; then
        mkdir -p $_snap_user_dir
    fi
    _root_ca=$_snap_user_dir/root-ca.crt
    juju ${RUN} -u vault/leader -- 'leader-get root-ca' | tee $_root_ca >/dev/null 2>&1
    
    # Find an IP address for Keystone
    _keystone_vip=$(juju config keystone vip)
    if [ -n "$_keystone_vip" ]; then
        _keystone_ip=$(echo $_keystone_vip | awk '{print $1}')
    else
        _keystone_ip=$(juju ${RUN} -u keystone/leader -- 'network-get --bind-address public')
    fi
    
    # Query for the Keystone admin password
    _password=$(juju ${RUN} -u keystone/leader -- 'leader-get admin_passwd')
    
    # Unset possible undercloud environment variables
    unset "${!OS_*}"
    
    # Set the OpenStack environment variables
    export OS_AUTH_PROTOCOL=https
    export OS_CACERT=${_root_ca}
    export OS_AUTH_URL=${OS_AUTH_PROTOCOL:-http}://${_keystone_ip}:5000/v3
    export OS_USERNAME=admin
    export OS_PASSWORD=${_password}
    export OS_USER_DOMAIN_NAME=admin_domain
    export OS_PROJECT_DOMAIN_NAME=admin_domain
    export OS_PROJECT_NAME=admin
    export OS_REGION_NAME=RegionOne
    export OS_IDENTITY_API_VERSION=3
    # Swift needs this
    export OS_AUTH_VERSION=3
    # Gnocchi needs this
    export OS_AUTH_TYPE=password
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/openrc
    
    # Configure OpenStack resources
    echo -e "\n${BYELLOW}-------- Configure OpenStack... --------${NC}\n"
    
    cat <<'EOF' > /home/{{ sys_user }}/openstack-config.sh
    #!/bin/bash
    
    source /etc/repro-env
    
    # Source openrc and print env variables
    echo -e "\n\n-------- Source openrc... --------\n"
    
    source /home/{{ sys_user }}/openrc
    env | grep OS_
    
    # Confirm the user environment
    openstack endpoint list --interface admin
    
    # Download image and set Flavor
    echo -e "\n\n-------- Download {{ os_base_flavor }} image... --------\n"
    
    mkdir -p /home/{{ sys_user }}/cloud-images
    wget -nv http://cloud-images.ubuntu.com/{{ os_base_flavor }}/current/{{ os_base_flavor }}-server-cloudimg-amd64.img -O /home/{{ sys_user }}/cloud-images/{{ os_base_flavor }}-amd64.img
    
    # Import image into Glance
    echo -e "\n\n-------- Import {{ os_base_flavor }} image into Glance... --------\n"
    
    openstack image create --public --container-format bare --disk-format qcow2 --file /home/{{ sys_user }}/cloud-images/{{ os_base_flavor }}-amd64.img {{ os_base_flavor }}-amd64
    
    # Create a flavor
    echo -e "\n\n-------- Create a Flavor... --------\n"
    
    openstack flavor create --ram {{ os_ram_flavor }} --disk {{ os_disk_flavor }} --ephemeral {{ os_e_disk_flavor }} m1
    
    # Set up public networking
    echo -e "\n\n-------- Set up public networking... --------\n"
    
    # Create an external public (shared) network called 'ext_net'
    openstack network create --external --share --provider-network-type flat --provider-physical-network physnet1 ext_net
    
    # Create the subnet called 'ext_subnet'
    openstack subnet create --network ext_net --no-dhcp --gateway $OS_NEUTRON_GATEWAY --subnet-range {{ os_neutron_cidr }} --allocation-pool start=$OS_RESERVED_IP_START,end=$OS_RESERVED_IP_END ext_subnet
    EOF
    
    chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/openstack-config.sh
    chmod 755 /home/{{ sys_user }}/openstack-config.sh
    
    $RUN_AS_LOGIN /home/{{ sys_user }}/openstack-config.sh
    
    echo -e "\n${BYELLOW}-------- Finished deploying Charmed OpenStack, have fun!... --------${NC}\n"

