    config:
      core.https_address: '[::]:8444'
    networks:
    - config:
        ipv4.address: {{ maas_gateway }}/{{ maas_prefix }}
        ipv4.dhcp: "false"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Non-DHCP NAT bridge for MAAS"
      name: {{ maas_bridge }}
      type: bridge
      project: default
    - config:
        ipv4.address: {{ os_neutron_gateway_ip }}/{{ os_neutron_prefix }}
        ipv4.dhcp: "true"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Neutron managed bridge"
      name: {{ os_neutron_bridge }}
      type: bridge
      project: default
    storage_pools:
    - config:
      description: "Nested Storage"
      name: default
      driver: dir
    profiles:
    - config:
        limits.cpu: "2"
        limits.memory: 6GiB
      description: "Default LXD profile"
      devices:
        eth0:
          name: eth0
          network: {{ maas_bridge }}
          type: nic
        root:
          path: /
          pool: default
          type: disk
      name: default
    projects: []
    cluster: null
