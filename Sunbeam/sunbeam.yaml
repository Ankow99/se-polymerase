fqdn: {{ base_name }}.{{ tld }}
prefer_fqdn_over_hostname: true
{% else %}
hostname: {{ base_name }}
{% endif %}

# Create user and config auth
users:
  - name: {{ sys_user }}
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: adm, sys, lxd, sudo
    shell: /bin/bash
{% if not ssh_key and not ssh_import_id %}
    plain_text_passwd: "{{ password }}"
    lock_passwd: false
{% endif %}
{% if ssh_key %}
    ssh_authorized_keys:
      - {{ ssh_key }}
{% endif %}
{% if ssh_import_id %}
    ssh_import_id:
      - {{ ssh_import_id }}
{% endif %}

# Enable SSH Password Auth ONLY if no keys are provided
{% if not ssh_key and not ssh_import_id %}
ssh_pwauth: true
{% else %}
ssh_pwauth: false
{% endif %}

# Config Ubuntu Pro
{% if pro_token %}
ubuntu_pro:
  token: {{ pro_token }}
{% endif %}

timezone: {{ timezone }}

packages:
  - git
  - neovim
  - jq

{% if not maas_snap %}
apt:
  sources:
    maas:
      source: 'ppa:maas/{{ maas_channel.split('/')[0] }}'
{% endif %}

snap:
  commands:
  - snap install yq
  - snap install lxd --channel={{ lxd_channel }}
{% if maas_snap %}
  - snap install maas --channel={{ maas_channel }}
{% endif %}
{% if sunbeam_revision %}
  - snap install openstack --revision={{ sunbeam_revision }}
  - snap switch openstack --channel={{ sunbeam_channel }}
{% else %}
  - snap install openstack --channel={{ sunbeam_channel }}
{% endif %}

package_update: {{ 'true' if update_n_upgrade else 'false' }}
package_upgrade: {{ 'true' if update_n_upgrade else 'false' }}
package_reboot_if_required: {{ 'true' if update_n_upgrade else 'false' }}

{% if nested_lxd %}
# If Nested: Seed the LXD database natively via cloud-init
lxd:
  preseed: |
    config:
      core.https_address: '[::]:8444'
    networks:
    - config:
        ipv4.address: {{ maas_gateway }}/{{ maas_prefix }}
        ipv4.dhcp: "false"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Non-DHCP NAT bridge for MAAS"
      name: {{ maas_bridge }}
      type: bridge
      project: default
    - config:
        ipv4.address: {{ os_neutron_gateway_ip }}/{{ os_neutron_prefix }}
        ipv4.dhcp: "true"
        ipv4.nat: "true"
        ipv6.address: none
      description: "Neutron managed bridge"
      name: {{ os_neutron_bridge }}
      type: bridge
      project: default
    storage_pools:
    - config:
        size: {{ nested_storage }}
      description: "Nested ZFS Storage"
      name: default
      driver: zfs 
    profiles:
    - config:
        limits.cpu: "2"
        limits.memory: 6GiB
      description: "Default LXD profile"
      devices:
        eth0:
          name: eth0
          network: {{ maas_bridge }}
          type: nic
        root:
          path: /
          pool: default
          type: disk
      name: default
    projects: []
    cluster: null
{% endif %}

write_files:
# Auto login script helper function (MAAS - LXD - Sunbeam)
- path: /etc/profile.d/maas-login.sh
  permissions: '0644'
  content: |
    if [ "$USER" = "{{ sys_user }}" ] || [ "$USER" = "root" ]; then
        IS_NESTED_LXD="{{ 'true' if nested_lxd else 'false' }}"
        LXD_PROJECT="{{ lxd_project }}"
        ADMIN_USER="{{ maas_user }}"
        
        if command -v maas >/dev/null 2>&1 && sudo maas apikey --username {{ maas_user }} >/dev/null 2>&1; then
            maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $(sudo maas apikey --username {{ maas_user }}) >/dev/null 2>&1
        fi
        
        if command -v lxc >/dev/null 2>&1; then
            if [ "$IS_NESTED_LXD" = "false" ]; then
                lxc remote switch host-lxd >/dev/null 2>&1 || true
            fi
            
            if [ "$LXD_PROJECT" != "default" ]; then
                lxc project switch "$LXD_PROJECT" >/dev/null 2>&1 || true
            fi
        fi
        
        if [ -f "/home/{{ sys_user }}/admin-openrc" ]; then
            source /home/{{ sys_user }}/admin-openrc
        fi
        
        if [ -f "/etc/repro-env" ]; then
            source /etc/repro-env
        fi
    fi

# MAAS Pretty table JSON parser - maast()
- path: /usr/local/bin/maast
  permissions: '0755'
  content: |
    #!/bin/bash
    out=$(maas "$@")
    ret=$?

    if [ $ret -ne 0 ] || [ -z "$out" ] || ! echo "$out" | jq -e . >/dev/null 2>&1; then
        echo "$out"
        exit $ret
    fi

    target="$2"

    # Helper function to align and draw OpenStack-style tables
    prettify() {
        python3 -c '
    import sys
    # 1. Read input and strip empty lines
    raw_lines = [line.strip("\n").split("\t") for line in sys.stdin if line.strip("\n")]
    
    # 2. Handle completely empty results gracefully
    if not raw_lines:
        print("\n[ No records found. ]\n")
        sys.exit(0)
    
    # 3. Remove the legacy dash separator from jq if it exists
    if len(raw_lines) > 1 and all(cell.replace("-", "").strip() == "" for cell in raw_lines[1]):
        raw_lines.pop(1)
        
    # 4. Catch empty strings and convert to "-" for a solid grid
    lines = [["-" if cell == "" or cell == "null" else cell for cell in row] for row in raw_lines]
        
    # 5. Calculate optimal column widths
    col_widths = [max(len(str(item)) for item in col) for col in zip(*lines)]
    
    def print_sep():
        print("+" + "+".join("-" * (w + 2) for w in col_widths) + "+")
        
    print("")
    print_sep()
    # 6. Print headers CENTERED
    print("| " + " | ".join(str(item).center(w) for item, w in zip(lines[0], col_widths)) + " |")
    print_sep()
    
    # 7. Print data LEFT-ALIGNED
    for row in lines[1:]:
        row_ext = row + [""] * (len(col_widths) - len(row))
        print("| " + " | ".join(str(item).ljust(w) for item, w in zip(row_ext, col_widths)) + " |")
        
    print_sep()
    '
    }

    case "$target" in
        machines|machine|nodes|node)
            echo "$out" | jq -r '(["HOSTNAME", "STATUS", "POWER", "PWR TYPE", "IP ADDRESS", "SYSTEM ID"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.hostname, .status_name, .power_state, (.power_type // "-"), (.ip_addresses[0] // "-"), .system_id]) | @tsv' | prettify
            ;;
        block-devices|block-device)
            echo "$out" | jq -r '(["ID", "NAME", "TYPE", "SIZE", "MODEL", "TAGS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .type, .size, (.model // "-"), (.tags | join(",") // "-")]) | @tsv' | prettify
            ;;
        partitions|partition)
            echo "$out" | jq -r '(["ID", "PATH", "SIZE", "FSTYPE", "UUID"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .path, .size, (.fstype // "-"), (.uuid // "-")]) | @tsv' | prettify
            ;;
        interfaces|interface)
            echo "$out" | jq -r '(["ID", "NAME", "TYPE", "MAC ADDRESS", "VLAN", "TAGS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .type, (.mac_address // "-"), (.vlan.vid // "-"), (.tags | join(",") // "-")]) | @tsv' | prettify
            ;;
        tags|tag)
            echo "$out" | jq -r '(["NAME", "COMMENT", "NODES"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, (.comment // "-"), (.node_count // "-")]) | @tsv' | prettify
            ;;
        boot-source-selections|boot-source-selection)
            echo "$out" | jq -r '(["OS", "RELEASE", "ARCHES", "SUBARCHES", "LABELS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.os, .release, (.arches | join(",")), (.subarches | join(",")), (.labels | join(","))]) | @tsv' | prettify
            ;;
        boot-resources|boot-resource)
            echo "$out" | jq -r '(["NAME", "ARCHITECTURE", "TYPE", "SIZE"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .architecture, .type, (.size // "-")]) | @tsv' | prettify
            ;;
        subnets|subnet)
            echo "$out" | jq -r '(["NAME", "CIDR", "GATEWAY", "VLAN", "FABRIC"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .cidr, (.gateway_ip // "-"), .vlan.vid, .vlan.fabric]) | @tsv' | prettify
            ;;
        fabrics|fabric)
            echo "$out" | jq -r '(["ID", "NAME", "CLASS", "DESCRIPTION"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, .class_type, (.description // "-")]) | @tsv' | prettify
            ;;
        vlans|vlan)
            echo "$out" | jq -r '(["NAME", "VID", "FABRIC", "DHCP", "SPACE"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .vid, .fabric, .dhcp_on, (.space // "-")]) | @tsv' | prettify
            ;;
        spaces|space)
            echo "$out" | jq -r '(["ID", "NAME", "SUBNETS"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.id, .name, (.subnets | length)]) | @tsv' | prettify
            ;;
        ipranges|iprange)
            echo "$out" | jq -r '(["TYPE", "START IP", "END IP", "COMMENT"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.type, .start_ip, .end_ip, (.comment // "-")]) | @tsv' | prettify
            ;;
        domains|domain)
            echo "$out" | jq -r '(["NAME", "AUTHORITATIVE", "DEFAULT", "TTL"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.name, .authoritative, .is_default, (.ttl // "-")]) | @tsv' | prettify
            ;;
        rack-controllers|rack-controller)
            echo "$out" | jq -r '(["HOSTNAME", "STATUS", "ZONE", "VERSION"] | (., map(length*"-"))), ((if type=="array" then . else [.] end)[] | [.hostname, .status_name, .zone.name, .version]) | @tsv' | prettify
            ;;
        *)
            echo "$out" | python3 -c '
    import sys, json
    try:
        data = json.load(sys.stdin)
        if isinstance(data, dict): data = [data]
        if not data or not isinstance(data, list):
            print(json.dumps(data, indent=2))
            sys.exit(0)
            
        ignored_suffixes = ("_uri", "_status_name", "_test_status", "_count")
        
        keys = []
        for k, v in data[0].items():
            if not isinstance(v, (str, int, bool, float)): continue
            if any(k.endswith(s) for s in ignored_suffixes): continue
            if k == "id": continue
            keys.append(k)
            
        keys = keys[:6]
        if not keys:
            keys = [k for k, v in data[0].items() if isinstance(v, (str, int, bool, float))][:4]
            
        if not keys:
            print(json.dumps(data, indent=2))
            sys.exit(0)
            
        print("\t".join(k.upper().replace("_", " ") for k in keys))
        print("\t".join("-" * len(k) for k in keys))
        for item in data:
            print("\t".join(str(item.get(k, "-")) for k in keys))
    except Exception:
        sys.exit(1)
    ' | prettify || echo "$out" | jq -C .
            ;;
    esac

# Sunbeam helper: Sunbeam function to simplify automated usage - run_sunbeam "command" [logfile]
- path: /usr/local/bin/run_sunbeam
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Source the environment variables so it has $RUN_AS_LOGIN, $AUTO_RETRY, $BRED, etc.
    if [ -f "/etc/repro-env" ]; then
        source /etc/repro-env
    else
        echo "Error: /etc/repro-env not found."
        exit 1
    fi
    
    cmd="$1"
    log_file="$2"
    exit_code=0
    
    if [ -z "$log_file" ]; then
        # No log file provided, just print cleanly to stdout
        $RUN_AS_LOGIN script -q -e -f -c "$cmd" /dev/null | sed -u -e 's/\r$//' -e 's/.*\r//'
        exit_code=${PIPESTATUS[0]}
    else
        > "$log_file" # Clean the log file on the first run
        $RUN_AS_LOGIN script -q -e -f -c "$cmd" /dev/null | sed -u -e 's/\r$//' -e 's/.*\r//' | tee "$log_file"
        exit_code=${PIPESTATUS[0]}
        
        # Auto-retry once if a Juju timeout is detected
        if [ "$AUTO_RETRY" = "true" ] && [ $exit_code -ne 0 ] && grep -q "wait timed out after" "$log_file"; then
            echo -e "\n${BYELLOW}Timeout detected. Waiting 60s and retrying once...${NC}\n"
            sleep 60
            $RUN_AS_LOGIN script -q -e -f -c "$cmd" /dev/null | sed -u -e 's/\r$//' -e 's/.*\r//' | tee -a "$log_file"
            exit_code=${PIPESTATUS[0]}
        fi
        
        # Warn user and show logfile command if the run failed
        if [ $exit_code -ne 0 ]; then
            echo -e "\n${BRED}Command failed. To check the logfile for errors, run:${NC} less -R $log_file\n"
        fi
    fi
    
    # Return the exit code of 'script', bypassing sed/tee
    echo -ne "\033[?25h" # Force cursor to reappear
    exit $exit_code

# Sunbeam helper: Wait for an entire model to stabilize - wait_for_model <model>
- path: /usr/local/bin/wait_for_model
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Source the environment variables
    if [ -f "/etc/repro-env" ]; then
        source /etc/repro-env
    else
        echo "Error: /etc/repro-env not found."
        exit 1
    fi
    
    MODEL="$1"
    
    if [ -z "$MODEL" ]; then
        echo "Usage: wait_for_model <model-name>"
        exit 1
    fi
    
    echo -e "\n${BYELLOW}-------- Waiting for '$MODEL' model to stabilize... --------${NC}\n"
    
    if ! $RUN_AS_LOGIN juju wait-for model "$MODEL" --timeout=30m --query='life=="alive" && status=="available" && forEach(applications, app => app.status == "active")'; then
        echo -e "  [${BRED}!!${NC}] Timed out waiting for '$MODEL' model to stabilize.  Aborting."
        exit 1
    else
        echo -e "  [${BGREEN}OK${NC}] The '$MODEL' model is stable!"
    fi

# Sunbeam helper: Wait for an application to become active - wait_for_app <app> [model] [unit_count]
- path: /usr/local/bin/wait_for_app
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Source the environment variables
    if [ -f "/etc/repro-env" ]; then
        source /etc/repro-env
    else
        echo "Error: /etc/repro-env not found."
        exit 1
    fi
    
    APP="$1"
    MODEL="${2:-openstack}"
    UNIT_COUNT="$3"
    
    if [ -z "$APP" ]; then
        echo "Usage: wait_for_app <application-name> [model-name] [unit-count]"
        exit 1
    fi
    
    echo -e "\n${BYELLOW}-------- Waiting for '$APP' to reach 'active' state in model '$MODEL'... --------${NC}\n"
    
    QUERY='life=="alive" && status=="active"'
    if [ -n "$UNIT_COUNT" ]; then
        QUERY="life==\"alive\" && status==\"active\" && len(units) == $UNIT_COUNT"
    fi
    
    if ! $RUN_AS_LOGIN juju wait-for application "$APP" -m "$MODEL" --timeout=20m --query="$QUERY"; then
        echo -e "  [${BRED}!!${NC}] $APP failed to become active within the timeout. Aborting."
        exit 1
    else
        echo -e "  [${BGREEN}OK${NC}] $APP is Active!"
    fi

# Sunbeam helper: Unseal vault - unseal_vault()
- path: /usr/local/bin/unseal_vault
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Source the environment variables
    if [ -f "/etc/repro-env" ]; then
        source /etc/repro-env
    else
        echo "Error: /etc/repro-env not found."
        exit 1
    fi
    
    echo -e "\n${BYELLOW}-------- Initializing Vault... --------${NC}\n"
    
    if grep -q "Root token:" "$VAULT_INIT" 2>/dev/null; then
        echo "Vault already initialized. Using existing keys..."
    else
        echo "Initializing Vault..."
        $RUN_AS_LOGIN sunbeam vault init 1 1 > "$VAULT_INIT"
    fi
    
    VAULT_KEY=$(awk '/Unseal keys:/{getline; print}' "$VAULT_INIT" | tr -d ' ')
    if [ -z "$VAULT_KEY" ]; then
        echo -e "  [${BRED}!!${NC}] Failed to parse Vault unseal key from $VAULT_INIT."
        exit 1
    fi
    
    VAULT_UNIT_COUNT=$($RUN_AS_LOGIN bash -c "sunbeam vault status | grep -c 'vault/'")
    if [ -z "$VAULT_UNIT_COUNT" ] || [ "$VAULT_UNIT_COUNT" -eq 0 ]; then
        VAULT_UNIT_COUNT={{ cloud_ha }}
    fi
    
    echo "Attempting to unseal $VAULT_UNIT_COUNT Vault unit(s)..."
    for i in $(seq 1 $VAULT_UNIT_COUNT); do
        echo -e "\nSending unseal key to Vault unit $i..."
        run_sunbeam "sunbeam vault unseal '$VAULT_KEY'"
    done
    
    echo -e "\nVault keys saved to '$VAULT_INIT' (KEEP THIS SAFE!)"
    $RUN_AS_LOGIN sunbeam vault status

- path: /etc/profile.d/default-editor.sh
  permissions: '0644'
  content: |
    export EDITOR=nvim

- path: /etc/sudoers.d/keep-editor
  permissions: '0440'
  content: |
    Defaults env_keep += "EDITOR"

{% if not nested_lxd and lxd_cert_b64 and lxd_key_b64 %}
# Non-nested specific files (Host's LXD Certificates)
- path: /root/snap/lxd/common/config/client.crt
  owner: root:root
  permissions: '0644'
  encoding: b64
  content: {{ lxd_cert_b64 }}

- path: /root/snap/lxd/common/config/client.key
  owner: root:root
  permissions: '0600'
  encoding: b64
  content: {{ lxd_key_b64 }}
{% endif %}

# ==========================================
# START OF AUTOMATION SCRIPTS (00 to 15)
# ==========================================

- path: /usr/local/bin/00-generate-env
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    # Define colors first
    BRED='\033[1;31m'
    BYELLOW='\033[1;33m'
    BGREEN='\033[1;32m'
    NC='\033[0m'
    
    echo -e "\n${BYELLOW}-------- Generating Runtime Environment... --------${NC}\n"
    
    # 1. Calculate Runtime Variables
    IP_ADDRESS=$(hostname -I | awk '{print $1}')
    INTERFACE=$(ip -j route show default | jq -r '.[].dev')
    
    # LXD Setup Logic
{% if nested_lxd %}
    LXD_ADDR="${IP_ADDRESS}:8444"
    LXD_CERT="/root/lxd-local.crt"
    LXD_KEY="/root/lxd-local.key"
{% else %}
    LXD_ADDR="{{ maas_gateway }}:8443"
    LXD_CERT="/root/snap/lxd/common/config/client.crt"
    LXD_KEY="/root/snap/lxd/common/config/client.key"
{% endif %}
    
    # 2. Write Base Variables to the Persistent State File
    cat <<EOF > /etc/repro-env
    # -- Colours --
    export BRED='${BRED}'
    export BYELLOW='${BYELLOW}'
    export BGREEN='${BGREEN}'
    export NC='${NC}'
    # ----
    export IP_ADDRESS="$IP_ADDRESS"
    export INTERFACE="$INTERFACE"
    export RUN_AS="sudo -u {{ sys_user }}"
    export RUN_AS_LOGIN="sudo -i -u {{ sys_user }}"
    export LXD_ADDR="$LXD_ADDR"
    export LXD_CERT="$LXD_CERT"
    export LXD_KEY="$LXD_KEY"
    export MANIFEST_FILE="/home/{{ sys_user }}/manifest.yaml"
    export AUTO_RETRY="{{ 'true' if auto_retry else 'false' }}"
    export CERTS_FOLDER="/home/{{ sys_user }}/certs"
    export VAULT_INIT="/home/{{ sys_user }}/vault-init.txt"
    EOF
    
    # 3. Secure the state file (Only root and sys_user can read it)
    chown {{ sys_user }}:{{ sys_user }} /etc/repro-env
    chmod 600 /etc/repro-env
    
    # 4. Handle Python IP Math (Append output to state file)
    echo -e "\n${BYELLOW}-------- Calculating Payload IP Allocations --------${NC}\n"
    
    python3 -c "
    import ipaddress, sys
    try:
        net = ipaddress.IPv4Network('{{ maas_cidr }}', strict=False)
        hosts = list(net.hosts())
        
        dhcp_count = int('{{ maas_ip_count }}')
        int_count  = int('{{ os_int_api_ip_count }}')
        pub_count  = int('{{ os_pub_api_ip_count }}')
        masakari   = '{{ "true" if os_add_masakari else "false" }}' == 'true'
        
        instance_rec = 1 if masakari else 0
        
        # Ensure the subnet is large enough (dhcp + int + pub + instance_rec + 5 static)
        total_needed = dhcp_count + int_count + pub_count + instance_rec + 5
        if len(hosts) < total_needed:
            sys.stderr.write(f'CRITICAL: Subnet {net} is too small to fit the requested IP ranges!\n')
            sys.exit(1)
        
        maas_gw = hosts[0]
        
        # Top-Down Allocation Logic
        maas_e = hosts[-1]
        maas_s = hosts[-dhcp_count]
        
        int_e = hosts[-(dhcp_count + 1)]
        int_s = hosts[-(dhcp_count + int_count)]
        
        pub_e = hosts[-(dhcp_count + int_count + 1)]
        pub_s = hosts[-(dhcp_count + int_count + pub_count)]
        
        print(f'export MAAS_GATEWAY={maas_gw}')
        print(f'export MAAS_RESERVED_IP_START={maas_s}')
        print(f'export MAAS_RESERVED_IP_END={maas_e}')
        print(f'export OS_INTERNAL_API_IP_START={int_s}')
        print(f'export OS_INTERNAL_API_IP_END={int_e}')
        print(f'export OS_PUBLIC_API_IP_START={pub_s}')
        print(f'export OS_PUBLIC_API_IP_END={pub_e}')
        
        if masakari:
            instance_rec_ip = hosts[-(dhcp_count + int_count + pub_count + 1)]
            print(f'export OS_INST_REC_IP={instance_rec_ip}')
        
    except Exception as e:
        sys.stderr.write(f'IP Math Error: {e}\n')
        sys.exit(1)
    " >> /etc/repro-env || exit 1
    
    source /etc/repro-env
    
    echo "MAAS Network CIDR      - {{ maas_cidr }}"
    echo "MAAS Gateway IP        - $MAAS_GATEWAY"
    echo "MAAS Reserved IP Count - {{ maas_ip_count }}"
    echo "MAAS Reserved IP Start - $MAAS_RESERVED_IP_START"
    echo "MAAS Reserved IP End   - $MAAS_RESERVED_IP_END"
    echo ""
    echo "Internal API IP Count  - {{ os_int_api_ip_count }}"
    echo "Internal API IP Start  - $OS_INTERNAL_API_IP_START"
    echo "Internal API IP End    - $OS_INTERNAL_API_IP_END"
    echo ""
    echo "Public API IP Count    - {{ os_pub_api_ip_count }}"
    echo "Public API IP Start    - $OS_PUBLIC_API_IP_START"
    echo "Public API IP End      - $OS_PUBLIC_API_IP_END"
{% if os_add_masakari %}
    echo ""
    echo "Instance Recovery IP   - $OS_INST_REC_IP"
{% endif %}

- path: /usr/local/bin/01-verify-deps
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if not maas_snap %}
    
    # Install MAAS (not using apt module or else bind conflicts with LXD)
    echo -e "\n${BYELLOW}-------- Installing deb MAAS... --------${NC}\n"
    
    apt-get update
    apt-get install -y maas
    
{% endif %}
    
    # Verify critical dependencies
    echo -e "\n${BYELLOW}-------- Verifying dependencies... --------${NC}\n"
    
    for cmd in lxc jq yq maas sunbeam; do
        if ! command -v $cmd >/dev/null 2>&1; then
            echo "CRITICAL ERROR: Required command '$cmd' not found."
            echo "Snap/apt package installation likely failed due to a network error."
            exit 1
        fi
    done
    echo "All dependencies verified successfully!"

- path: /usr/local/bin/02-maas-init
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if maas_snap %}
    
    # Install PostgreSQL
    echo -e "\n${BYELLOW}-------- Install PostgreSQL... --------${NC}\n"
    
    systemctl disable --now systemd-timesyncd
    apt-get update
    apt-get install -y postgresql
    
    # Configure PostgreSQL
    echo -e "\n${BYELLOW}-------- Configure PostgreSQL... --------${NC}\n"
    
    sudo -i -u postgres psql -c "CREATE USER \"{{ maas_user }}\" WITH ENCRYPTED PASSWORD '{{ maas_password }}'"
    sudo -i -u postgres createdb -O "{{ maas_user }}" "{{ maas_db_name }}"
    sed -i "1i host    {{ maas_db_name }}    {{ maas_user }}    0.0.0.0/0     md5" /etc/postgresql/*/main/pg_hba.conf
    sed -i "s/^#listen_addresses.*/listen_addresses = '*'/g" /etc/postgresql/*/main/postgresql.conf
    systemctl restart postgresql
    
    # Initialise snap MAAS
    echo -e "\n${BYELLOW}-------- Initializing snap MAAS... --------${NC}\n"
    
    maas init region+rack --database-uri "postgres://{{ maas_user }}:{{ maas_password }}@$HOSTNAME/{{ maas_db_name }}" --maas-url http://${IP_ADDRESS}:5240/MAAS
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
{% else %}
    
    # Initialise deb MAAS
    echo -e "\n${BYELLOW}-------- Initializing deb MAAS... --------${NC}\n"
    
    maas createadmin --username {{ maas_user }} --password {{ maas_password }} --email {{ maas_email }} {% if ssh_import_id %}--ssh-import {{ ssh_import_id }}{% endif %}
    
{% endif %}
    
    # Wait for MAAS services to be ready
    echo -e "\n${BYELLOW}-------- Waiting for MAAS API to be ready... --------${NC}\n"
    
    sleep 30
    until maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $(maas apikey --username {{ maas_user }}) > /dev/null 2>&1; do
        echo "MAAS is not ready yet (502). Retrying in 30 seconds..."
        sleep 30
    done
    
    # Grab API key and login as admin
    echo -e "\n${BYELLOW}-------- Logging in as '{{ maas_user }}' user... --------${NC}\n"
    
    export APIKEY=$(maas apikey --username {{ maas_user }})
    
    # Export the APIKEY back to the environment state for later scripts
    if ! grep -q "APIKEY" /etc/repro-env; then
        echo "export APIKEY=\"$APIKEY\"" >> /etc/repro-env
    fi
    
    maas login {{ maas_user }} 'http://localhost:5240/MAAS/' $APIKEY
    maas {{ maas_user }} maas set-config name=maas_name value={{ lxd_project }}
    maas {{ maas_user }} maas set-config name=completed_intro value=true
    
    # Apply global kernel boot parameters
    maas {{ maas_user }} maas set-config name=kernel_opts value="console=tty1 console=ttyS0,115200 loglevel=4 fsck.mode=auto fsck.repair=yes systemd.show_status=false mitigations=auto nosplash"
    
    # Automatically create and add ssh keys to MAAS
    echo -e "\n${BYELLOW}-------- Generating SSH keys and adding them to MAAS... --------${NC}\n"
    
    if [ ! -f "/home/{{ sys_user }}/.ssh/id_rsa" ]; then
        ssh-keygen -q -t rsa -N "" -f "/home/{{ sys_user }}/.ssh/id_rsa"
        chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/.ssh/id_rsa /home/{{ sys_user }}/.ssh/id_rsa.pub
        chmod 600 /home/{{ sys_user }}/.ssh/id_rsa
        chmod 644 /home/{{ sys_user }}/.ssh/id_rsa.pub
        maas {{ maas_user }} sshkeys create key="$(cat /home/{{ sys_user }}/.ssh/id_rsa.pub)"
    else
        echo "SSH keys already exist. Skipping generation to prevent lockout..."
    fi
    
{% if ssh_key %}
    maas {{ maas_user }} sshkeys create key="{{ ssh_key }}"
{% endif %}

- path: /usr/local/bin/03-maas-networking
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Wait for MAAS to finish background network discovery
    
    echo -e "\n${BYELLOW}-------- Waiting for MAAS to discover subnet '{{ maas_cidr }}'... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=12 # Timeout - 2 min
    while true; do
        missing_subnet=false
        
        # Check if the subnet exists in the MAAS database
        if maas {{ maas_user }} subnets read | jq -e ".[] | select(.cidr == \"{{ maas_cidr }}\")" > /dev/null 2>&1; then
            echo -e "  [${BGREEN}OK${NC}] Subnet '{{ maas_cidr }}' has been discovered!"
        else
            echo "  [..] Subnet '{{ maas_cidr }}' is currently syncing/discovering..."
            missing_subnet=true
        fi
        
        # Check for missing subnets
        if [ "$missing_subnet" = "false" ]; then
            echo "Target subnet '{{ maas_cidr }}' is fully populated!"
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for MAAS to discover subnet. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Subnet '{{ maas_cidr }}' not yet discovered by rack controller. Retrying in 10 seconds (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 10
    done
    
    # Configure MAAS networking (set gateways, vlans, DHCP on etc)
    echo -e "\n${BYELLOW}-------- Configuring MAAS networking... --------${NC}\n"
    
    export FABRIC_ID=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.fabric_id")
    export VLAN_TAG=$(maas {{ maas_user }} subnet read "{{ maas_cidr }}" | jq -r ".vlan.vid")
    export PRIMARY_RACK=$(maas {{ maas_user }} rack-controllers read | jq -r ".[] | .system_id" | head -n 1)
    
    maast {{ maas_user }} subnet update {{ maas_cidr }} gateway_ip=$MAAS_GATEWAY
    maast {{ maas_user }} ipranges create type=dynamic start_ip=$MAAS_RESERVED_IP_START end_ip=$MAAS_RESERVED_IP_END
    maast {{ maas_user }} ipranges create type=reserved start_ip=$OS_INTERNAL_API_IP_START end_ip=$OS_INTERNAL_API_IP_END comment="{{ os_deployment }}-internal-api"
    maast {{ maas_user }} ipranges create type=reserved start_ip=$OS_PUBLIC_API_IP_START end_ip=$OS_PUBLIC_API_IP_END comment="{{ os_deployment }}-public-api"
{% if os_add_masakari %}
    #maast {{ maas_user }} ipranges create type=reserved start_ip=$OS_INST_REC_IP end_ip=$OS_INST_REC_IP comment="{{ os_deployment }}-storage-ippool"
{% endif %}
    maast {{ maas_user }} vlan update $FABRIC_ID $VLAN_TAG dhcp_on=true primary_rack=$PRIMARY_RACK
    maast {{ maas_user }} maas set-config name=upstream_dns value={{ maas_dns }}
    
    # Map network spaces to cloud networks
    echo -e "\n${BYELLOW}-------- Mapping network spaces to cloud networks... --------${NC}\n"
    
    maast {{ maas_user }} spaces create name={{ maas_space }}
    maast {{ maas_user }} vlan update $FABRIC_ID $VLAN_TAG space={{ maas_space }}
    
    # Set the MAAS domain name
    echo -e "\n${BYELLOW}-------- Configuring MAAS domain '{{ tld if tld else 'maas' }}'... --------${NC}\n"
    
    # Check if MAAS auto-created the domain during initialization
    EXISTING_DOMAIN_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.name=="'{{ tld if tld else 'maas' }}'") | .id')
    
    if [ -n "$EXISTING_DOMAIN_ID" ] && [ "$EXISTING_DOMAIN_ID" != "null" ]; then
        echo "Domain '{{ tld if tld else 'maas' }}' already exists! Setting as default and authoritative..."
        export MAAS_DOMAIN_NAME_ID=$EXISTING_DOMAIN_ID
        maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID authoritative=true
        maast {{ maas_user }} domain set-default $MAAS_DOMAIN_NAME_ID
    else
        echo "Domain not found. Renaming default domain to '{{ tld if tld else 'maas' }}'..."
        export MAAS_DOMAIN_NAME_ID=$(maas {{ maas_user }} domains read | jq -r '.[] | select(.is_default==true) | .id')
        maast {{ maas_user }} domain update $MAAS_DOMAIN_NAME_ID name={{ tld if tld else 'maas' }} authoritative=true
    fi
    
    # Update the rack controller to use the correct domain
    maast {{ maas_user }} rack-controller update $PRIMARY_RACK domain={{ tld if tld else 'maas' }}
    
    # Add MAAS DNS to host
    cat <<EOF > /etc/netplan/99-maas-dns.yaml
    network:
      version: 2
      ethernets:
        $INTERFACE:
          transmit-checksum-offload: false
          nameservers:
            addresses: [$IP_ADDRESS]
            search: [{{ tld if tld else 'maas' }}, maas]
    EOF
    
    chmod 600 /etc/netplan/99-maas-dns.yaml
    netplan apply
    
    # Persist dynamic networking variables
    cat <<EOF >> /etc/repro-env
    export PRIMARY_RACK="$PRIMARY_RACK"
    export MAAS_DOMAIN_NAME_ID="$MAAS_DOMAIN_NAME_ID"
    EOF

- path: /usr/local/bin/04-maas-images
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Configure boot images
    echo -e "\n${BYELLOW}-------- Configuring MAAS boot images... --------${NC}\n"
    
    export BOOT_SOURCE_ID=$(maas {{ maas_user }} boot-sources read | jq -r '.[0].id')
    
    for RELEASE in {{ maas_images }}; do
        maast {{ maas_user }} boot-source-selections create $BOOT_SOURCE_ID os="ubuntu" release="$RELEASE" arches="amd64" labels='*' subarches='*'
    done
    maas {{ maas_user }} boot-resources import
    
    # Wait for MAAS boot images to be ready
    echo -e "\n${BYELLOW}-------- Waiting for all MAAS boot images to sync... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=60 # Timeout - 30 min
    while true; do
        missing_images=false
        
        importing_status=$(maas {{ maas_user }} boot-resources is-importing)
        requested_releases=$(maas {{ maas_user }} boot-source-selections read $BOOT_SOURCE_ID | jq -r '.[].release')
        downloaded_releases=$(maas {{ maas_user }} boot-resources read | jq -r '.[].name' | sort | uniq)
        
        # Check if the image has been downloaded
        for release in $requested_releases; do
            if echo "$downloaded_releases" | grep -q "$release"; then
                # Image exists. Now check if import is finished
                if [ "$importing_status" = "false" ]; then
                    echo -e "  [${BGREEN}OK${NC}] Image '$release' has downloaded!"
                else
                    echo "  [..] Image '$release' is currently syncing..."
                    missing_images=true
                fi
            else
                echo "  [??] Image '$release' was not found in boot resources..."
                missing_images=true
            fi
        done
        
        # Check for missing images
        if [ "$missing_images" = "false" ]; then
            clean_list=$(echo "$requested_releases" | tr '\n' ' ')
            echo "All selected boot images ( $clean_list) are fully synced!"
            maast {{ maas_user }} boot-resources read
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for MAAS boot images to sync. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Some images are missing. Waiting 30s (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 30
    done

- path: /usr/local/bin/05-lxd-setup
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
{% if nested_lxd %}
    
    # Generate local LXD trust certificate
    echo -e "\n${BYELLOW}-------- Generating trust certificate for local LXD... --------${NC}\n"
    
    if [ ! -f "$LXD_CERT" ]; then
        openssl req -x509 -newkey rsa:2048 -keyout $LXD_KEY -out $LXD_CERT -nodes -days 3650 -subj "/CN=lxd-local"
        lxc config trust add $LXD_CERT --name lxd-local
        
        # Provide certs to user context
        $RUN_AS_LOGIN mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
        cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
        cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
        chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    else
        echo "LXD trust certificate already exists. Skipping generation to preserve MAAS power controls..."
    fi
    
{% else %}
    
    # Setup external LXD client certificates and remote connection
    echo -e "\n${BYELLOW}-------- Configuring remote LXD connection... --------${NC}\n"
    
    lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    lxc remote switch host-lxd
    
    # Provide certs to user context
    $RUN_AS_LOGIN mkdir -p /home/{{ sys_user }}/snap/lxd/common/config
    cp $LXD_CERT /home/{{ sys_user }}/snap/lxd/common/config/client.crt
    cp $LXD_KEY /home/{{ sys_user }}/snap/lxd/common/config/client.key
    chown -R {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/snap/lxd/common/config
    
    $RUN_AS_LOGIN lxc remote add host-lxd https://$LXD_ADDR --accept-certificate
    
{% endif %}
    
{% if lxd_project != "default" %}
    
    # Switch to LXD MAAS project
    echo -e "\n${BYELLOW}-------- Switching to LXD '{{ lxd_project }}' project... --------${NC}\n"
    
    lxc project switch {{ lxd_project }}
    
{% endif %}

- path: /usr/local/bin/06-vm-creation
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create VMs directly via LXD
    echo -e "\n${BYELLOW}-------- Creating empty VMs in LXD... --------${NC}\n"
    
    i=1
    for HOST in {{ nodes_hostnames }}; do
        CPU=$(echo "{{ nodes_cpus }}" | cut -d' ' -f$i)
        RAM=$(echo "{{ nodes_rams }}" | cut -d' ' -f$i)
        DISK=$(echo "{{ nodes_disks }}" | cut -d' ' -f$i)
        
        lxc init "$HOST" --vm --empty -c limits.cpu="$CPU" -c limits.memory="$RAM" -d root,size="$DISK"
        
        i=$((i + 1))
    done
    
    # Attach specific extra devices to the cloud nodes
    for HOST in {{ nodes_hostnames }}; do
        case "$HOST" in
            cloud-*)
                # Loop to create and attach multiple OSD disks
                for i in $(seq 1 {{ cloud_osd_count }}); do
                    lxc storage volume create {{ lxd_pool }} ${HOST}-osd${i}-disk size={{ cloud_osd_disk }} --type=block
                    lxc config device add $HOST osd${i} disk pool={{ lxd_pool }} source=${HOST}-osd${i}-disk
                done
                
                # Attach Neutron networking
                lxc config device add $HOST eth1 nic nictype=bridged parent="{{ os_neutron_bridge }}"
                ;;
        esac
    done

- path: /usr/local/bin/07-maas-enlist
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Start VMs to trigger PXE Boot & Enlistment
    echo -e "\n${BYELLOW}-------- Starting VMs for MAAS enlistment... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
        lxc start $HOST
    done
    
    # Wait for VMs to enlist in MAAS via MAC
    echo -e "\n${BYELLOW}-------- Waiting for all VMs to enlist in MAAS... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=40 # Timeout - 20 min
    while true; do
        all_enlisted=true
        
        for HOST in {{ nodes_hostnames }}; do
            # Fetch the dynamic MAC to identify the machine in MAAS
            MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
            SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
            status=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].status_name')
            
            if [ "$SYSTEM_ID" != "null" ] && [ "$status" = "New" ]; then
                echo -e "  [${BGREEN}OK${NC}] '$HOST' was enlisted with ID '$SYSTEM_ID'!"
           elif [[ "$status" == *"Failed"* ]]; then
                # Automatically retry testing on failure
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' is currently '$status'... Retrying!"
                maast {{ maas_user }} machine test $SYSTEM_ID
                all_ready=false
            else
                if [ "$status" = "null" ]; then
                    status="Waiting for PXE"
                fi
                echo "  [..] '$HOST' ($MAC) is currently '$status'..."
                all_enlisted=false
            fi
        done
        
        # If the flag is still true, everyone is enlisted -> break the loop
        if [ "$all_enlisted" = true ]; then
            echo -e "All VMs have successfully enlisted!\n"
            lxc list
            sleep 10
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for VMs to enlist. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Waiting 30s before next check (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 30
    done

- path: /usr/local/bin/08-maas-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create Availability Zones in MAAS
    echo -e "\n${BYELLOW}-------- Creating Availability Zones... --------${NC}\n"
    for i in $(seq 1 {{ max_ha }}); do
        ZONE="AZ$i"
        if ! maas {{ maas_user }} zones read | jq -e ".[] | select(.name==\"$ZONE\")" > /dev/null; then
            echo "Creating zone: $ZONE"
            maast {{ maas_user }} zones create name="$ZONE" description="Auto-generated AZ for HA Node $i"
        else
            echo "Zone $ZONE already exists."
        fi
    done
    
    echo "Assigning Primary MAAS Controller to AZ1..."
    maast {{ maas_user }} rack-controller update "$PRIMARY_RACK" zone="AZ1"
    
    # Find machines by MAC and set hostnames, domain, and explicit LXD power controls
    echo -e "\n${BYELLOW}-------- Configuring hostnames and power controls... --------${NC}\n"
    
    LXD_CERT_CONTENT=$(cat $LXD_CERT)
    LXD_KEY_CONTENT=$(cat $LXD_KEY)
    
    for HOST in {{ nodes_hostnames }}; do
        MAC=$(lxc config get $HOST volatile.eth0.hwaddr)
        SYSTEM_ID=$(maas {{ maas_user }} machines read mac_address=$MAC | jq -r '.[0].system_id')
        
        NODE_NUM=$(echo "$HOST" | awk -F'-' '{print $NF}')
        TARGET_ZONE="AZ${NODE_NUM}"
        
        # Force the MAAS hostname, domain, and explicit LXD power controls
        maast {{ maas_user }} machine update $SYSTEM_ID \
          hostname=$HOST \
          domain=$MAAS_DOMAIN_NAME_ID \
          zone=$TARGET_ZONE \
          power_type="lxd" \
          power_parameters_power_address="https://$LXD_ADDR" \
          power_parameters_certificate="$LXD_CERT_CONTENT" \
          power_parameters_key="$LXD_KEY_CONTENT" \
          power_parameters_instance_name="$HOST" \
          power_parameters_project="{{ lxd_project }}"
    done

- path: /usr/local/bin/09-maas-commission
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Commission machines
    echo -e "\n${BYELLOW}-------- Commissioning machines... --------${NC}\n"
    
    for HOST in {{ nodes_hostnames }}; do
        SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
        maast {{ maas_user }} machine commission $SYSTEM_ID
    done
    
    # Wait for VMs to be ready
    echo -e "\n${BYELLOW}-------- Waiting for VMs to enter 'Ready' state... --------${NC}\n"
    
    ATTEMPTS=0
    MAX_ATTEMPTS=30 # Timeout - 30 min
    HALF_ATTEMPTS=$((MAX_ATTEMPTS / 2))
    while true; do
        all_ready=true
        
        for HOST in {{ nodes_hostnames }}; do
            # Query MAAS for the status
            status=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].status_name')
            
            if [ "$status" = "Ready" ]; then
                echo -e "  [${BGREEN}OK${NC}] '$HOST' is '$status'!"
            elif [[ "$status" == *"Failed"* ]]; then
                # Automatically retry commissioning on failure
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' is currently '$status'... Retrying!"
                SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
                maast {{ maas_user }} machine commission $SYSTEM_ID
                all_ready=false
            elif [[ "$status" == *"Commissioning"* ]] && [ $ATTEMPTS -eq $HALF_ATTEMPTS ]; then
                # If stuck for 15 minutes, abort the current operation and try again
                echo -e "  [${BYELLOW}!!${NC}] '$HOST' has been '$status' for too long. Aborting and retrying!"
                SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
                maast {{ maas_user }} machine abort $SYSTEM_ID
                sleep 5
                maast {{ maas_user }} machine commission $SYSTEM_ID
                all_ready=false
            else
                echo "  [..] '$HOST' is currently '$status'..."
                all_ready=false
            fi
        done
        
        # If the flag is still true, everyone is ready -> break the loop
        if [ "$all_ready" = true ]; then
            echo "All VMs are Ready!"
            maast {{ maas_user }} machines read
            netplan apply # Update MAAS DNS record
            sleep 10
            break
        fi
        
        ATTEMPTS=$((ATTEMPTS+1))
        if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo -e "${BRED}[FATAL] Timeout waiting for VMs to reach 'Ready' state. Aborting.${NC}\n"
            exit 1
        fi
        
        echo "Waiting 60s before checking again (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
        sleep 60
    done

- path: /usr/local/bin/10-maas-tagging
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Create tags and add them to commissioned machines
    echo -e "\n${BYELLOW}-------- Creating and adding tags... --------${NC}\n"
    
    maast {{ maas_user }} tags create name=openstack-{{ os_deployment }}
    maast {{ maas_user }} tags create name=control
    maast {{ maas_user }} tags create name=compute
    maast {{ maas_user }} tags create name=storage
    maast {{ maas_user }} tags create name=network
    maast {{ maas_user }} tags create name=sunbeam
    maast {{ maas_user }} tags create name=juju-controller
    
    for HOST in {{ nodes_hostnames }}; do
        SYSTEM_ID=$(maas {{ maas_user }} machines read hostname=$HOST | jq -r '.[0].system_id')
        
        # Tag main disks as SSDs
        echo -e "\n${BYELLOW}-------- Tagging main disks as SSDs for '$HOST'... --------${NC}\n"
        
        MAIN_BLOCK_ID=$(maas {{ maas_user }} block-devices read $SYSTEM_ID | jq -r '.[] | select(.serial | tostring | contains("lxd_osd") | not) | .id' | head -n 1)
        if [ -n "$MAIN_BLOCK_ID" ] && [ "$MAIN_BLOCK_ID" != "null" ]; then
            maast {{ maas_user }} block-device add-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=ssd
            maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=rotary
            maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $MAIN_BLOCK_ID tag=1rpm
            maast {{ maas_user }} block-device set-boot-disk $SYSTEM_ID $MAIN_BLOCK_ID
            maast {{ maas_user }} machine set-storage-layout $SYSTEM_ID storage_layout=flat
        fi
        
        echo -e "\n${BYELLOW}-------- Tagging '$HOST'... --------${NC}\n"
        
        # Base tag for all nodes
        maast {{ maas_user }} tag update-nodes openstack-{{ os_deployment }} add=$SYSTEM_ID
        
        case "$HOST" in
            juju-controller-*)
                maast {{ maas_user }} tag update-nodes juju-controller add=$SYSTEM_ID
                ;;
            
            sunbeam-controller-*)
                maast {{ maas_user }} tag update-nodes sunbeam add=$SYSTEM_ID
                ;;
            
            cloud-*)
                maast {{ maas_user }} tag update-nodes control add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes compute add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes storage add=$SYSTEM_ID
                maast {{ maas_user }} tag update-nodes network add=$SYSTEM_ID
                
                # Tag the ceph osd devices
                echo -e "\n${BYELLOW}-------- Tagging ceph storage for '$HOST'... --------${NC}\n"
                
                for i in $(seq 1 {{ cloud_osd_count }}); do
                    OSD_BLOCK_ID=$(maas {{ maas_user }} block-devices read $SYSTEM_ID | jq -r '.[] | select(.serial == "lxd_osd'${i}'") | .id')
                    
                    if [ -n "$OSD_BLOCK_ID" ] && [ "$OSD_BLOCK_ID" != "null" ]; then
                        maast {{ maas_user }} block-device add-tag $SYSTEM_ID $OSD_BLOCK_ID tag=ceph
                        maast {{ maas_user }} block-device add-tag $SYSTEM_ID $OSD_BLOCK_ID tag=ssd
                        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $OSD_BLOCK_ID tag=rotary
                        maast {{ maas_user }} block-device remove-tag $SYSTEM_ID $OSD_BLOCK_ID tag=1rpm
                    fi
                done
                
                # Tag the additional neutron interface
                echo -e "\n${BYELLOW}-------- Tagging neutron interface for '$HOST'... --------${NC}\n"
                
                CLOUD_NEUTRON_MAC=$(lxc config get $HOST volatile.eth1.hwaddr)
                CLOUD_NEUTRON_INTERFACE_ID=$(maas {{ maas_user }} interfaces read $SYSTEM_ID | jq -r '.[] | select(.mac_address=="'$CLOUD_NEUTRON_MAC'") | .id')
                
                if [ -n "$CLOUD_NEUTRON_INTERFACE_ID" ] && [ "$CLOUD_NEUTRON_INTERFACE_ID" != "null" ]; then
                    maast {{ maas_user }} interface update $SYSTEM_ID $CLOUD_NEUTRON_INTERFACE_ID tags=neutron:physnet1
                fi
                ;;
        esac
    done

- path: /usr/local/bin/11-sunbeam-prep
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    # Prepare machine for Sunbeam usage
    echo -e "\n${BYELLOW}-------- Preparing machine for Sunbeam usage... --------${NC}\n"
    
    $RUN_AS_LOGIN sunbeam prepare-node-script --client | $RUN_AS_LOGIN bash -x
    
    # Add the Canonical MAAS provider
    echo -e "\n${BYELLOW}-------- Adding the Canonical MAAS provider... --------${NC}\n"
    
    $RUN_AS_LOGIN sunbeam deployment add maas {{ os_deployment }} $APIKEY http://${IP_ADDRESS}:5240/MAAS
    $RUN_AS_LOGIN sunbeam deployment space map {{ maas_space }}
    
    # Validate MAAS provider
    echo -e "\n${BYELLOW}-------- Validating MAAS provider... --------${NC}\n"
    
    $RUN_AS_LOGIN sunbeam deployment validate
    
    # Grab the single newest report file
    LATEST_REPORT=$(ls -t /home/{{ sys_user }}/snap/openstack/common/reports/ | head -n 1)
    
    cat "/home/{{ sys_user }}/snap/openstack/common/reports/$LATEST_REPORT"
    echo ""
    echo -e "Number of fails      - ${BRED}$(grep -c failed /home/{{ sys_user }}/snap/openstack/common/reports/$LATEST_REPORT)${NC}"
    echo -e "Number of warnings   - ${BYELLOW}$(grep -c warning /home/{{ sys_user }}/snap/openstack/common/reports/$LATEST_REPORT)${NC}"
    echo -e "Number of successes  - ${BGREEN}$(grep -c success /home/{{ sys_user }}/snap/openstack/common/reports/$LATEST_REPORT)${NC}"
    echo ""
    
    $RUN_AS_LOGIN sunbeam deployment show {{ os_deployment }}
    sleep 10

{% if os_manifest_b64 %}
- path: /etc/manifest.yaml
  owner: root:root
  permissions: '0644'
  encoding: b64
  content: {{ os_manifest_b64 }}
{% endif %}

- path: /usr/local/bin/12-sunbeam-bootstrap
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    if [ -f "/etc/manifest.yaml" ]; then
        # Use custom Sunbeam deployment manifest
        echo -e "\n${BYELLOW}-------- Using custom Sunbeam manifest... --------${NC}\n"
        # Move it to the user's home directory so Sunbeam can read it
        mv /etc/manifest.yaml "$MANIFEST_FILE"
    elif [ -f "$MANIFEST_FILE" ]; then
        echo -e "\n${BYELLOW}-------- Using existing Sunbeam manifest... --------${NC}\n"
    else
        # Generate Sunbeam deployment manifest
        echo -e "\n${BYELLOW}-------- Generating Sunbeam manifest... --------${NC}\n"
        
        cat <<EOF > "$MANIFEST_FILE"
{% if os_add_octavia %}
    features:
      loadbalancer:
        config:
          amphora_enabled: {{ 'true' if os_add_amphora else 'false' }}
{% if os_add_amphora %}
          amp_image_tag: octavia-amphora
          autocreate_image: true
          autocreate_flavor: true
          autocreate_network: true
          autocreate_securitygroups: true
{% endif %}
{% endif %}
    core:
      config:
        proxy:
          proxy_required: false
        database: single
        region: RegionOne
        bootstrap:
          management_cidr: {{ maas_cidr }}
        k8s-addons:
          loadbalancer: $OS_INTERNAL_API_IP_START-$OS_INTERNAL_API_IP_END
{% if pub_fqdn or int_fqdn or rgw_fqdn %}
        endpoints:
{% if pub_fqdn %}
          ingress-public:
            hostname: {{ pub_fqdn }}
{% endif %}
{% if int_fqdn %}
          ingress-internal:
            hostname: {{ int_fqdn }}
{% endif %}
{% if rgw_fqdn %}
          ingress-rgw:
            hostname: {{ rgw_fqdn }}
{% endif %}
{% endif %}
        user:
          run_demo_setup: {{ 'true' if os_run_demo else 'false' }}
          username: demo
          password: password
          cidr: 192.168.0.0/24
          nameservers: {{ maas_dns }}
          security_group_rules: true
          remote_access_location: local
          physnet: physnet1
        external-networks:
          physnet1:
            cidr: {{ os_neutron_cidr }}
            network_type: flat
            nics:
    EOF
        
        # Dynamically append all cloud nodes and their neutron interfaces
        for HOST in {{ nodes_hostnames }}; do
            case "$HOST" in
                cloud-*)
                    echo "          $HOST: eth1" >> "$MANIFEST_FILE"
                    ;;
            esac
        done
    fi
    
    chown {{ sys_user }}:{{ sys_user }} "$MANIFEST_FILE"
    chmod 644 "$MANIFEST_FILE"
    cat "$MANIFEST_FILE"
    
{% if os_add_amphora %}
    echo -e "\n${BYELLOW}-------- Enabling snap feature gates for Octavia Amphora... --------${NC}\n"
    
    snap set openstack feature.microovn-sdn=true
    snap set openstack ovn.provider=microovn
{% endif %}
    
    # Bootstrap the orchestration layer
    echo -e "\n${BYELLOW}-------- Bootstrapping the orchestration layer... --------${NC}\n"
    
    LOGFILE="/tmp/sunbeam-bootstrap.log"
    
    if run_sunbeam "sunbeam cluster bootstrap --accept-defaults --manifest $MANIFEST_FILE" "$LOGFILE"; then
        echo "export BOOTSTRAP_SUCCESS=true" >> /etc/repro-env
        
        echo -e "\n${BYELLOW}-------- Controller Model Status... --------${NC}\n"
        $RUN_AS_LOGIN juju status -m controller
        
        echo -e "\n${BYELLOW}-------- OpenStack-Infra Model Status... --------${NC}\n"
        $RUN_AS_LOGIN juju status -m openstack-infra
    else
        echo "export BOOTSTRAP_SUCCESS=false" >> /etc/repro-env
        
        echo -e "\n${BRED}======================================================================${NC}"
        echo -e "${BRED}[FAILURE] Sunbeam Cluster Bootstrap failed!${NC}"
        echo -e "${BRED}To inspect logs:${NC} less /tmp/sunbeam-bootstrap.log"
        echo -e "${BRED}To rerun this step manually:${NC} 12-sunbeam-bootstrap"
        echo -e "${BRED}======================================================================${NC}\n"
        exit 1
    fi

- path: /usr/local/bin/13-sunbeam-deploy
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    if [ "$BOOTSTRAP_SUCCESS" != "true" ]; then
        echo -e "\n${BYELLOW}======================================================================${NC}"
        echo -e "${BYELLOW}[SKIPPED] Deploy script skipped because step '${NC}12-sunbeam-bootstrap${BYELLOW}' failed.${NC}"
        echo -e "${BYELLOW}Once step 12 passes, run deploy manually with:${NC} 13-sunbeam-deploy"
        echo -e "${BYELLOW}======================================================================${NC}\n"
        exit 1
    fi
    
    # Deploy the cloud
    echo -e "\n${BYELLOW}-------- Deploying the cloud... --------${NC}\n"
    
    LOGFILE="/tmp/sunbeam-deploy.log"
    
    if run_sunbeam "sunbeam cluster deploy --accept-defaults --manifest $MANIFEST_FILE" "$LOGFILE"; then
        echo "export DEPLOY_SUCCESS=true" >> /etc/repro-env
        
        echo -e "\n${BYELLOW}-------- OpenStack-Machines Model Status... --------${NC}\n"
        $RUN_AS_LOGIN juju status -m openstack-machines
        
        echo -e "\n${BYELLOW}-------- OpenStack Model Status... --------${NC}\n"
        $RUN_AS_LOGIN juju status -m openstack
        
{% if ssh_key %}
        # Auto-inject custom SSH keys into all currently bootstrapped Juju models if a custom manifest was provided
        echo -e "\n${BYELLOW}-------- Injecting external SSH keys into Juju models... --------${NC}\n"
        
        for model in $($RUN_AS_LOGIN juju models --format json | jq -r '.models[] | select(."model-type" == "iaas") | .name'); do
            echo "Injecting key into machine model '$model'..."
            $RUN_AS_LOGIN juju add-ssh-key -m "$model" "{{ ssh_key }}"
        done
{% endif %}
    else
        echo "export DEPLOY_SUCCESS=false" >> /etc/repro-env
        
        echo -e "\n${BRED}======================================================================${NC}"
        echo -e "${BRED}[FAILURE] Sunbeam Cluster Deploy failed!${NC}"
        echo -e "${BRED}To inspect logs:${NC} less /tmp/sunbeam-deploy.log"
        echo -e "${BRED}To inspect model status:${NC} juju status -m openstack"
        echo -e "${BRED}To rerun this step manually:${NC} 13-sunbeam-deploy"
        echo -e "${BRED}======================================================================${NC}\n"
        exit 1
    fi

- path: /usr/local/bin/14-sunbeam-configure
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    if [ "$DEPLOY_SUCCESS" != "true" ]; then
        echo -e "\n${BYELLOW}======================================================================${NC}"
        echo -e "${BYELLOW}[SKIPPED] Configure script skipped because step '${NC}13-sunbeam-deploy${BYELLOW}' failed.${NC}"
        echo -e "${BYELLOW}Once step 13 passes, run configure manually with:${NC} 14-sunbeam-configure"
        echo -e "${BYELLOW}======================================================================${NC}\n"
        exit 1
    fi
    
    wait_for_model "openstack-machines" || exit 1
    wait_for_model "openstack" || exit 1
    
    echo -e "\n${BYELLOW}-------- Syncing MetalLB VIPs to MAAS DNS... --------${NC}\n"
    
    CLOUD_IP=$(maas {{ maas_user }} machines read hostname=cloud-1 | jq -r '.[0].ip_addresses[0]')
    SSH_CMD="ssh -i /home/{{ sys_user }}/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -q ubuntu@$CLOUD_IP"
    
    # Fetch all LoadBalancer services and their IPs dynamically
    SVC_LIST=$($SSH_CMD "sudo k8s kubectl get svc -n openstack --field-selector spec.type=LoadBalancer --no-headers -o custom-columns=NAME:.metadata.name,IP:.status.loadBalancer.ingress[0].ip")
    
    PUBLIC_VIP=$(echo "$SVC_LIST" | grep "traefik" | grep "public" | awk '{print $2}')
    RGW_VIP=$(echo "$SVC_LIST" | grep "traefik" | grep "rgw" | awk '{print $2}')
    INTERNAL_VIP=$(echo "$SVC_LIST" | grep "traefik" | grep -v "public" | grep -v "rgw" | awk '{print $2}')
    
    echo ""
    echo "Assigned Public VIP:   $PUBLIC_VIP"
    echo "Assigned Internal VIP: $INTERNAL_VIP"
    echo "Assigned RGW VIP:      $RGW_VIP"
    echo ""
    
    # Smart MAAS DNS Registration Function
    register_maas_dns() {
        local fqdn="$1"
        local ip="$2"
        
        # Skip if missing FQDN or IP
        if [ -z "$fqdn" ] || [ -z "$ip" ] || [ "$fqdn" = "none" ]; then return; fi
        
        local host="${fqdn%%.*}"
        local domain="${fqdn#*.}"
        
        # If no dot was provided in the hostname, fallback to the default TLD
        if [ "$host" = "$domain" ]; then
            domain="{{ tld if tld else 'maas' }}"
        fi
        
        # Look up the domain ID in MAAS
        local domain_id=$(maas {{ maas_user }} domains read | jq -r ".[] | select(.name==\"$domain\") | .id")
        
        # If the custom domain doesn't exist yet, create it and make MAAS authoritative
        if [ -z "$domain_id" ] || [ "$domain_id" = "null" ]; then
            echo "Domain '$domain' not found in MAAS. Creating it..."
            domain_id=$(maas {{ maas_user }} domains create name="$domain" authoritative=true | jq -r '.id')
        fi
        
        # Register the record under the resolved domain ID
        echo "Registering $host.$domain ($ip) in MAAS DNS..."
        maast {{ maas_user }} dnsresources create domain=$domain_id name="$host" ip_addresses=$ip
    }
    
{% if pub_fqdn or int_fqdn or rgw_fqdn %}
    register_maas_dns "{{ pub_fqdn }}" "$PUBLIC_VIP"
    register_maas_dns "{{ int_fqdn }}" "$INTERNAL_VIP"
    register_maas_dns "{{ rgw_fqdn }}" "$RGW_VIP"
    
    resolvectl flush-caches
    
    echo -e "\n${BYELLOW}-------- Waiting for MAAS DNS records to propagate locally... --------${NC}\n"
    
    # Compile the list of active hostnames to check
    VALID_HOSTS=""
    for host in "{{ pub_fqdn }}" "{{ int_fqdn }}" "{{ rgw_fqdn }}"; do
        if [ -n "$host" ] && [ "$host" != "none" ]; then
            VALID_HOSTS="$VALID_HOSTS $host"
        fi
    done
    
    if [ -n "$VALID_HOSTS" ]; then
        ATTEMPTS=0
        MAX_ATTEMPTS=12 # Timeout - 1 min
        while true; do
            all_resolved=true
            
            for host in $VALID_HOSTS; do
                if getent hosts "$host" > /dev/null 2>&1; then
                    echo -e "  [${BGREEN}OK${NC}] '$host' is resolved!"
                else
                    echo "  [..] '$host' is currently propagating..."
                    all_resolved=false
                fi
            done
            
            # If the flag is still true, all hostnames resolved successfully -> break loop
            if [ "$all_resolved" = true ]; then
                echo "All DNS records are ready and resolving!"
                break
            fi
            
            ATTEMPTS=$((ATTEMPTS+1))
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                echo "Proceeding anyway, but DNS might be lagging..."
                break
            fi
            
            echo "Waiting 5s before checking again (Attempt $ATTEMPTS/$MAX_ATTEMPTS)..."
            sleep 5
        done
    fi
{% else %}
    echo "Endpoint hostnames are empty; skipping MAAS DNS registration and utilizing direct API IPs..."
{% endif %}
    
    # Configure the cloud
    echo -e "\n${BYELLOW}-------- Configuring the cloud... --------${NC}\n"
    
    LOGFILE="/tmp/sunbeam-configure.log"
    
    if run_sunbeam "sunbeam configure --accept-defaults --openrc /home/{{ sys_user }}/demo-openrc --manifest $MANIFEST_FILE" "$LOGFILE"; then
        echo "export CONFIGURE_SUCCESS=true" >> /etc/repro-env
        
        echo -e "\n${BYELLOW}-------- Generating Admin Credentials... --------${NC}\n"
        
        $RUN_AS_LOGIN sunbeam openrc > /home/{{ sys_user }}/admin-openrc
        chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/admin-openrc
        
        echo -e "\n${BYELLOW}-------- Sunbeam Cluster List... --------${NC}\n"
        
        $RUN_AS_LOGIN sunbeam cluster list
    else
        echo "export CONFIGURE_SUCCESS=false" >> /etc/repro-env
        
        echo -e "\n${BRED}======================================================================${NC}"
        echo -e "${BRED}[FAILURE] Sunbeam Configure failed!${NC}"
        echo -e "${BRED}To inspect logs:${NC} less /tmp/sunbeam-configure.log"
        echo -e "${BRED}To rerun this step manually:${NC} 14-sunbeam-configure"
        echo -e "${BRED}======================================================================${NC}\n"
        exit 1
    fi

- path: /usr/local/bin/15-sunbeam-addons
  permissions: '0755'
  content: |
    #!/bin/bash
    
    # Auto-escalate to root if run as a normal user
    if [ "$EUID" -ne 0 ]; then
        exec sudo "$0" "$@"
    fi
    
    source /etc/repro-env
    
    if [ "$CONFIGURE_SUCCESS" != "true" ]; then
        echo -e "\n${BYELLOW}======================================================================${NC}"
        echo -e "${BYELLOW}[SKIPPED] Addons script skipped because step '${NC}14-sunbeam-configure${BYELLOW}' failed.${NC}"
        echo -e "${BYELLOW}Once step 14 passes, run addons manually with:${NC} 15-sunbeam-addons"
        echo -e "${BYELLOW}======================================================================${NC}\n"
        exit 1
    fi
    
    wait_for_model "openstack-machines" || exit 1
    wait_for_model "openstack" || exit 1
    
    echo -e "\n${BYELLOW}-------- Activating Optional Features... --------${NC}\n"
    
{% if pro_token %}
    echo -e "\n${BYELLOW}-------- Enabling Ubuntu Pro... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE pro {{ pro_token }}" "/tmp/sunbeam-pro.log"
{% endif %}
    
{% if os_add_vault %}
    echo -e "\n${BYELLOW}-------- Enabling Vault... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE vault" "/tmp/sunbeam-vault.log"; then
        # Init and unseal cleanly using the helper
        unseal_vault
        
        echo "Authorizing Vault..."
        VAULT_TOKEN=$(awk '/Root token:/{print $3}' "$VAULT_INIT" | tr -d ' ')
        run_sunbeam "sunbeam vault authorize-charm '$VAULT_TOKEN'"
        
        echo "Vault unseal key saved to /home/{{ sys_user }}/vault-keys.txt (KEEP THIS SAFE!)"
        $RUN_AS_LOGIN sunbeam vault status
        
        wait_for_app "vault" "openstack" "$VAULT_UNIT_COUNT"
    fi
{% endif %}
    
{% if os_add_tls and os_add_vault %}
    echo -e "\n${BYELLOW}-------- Enabling TLS via Vault for API Endpoints... --------${NC}\n"
    
    mkdir -p "$CERTS_FOLDER"
    if [ ! -f "$CERTS_FOLDER/sunbeam-ca.crt" ]; then
        echo "Creating OpenSSL CA configuration..."
        cat <<EOF > $CERTS_FOLDER/ca.conf
    [v3_ca]
    subjectKeyIdentifier = hash
    authorityKeyIdentifier = keyid:always,issuer
    basicConstraints = critical, CA:TRUE
    keyUsage = critical, digitalSignature, cRLSign, keyCertSign
    EOF
        
        echo "Generating Self-Signed Root CA for Vault..."
        openssl req -x509 -newkey rsa:4096 -keyout $CERTS_FOLDER/sunbeam-ca.key -out $CERTS_FOLDER/sunbeam-ca.crt -sha256 -days 3650 -nodes -config $CERTS_FOLDER/ca.conf -extensions v3_ca -subj "/CN=Sunbeam Local Root CA"
        chown {{ sys_user }}:{{ sys_user }} $CERTS_FOLDER/sunbeam-ca.* $CERTS_FOLDER/ca.conf
    else
        echo "Root CA already exists. Skipping generation to preserve Vault trust chain..."
    fi
    
    CA_B64=$(base64 -w0 $CERTS_FOLDER/sunbeam-ca.crt)
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE tls vault --ca \"$CA_B64\" --ca-chain \"$CA_B64\" --endpoint public --endpoint internal --endpoint rgw" "/tmp/sunbeam-tls.log"; then
        # Extract CSR from vault
        echo "Obtaining the CSRs from Vault..."
        $RUN_AS_LOGIN sunbeam tls vault list_outstanding_csrs --format yaml > $CERTS_FOLDER/vault_csrs.yaml
        sed -n '/-----BEGIN CERTIFICATE REQUEST-----/,/-----END CERTIFICATE REQUEST-----/p' $CERTS_FOLDER/vault_csrs.yaml | sed 's/^[ \t]*//' | tr -d '\r' > $CERTS_FOLDER/vault.csr
        rm -f $CERTS_FOLDER/vault_csrs.yaml
        
        # Input TLS certificates
        if grep -q "BEGIN CERTIFICATE REQUEST" $CERTS_FOLDER/vault.csr; then
            echo "Signing CSR for Vault as an Intermediate CA..."
            
            openssl x509 -req -sha256 -days 3650 -CA $CERTS_FOLDER/sunbeam-ca.crt -CAkey $CERTS_FOLDER/sunbeam-ca.key -CAcreateserial -extfile $CERTS_FOLDER/ca.conf -extensions v3_ca -in $CERTS_FOLDER/vault.csr -out $CERTS_FOLDER/vault.crt
            CERT_B64=$(base64 -w0 $CERTS_FOLDER/vault.crt)
            
            echo "Applying signed Intermediate CA certificates via Sunbeam..."
            run_sunbeam "echo \"$CERT_B64\" | sunbeam tls vault unit_certs" "/tmp/sunbeam-tls-certs.log"
            
            echo "Updating system CA trust store..."
            cp $CERTS_FOLDER/sunbeam-ca.crt /usr/local/share/ca-certificates/sunbeam-ca.crt
            update-ca-certificates
            
            wait_for_model "openstack"
            
            echo "Updating admin-openrc and injecting CA bundle..."
            $RUN_AS_LOGIN sunbeam openrc > /home/{{ sys_user }}/admin-openrc
            chown {{ sys_user }}:{{ sys_user }} /home/{{ sys_user }}/admin-openrc
        else
            echo "No CSR found. Vault TLS may not be fully initialized."
        fi
    fi
{% elif os_add_tls %}
    echo -e "\n${BYELLOW}-------- Enabling TLS self-signed for API Endpoints... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE tls self-signed" "/tmp/sunbeam-tls.log"; then
        wait_for_model "openstack"
    fi
{% endif %}
    
{% if os_add_barbican %}
    echo -e "\n${BYELLOW}-------- Enabling Barbican (Secrets)... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE secrets" "/tmp/sunbeam-barbican.log"; then
        wait_for_app "barbican"
    fi
{% endif %}
    
{% if os_add_octavia %}
    echo -e "\n${BYELLOW}-------- Enabling Octavia (Load Balancer)... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE loadbalancer" "/tmp/sunbeam-octavia.log"; then
        wait_for_app "octavia"
        
{% if os_add_amphora %}
        echo -e "\n${BYELLOW}-------- Enabling Octavia Amphora... --------${NC}\n"
        snap set openstack feature.loadbalancer-amphora=true # Maybe not needed (?)
        run_sunbeam "sunbeam loadbalancer configure" "/tmp/sunbeam-octavia-amphora.log"
        
        echo -e "\n${BYELLOW}-------- Configuring Octavia Amphora TLS... --------${NC}\n"
        
        # 2. Wait for Vault to generate BOTH Amphora CSRs
        for i in {1..12}; do
            $RUN_AS_LOGIN sunbeam loadbalancer list_outstanding_csrs --format yaml > $CERTS_FOLDER/amphora_csrs.yaml
            if [ "$($RUN_AS_LOGIN yq 'length' $CERTS_FOLDER/amphora_csrs.yaml 2>/dev/null)" -eq 2 ]; then
                break
            fi
            echo "Amphora CSRs not ready yet, waiting 5s..."
            sleep 5
        done
        
        # 3. Extract the CSRs cleanly using yq
        $RUN_AS_LOGIN yq -r '.[] | select(.endpoint == "amphora-controller-cert") | .csr' $CERTS_FOLDER/amphora_csrs.yaml > $CERTS_FOLDER/amphora-controller.csr
        $RUN_AS_LOGIN yq -r '.[] | select(.endpoint == "amphora-issuing-ca") | .csr' $CERTS_FOLDER/amphora_csrs.yaml > $CERTS_FOLDER/amphora-issuing-ca.csr
        
        # 4. Sign the Controller Leaf Certificate
        openssl x509 -req -sha256 -days 3650 -CA $CERTS_FOLDER/sunbeam-ca.crt -CAkey $CERTS_FOLDER/sunbeam-ca.key -CAcreateserial -in $CERTS_FOLDER/amphora-controller.csr -out $CERTS_FOLDER/amphora-controller.crt
        
        # 5. Sign the Issuing CA Certificate
        openssl x509 -req -sha256 -days 3650 -CA $CERTS_FOLDER/sunbeam-ca.crt -CAkey $CERTS_FOLDER/sunbeam-ca.key -CAcreateserial -extfile $CERTS_FOLDER/ca.conf -extensions v3_ca -in $CERTS_FOLDER/amphora-issuing-ca.csr -out $CERTS_FOLDER/amphora-issuing-ca.crt
        
        chown {{ sys_user }}:{{ sys_user }} $CERTS_FOLDER/*.crt $CERTS_FOLDER/*.srl
        
        # 6. Generate Base64 Strings
        CONTROLLER_B64=$(base64 -w0 $CERTS_FOLDER/amphora-controller.crt)
        ISSUING_CA_B64=$(base64 -w0 $CERTS_FOLDER/amphora-issuing-ca.crt)
        ROOT_CA_B64=$(base64 -w0 $CERTS_FOLDER/sunbeam-ca.crt)
        
        # 7. Dynamically generate the input file for the interactive prompt based on the YAML order
        > /home/{{ sys_user }}/amphora_answers.txt
        ENDPOINT_1=$($RUN_AS_LOGIN yq -r '.[0].endpoint' $CERTS_FOLDER/amphora_csrs.yaml)
        ENDPOINT_2=$($RUN_AS_LOGIN yq -r '.[1].endpoint' $CERTS_FOLDER/amphora_csrs.yaml)
        
        for ENDPOINT in "$ENDPOINT_1" "$ENDPOINT_2"; do
            if [ "$ENDPOINT" == "amphora-controller-cert" ]; then
                echo "$CONTROLLER_B64" >> $CERTS_FOLDER/amphora_answers.txt
                echo "$ROOT_CA_B64" >> $CERTS_FOLDER/amphora_answers.txt
                echo "" >> $CERTS_FOLDER/amphora_answers.txt # Blank line for empty CA chain
            elif [ "$ENDPOINT" == "amphora-issuing-ca" ]; then
                echo "$ISSUING_CA_B64" >> $CERTS_FOLDER/amphora_answers.txt
                echo "$ROOT_CA_B64" >> $CERTS_FOLDER/amphora_answers.txt
                echo "" >> $CERTS_FOLDER/amphora_answers.txt # Blank line for empty CA chain
            fi
        done
        
        chown -R {{ sys_user }}:{{ sys_user }} "$CERTS_FOLDER"
        
        # 8. Feed the answers into the Sunbeam prompt automatically
        echo "Providing signed certificates to Octavia..."
        run_sunbeam "sunbeam loadbalancer provide_certificates < $CERTS_FOLDER/amphora_answers.txt" "/tmp/sunbeam-amphora-certs.log"
        
        # 9. Apply Security Group Fix for MicroOVN
        # echo "Patching Amphora security group for OVN compatibility..."
        # $RUN_AS_LOGIN openstack security group rule create --protocol tcp --dst-port 9443 --ingress lb-mgmt-sec-grp
        
        # 10. Cleanup
        echo "Cleaning up Amphora TLS artifacts..."
        rm -f $CERTS_FOLDER/amphora_csrs.yaml
        rm -f $CERTS_FOLDER/amphora_answers.txt
        
        wait_for_app "octavia"
{% endif %}
    fi
{% endif %}
    
{% if os_add_masakari %}
    echo -e "\n${BYELLOW}-------- Enabling Masakari (Instances HA)... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE instance-recovery" "/tmp/sunbeam-masakari.log"; then
        wait_for_app "masakari"
    fi
{% endif %}
    
{% if os_add_heat %}
    echo -e "\n${BYELLOW}-------- Enabling Heat (Orchestration)... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE orchestration" "/tmp/sunbeam-heat.log"; then
        wait_for_app "heat"
    fi
{% endif %}
    
{% if os_add_designate %}
    echo -e "\n${BYELLOW}-------- Enabling Designate (DNS)... --------${NC}\n"
    if run_sunbeam "sunbeam enable -m $MANIFEST_FILE dns 'ns1.{{ tld if tld else 'maas' }}.'" "/tmp/sunbeam-designate.log"; then
        wait_for_app "designate"
    fi
{% endif %}
    
{% if os_add_magnum %}
    echo -e "\n${BYELLOW}-------- Enabling Magnum (Containers as a Service)... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE caas" "/tmp/sunbeam-magnum.log"
{% endif %}
    
{% if os_add_ldap %}
    echo -e "\n${BYELLOW}-------- Enabling LDAP... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE ldap" "/tmp/sunbeam-ldap.log"
{% endif %}
    
{% if os_add_images %}
    echo -e "\n${BYELLOW}-------- Enabling Image Sync... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE images-sync" "/tmp/sunbeam-images.log"
{% endif %}
    
{% if os_add_watcher %}
    echo -e "\n${BYELLOW}-------- Enabling Watcher (Resource Optimization)... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE resource-optimization" "/tmp/sunbeam-watcher.log"
{% endif %}
    
{% if os_add_telemetry %}
    echo -e "\n${BYELLOW}-------- Enabling Telemetry (Ceilometer/Aodh)... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE telemetry" "/tmp/sunbeam-telemetry.log"
{% endif %}
    
{% if os_add_manila %}
    echo -e "\n${BYELLOW}-------- Enabling Manila (Shared Filesystems)... --------${NC}\n"
    snap set openstack feature.shared-filesystem=true
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE shared-filesystem" "/tmp/sunbeam-manila.log"
{% endif %}
    
{% if os_add_maintenance %}
    echo -e "\n${BYELLOW}-------- Enabling Maintenance Mode... --------${NC}\n"
    snap set openstack feature.maintenance=true
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE maintenance" "/tmp/sunbeam-maintenance.log"
{% endif %}
    
{% if os_add_tempest %}
    echo -e "\n${BYELLOW}-------- Enabling Tempest (Validation)... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE validation" "/tmp/sunbeam-tempest.log"
{% endif %}
    
{% if os_add_cos %}
    echo -e "\n${BYELLOW}-------- Enabling Observability Stack (COS)... --------${NC}\n"
    run_sunbeam "sunbeam enable -m $MANIFEST_FILE observability embedded" "/tmp/sunbeam-cos.log"
{% endif %}
    
    echo -e "\n${BYELLOW}-------- Listing Enabled Optional Features... --------${NC}\n"
    
    $RUN_AS_LOGIN sunbeam list-features
    $RUN_AS_LOGIN sunbeam list-feature-gates
    
    echo -e "\n${BYELLOW}-------- Finished deploying Sunbeam, have fun!... --------${NC}\n"

# ==========================================
# END OF AUTOMATION SCRIPTS (00 to 15)
# ==========================================

runcmd:
- 00-generate-env
- 01-verify-deps || exit 1
- 02-maas-init
- 03-maas-networking || exit 1
- 04-maas-images || exit 1
- 05-lxd-setup
- 06-vm-creation
- 07-maas-enlist || exit 1
- 08-maas-configure
- 09-maas-commission || exit 1
- 10-maas-tagging
- 11-sunbeam-prep
- 12-sunbeam-bootstrap
- 13-sunbeam-deploy
- 14-sunbeam-configure
- 15-sunbeam-addons

